    // ============================================================
    const SelectionManager = {
        savedRange: null,
        editor: null,
        init() {
            this.editor = document.getElementById('editor');
            // Continuously remember the last in-editor selection
            const remember = () => {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                if (this.editor && this.editor.contains(range.commonAncestorContainer)) {
                    this.savedRange = range.cloneRange();
                }
            };
            document.addEventListener('selectionchange', remember);
            this.editor.addEventListener('mouseup', remember);
            this.editor.addEventListener('keyup', remember);
            this.editor.addEventListener('touchend', remember);
        },
        save() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (this.editor && this.editor.contains(range.commonAncestorContainer)) {
                    this.savedRange = range.cloneRange();
                    return true;
                }
            }
            return !!this.savedRange;
        },
        restore() {
            if (!this.savedRange) return false;
            try {
                this.editor.focus();
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(this.savedRange);
                return true;
            } catch (e) { return false; }
        },
        hasSelection() {
            return !!(this.savedRange && !this.savedRange.collapsed);
        }
    };

    // ============================================================
    //  UI HELPERS
    // ============================================================
    const UI = {
        $: id => document.getElementById(id),
        toggleSidebar(force) {
            const sb = UI.$('sidebar');
            const ov = UI.$('mobile-overlay');
            const isMobileOpen = sb.classList.contains('mobile-open');
            if (window.innerWidth > 768) {
                if (force === false) sb.classList.add('collapsed');
                else if (force === true) sb.classList.remove('collapsed');
                else sb.classList.toggle('collapsed');
                ov.classList.remove('active');
            } else {
                const shouldOpen = force !== undefined ? force : !isMobileOpen;
                if (shouldOpen) { sb.classList.add('mobile-open'); ov.classList.add('active'); }
                else { sb.classList.remove('mobile-open'); ov.classList.remove('active'); }
            }
        },
        toast(msg) {
            const t = UI.$('toast');
            t.innerText = msg;
            t.classList.add('visible');
            clearTimeout(UI._toastTimer);
            UI._toastTimer = setTimeout(() => t.classList.remove('visible'), 3000);
        },
        modal(html) {
            const w = UI.$('modal-wrap');
            UI.$('modal-content').innerHTML = html;
            w.style.display = 'flex';
            // Hide interactive overlay so its handles don't poke through the modal
            const io = UI.$('interactive-overlay');
            if (io) { io.dataset.prevDisplay = io.style.display || ''; io.style.display = 'none'; }
            // Allow Enter to fire the .btn-primary in the modal
            setTimeout(() => {
                const modal = UI.$('modal-content');
                const primary = modal.querySelector('.btn-primary');
                const inputs = modal.querySelectorAll('input:not([type="color"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]), select');
                inputs.forEach(inp => {
                    inp.addEventListener('keydown', e => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            if (primary) primary.click();
                        }
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            const cancel = modal.querySelector('.btn-ghost');
                            if (cancel) cancel.click();
                            else w.style.display = 'none';
                        }
                    });
                });
            }, 30);
            return {
                close: () => {
                    w.style.display = 'none';
                    const io = UI.$('interactive-overlay');
                    if (io) { InteractiveManager.scheduleUpdate(); }
                },
                root: UI.$('modal-content')
            };
        },
        prompt(title, cb, placeholder = "", initial = "") {
            const m = UI.modal(`<h3>${title}</h3><input id="prompt-in" placeholder="${placeholder}" value="${initial.replace(/"/g,'&quot;')}"><div class="modal-btns"><button class="btn btn-ghost" id="p-cancel">Cancel</button><button class="btn btn-primary" id="p-ok">OK</button></div>`);
            UI.$('p-cancel').onclick = m.close;
            UI.$('p-ok').onclick = () => { cb(UI.$('prompt-in').value); m.close(); };
            setTimeout(() => { const i = UI.$('prompt-in'); i.focus(); i.select && i.select(); }, 50);
            return m;
        },
        confirm(title, cb, cancelCb) {
            const m = UI.modal(`<h3>${title}</h3><div class="modal-btns"><button class="btn btn-ghost" id="c-cancel">Cancel</button><button class="btn btn-primary" id="c-ok">OK</button></div>`);
            UI.$('c-cancel').onclick = () => { if (cancelCb) cancelCb(); m.close(); };
            UI.$('c-ok').onclick = () => { cb(true); m.close(); };
        },
        renderCategories() {
            const catContainer = UI.$('toolbar-cats');
            catContainer.innerHTML = '';
            Object.keys(CATEGORIES).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24">${CATEGORIES[cat]}</svg> <span>${cat}</span>`;
                btn.onclick = () => UI.openCategory(cat);
                catContainer.appendChild(btn);
            });
        },
        openCategory(cat) {
            if (!currentDocId) return;
            const toolArea = UI.$('toolbar-tools-area');
            toolArea.innerHTML = '';
            TOOLS_CONFIG[cat].forEach(t => {
                if (t.type === 'sep') {
                    const d = document.createElement('div'); d.className = 'divider'; toolArea.appendChild(d);
                } else if (t.type === 'btn') {
                    const b = document.createElement('button');
                    b.className = 'tool-btn'; b.title = t.title || '';
                    const iconHtml = `<svg class="icon" viewBox="0 0 24 24">${t.icon || ICONS.palette}</svg>`;
                    b.innerHTML = `${iconHtml}<span>${t.title}</span>`;
                    b.onclick = () => {
                        UI.$('editor').focus();
                        if (t.cmd) document.execCommand(t.cmd, false, null);
                        else if (t.custom) App.handleCustom(t.custom);
                        UI.updateToolbarState();
                        App.autoSave();
                    };
                    if (t.cmd) b.dataset.cmd = t.cmd;
                    toolArea.appendChild(b);
                } else if (t.type === 'select') {
                    const s = document.createElement('select'); s.className = 'tool-select';
                    if (t.id) s.id = t.id;
                    t.opts.forEach(o => {
                        const op = document.createElement('option');
                        op.value = o[0]; op.innerText = o[1]; s.appendChild(op);
                    });
                    s.onchange = () => {
                        UI.$('editor').focus();
                        document.execCommand(t.cmd, false, s.value);
                        UI.updateToolbarState(); App.autoSave();
                    };
                    s.dataset.cmd = t.cmd; toolArea.appendChild(s);
                }
            });
            UI.$('toolbar-container').classList.add('show-tools');
            UI.updateToolbarState();
        },
        closeTools() { UI.$('toolbar-container').classList.remove('show-tools'); },
        updateToolbarState() {
            document.querySelectorAll('.tool-btn[data-cmd]').forEach(b => {
                try {
                    if (document.queryCommandState(b.dataset.cmd)) b.classList.add('active');
                    else b.classList.remove('active');
                } catch(e){}
            });
            const fontSelect = UI.$('font-fam');
            if (fontSelect) {
                let font = '';
                try { font = (document.queryCommandValue('fontName') || '').replace(/['"]+/g, ''); } catch(e){}
                let match = false;
                for (let i = 0; i < fontSelect.options.length; i++) {
                    if (fontSelect.options[i].value.toLowerCase() === font.toLowerCase()) { fontSelect.selectedIndex = i; match = true; break; }
                }
                if (!match) fontSelect.selectedIndex = -1;
            }
        }
    };

    // ============================================================
    //  COLOR PICKER (solid + linear/radial gradient) — universal
    // ============================================================
    const ColorPanel = {
        // mode: 'solid' | 'linear' | 'radial'
        // target: 'text' | 'background' | element callback
        open(opts) {
            opts = opts || {};
            const title = opts.title || 'Color';
            const initial = opts.initial || { mode:'solid', solid:'#6366f1', c1:'#ff6a00', c2:'#ee0979', angle:90, type:'linear' };
            const onApply = opts.onApply || function(){};
            const showText = opts.showTextOption !== false; // show "apply to text" toggle
            const isText = opts.isText || false;

            const swatches = ['#000000','#ffffff','#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e','#94a3b8','#475569','#1e293b','#0f172a','#fef3c7'];

            const m = UI.modal(`
                <h3>${title}</h3>
                <div class="color-tabs">
                    <div class="color-tab ${initial.mode==='solid'?'active':''}" data-m="solid">Solid</div>
                    <div class="color-tab ${initial.mode==='linear'?'active':''}" data-m="linear">Linear</div>
                    <div class="color-tab ${initial.mode==='radial'?'active':''}" data-m="radial">Radial</div>
                </div>
                <div id="cp-solid" style="display:${initial.mode==='solid'?'block':'none'}">
                    <div class="color-row"><input type="color" id="cp-solid-c" value="${initial.solid}"><label>Pick or enter HEX</label></div>
                    <input id="cp-solid-hex" value="${initial.solid}" placeholder="#000000">
                    <label>Swatches</label>
                    <div class="swatch-grid" id="cp-swatches"></div>
                </div>
                <div id="cp-grad" style="display:${initial.mode!=='solid'?'block':'none'}">
                    <div class="gradient-preview" id="cp-grad-preview"></div>
                    <div class="color-row">
                        <input type="color" id="cp-c1" value="${initial.c1}">
                        <input type="color" id="cp-c2" value="${initial.c2}">
                        <label>Stops</label>
                    </div>
                    <label>Angle / Position</label>
                    <input type="range" id="cp-angle" min="0" max="360" value="${initial.angle}">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Angle: <span id="cp-angle-val">${initial.angle}°</span></div>
                </div>
                ${showText ? `<div class="seg-row"><button data-apply="bg" class="${!isText?'active':''}">Background</button><button data-apply="text" class="${isText?'active':''}">Text</button></div>`:''}
                <div class="modal-btns">
                    <button class="btn btn-danger" id="cp-clear">Clear</button>
                    <button class="btn btn-ghost" id="cp-cancel">Cancel</button>
                    <button class="btn btn-primary" id="cp-apply">Apply</button>
                </div>`);

            const state = Object.assign({}, initial, { applyTo: isText ? 'text' : 'bg' });
            // Build swatches
            const sg = UI.$('cp-swatches');
            swatches.forEach(c => {
                const sw = document.createElement('div'); sw.className='swatch'; sw.style.background=c; sw.title=c;
                sw.onclick = ()=>{ UI.$('cp-solid-c').value=c; UI.$('cp-solid-hex').value=c; state.solid=c; };
                sg.appendChild(sw);
            });
            // Tabs
            UI.$('modal-content').querySelectorAll('.color-tab').forEach(tab=>{
                tab.onclick = () => {
                    UI.$('modal-content').querySelectorAll('.color-tab').forEach(x=>x.classList.remove('active'));
                    tab.classList.add('active');
                    const mode = tab.dataset.m;
                    state.mode = mode;
                    UI.$('cp-solid').style.display = mode==='solid'?'block':'none';
                    UI.$('cp-grad').style.display = mode!=='solid'?'block':'none';
                    updatePreview();
                };
            });
            // Apply target seg
            if (showText) {
                UI.$('modal-content').querySelectorAll('[data-apply]').forEach(btn=>{
                    btn.onclick = ()=>{
                        UI.$('modal-content').querySelectorAll('[data-apply]').forEach(x=>x.classList.remove('active'));
                        btn.classList.add('active');
                        state.applyTo = btn.dataset.apply;
                    };
                });
            }
            const updatePreview = () => {
                const css = ColorPanel.toCss(state);
                if (state.mode !== 'solid') UI.$('cp-grad-preview').style.background = css;
            };
            UI.$('cp-solid-c').oninput = e => { state.solid = e.target.value; UI.$('cp-solid-hex').value = state.solid; };
            UI.$('cp-solid-hex').oninput = e => { if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) { state.solid = e.target.value; UI.$('cp-solid-c').value = state.solid; } };
            UI.$('cp-c1').oninput = e => { state.c1 = e.target.value; updatePreview(); };
            UI.$('cp-c2').oninput = e => { state.c2 = e.target.value; updatePreview(); };
            UI.$('cp-angle').oninput = e => { state.angle = +e.target.value; UI.$('cp-angle-val').innerText = state.angle+'°'; updatePreview(); };
            updatePreview();

            UI.$('cp-cancel').onclick = m.close;
            UI.$('cp-clear').onclick = () => { onApply({ clear: true, applyTo: state.applyTo }); m.close(); };
            UI.$('cp-apply').onclick = () => { onApply({ css: ColorPanel.toCss(state), state: state, applyTo: state.applyTo }); m.close(); };
        },
        toCss(state) {
            if (state.mode === 'solid') return state.solid;
            if (state.mode === 'linear') return `linear-gradient(${state.angle}deg, ${state.c1}, ${state.c2})`;
            return `radial-gradient(circle, ${state.c1}, ${state.c2})`;
        }
    };

    // ============================================================
    //  INTERACTIVE MANAGER — smooth, mobile-friendly resize/drag
    //  Live column / row resizers for tables. rAF-throttled.
    // ============================================================
    const InteractiveManager = {
        activeTarget: null,
        activeCell: null,
        rafId: null,
        colResizers: [],
        rowResizers: [],

        init() {
            this.overlay = UI.$('interactive-overlay');
            this.dragHandle = UI.$('io-drag');
            this.resizeHandle = UI.$('io-resize');
            this.resizeW = UI.$('io-resize-w');
            this.resizeH = UI.$('io-resize-h');
            this.tableTools = UI.$('io-table-tools');
            this.sizePanel = UI.$('io-size-panel');
            this.scroller = UI.$('editor-scroller');
            this.editor = UI.$('editor');

            this.buildTableTools();

            // Use a single pointerdown listener; supports touch + mouse uniformly
            this.editor.addEventListener('pointerdown', e => this.checkTarget(e), true);

            this.scroller.addEventListener('scroll', () => this.scheduleUpdate(), { passive: true });
            window.addEventListener('resize', () => this.scheduleUpdate());
            this.editor.addEventListener('keyup', () => this.scheduleUpdate());
            this.editor.addEventListener('input', () => this.scheduleUpdate());

            this.bindResize(this.resizeHandle, 'both');
            this.bindResize(this.resizeW, 'w');
            this.bindResize(this.resizeH, 'h');
            this.bindDrag();
        },

        buildTableTools() {
            const tt = this.tableTools;
            tt.innerHTML = `
                <button title="Add Row Above" data-act="addRowUp">+R↑</button>
                <button title="Add Row Below" data-act="addRowDn">+R↓</button>
                <button title="Delete Row" data-act="delRow">−R</button>
                <div class="sep"></div>
                <button title="Add Col Left" data-act="addColL">+C←</button>
                <button title="Add Col Right" data-act="addColR">+C→</button>
                <button title="Delete Col" data-act="delCol">−C</button>
                <div class="sep"></div>
                <button title="Merge Right" data-act="mergeR">⇥</button>
                <button title="Merge Down" data-act="mergeD">⇩</button>
                <button title="Split Cell" data-act="split">✂</button>
                <div class="sep"></div>
                <button title="Cell Style" data-act="cellStyle">🎨 Cell</button>
                <button title="Table Style" data-act="tableStyle">🎨 Tbl</button>
                <button title="Borders" data-act="border">▦</button>
                <button title="Delete Table" data-act="delTable">🗑</button>
            `;
            tt.querySelectorAll('button').forEach(b => {
                b.addEventListener('click', e => {
                    e.preventDefault(); e.stopPropagation();
                    const act = b.dataset.act;
                    const T = TableManager;
                    if (act==='addRowUp') T.addRow(-1);
                    else if (act==='addRowDn') T.addRow(1);
                    else if (act==='delRow') T.deleteRow();
                    else if (act==='addColL') T.addCol(-1);
                    else if (act==='addColR') T.addCol(1);
                    else if (act==='delCol') T.deleteCol();
                    else if (act==='mergeR') T.mergeRight();
                    else if (act==='mergeD') T.mergeDown();
                    else if (act==='split') T.splitCell();
                    else if (act==='cellStyle') App.handleCustom('cellStyle');
                    else if (act==='tableStyle') App.handleCustom('tableStyle');
                    else if (act==='border') App.handleCustom('tableBorder');
                    else if (act==='delTable') T.deleteTable();
                });
            });
        },

        checkTarget(e) {
            const validTags = ['IMG', 'VIDEO', 'AUDIO', 'TABLE', 'HR'];
            let t = e.target;
            // ignore clicks on overlay components
            if (t.closest('#interactive-overlay')) return;

            // If the click landed on a nested element (e.g. a <span> inside
            // a <td>, or text inside a custom-shape), walk up to find the
            // first interactive ancestor inside the editor.
            const cell = t.closest && t.closest('td, th');
            if (cell && this.editor.contains(cell)) {
                this.activeCell = cell;
                this.activeTarget = cell.closest('TABLE');
                this.scheduleUpdate();
                return;
            }
            const interactive = t.closest && t.closest('img, video, audio, table, hr, .custom-shape');
            if (interactive && this.editor.contains(interactive)) {
                this.activeTarget = interactive;
                if (interactive.tagName !== 'TABLE') this.activeCell = null;
                this.scheduleUpdate();
                return;
            }
            // legacy direct-hit checks (kept for safety)
            if (validTags.includes(t.tagName) || (t.classList && t.classList.contains('custom-shape'))) {
                this.activeTarget = t;
                if (t.tagName !== 'TABLE') this.activeCell = null;
                this.scheduleUpdate();
            } else {
                this.activeTarget = null;
                this.activeCell = null;
                this.scheduleUpdate();
            }
        },

        scheduleUpdate() {
            if (this.rafId) return;
            this.rafId = requestAnimationFrame(() => {
                this.rafId = null;
                this.update();
            });
        },

        clearResizers() {
            this.colResizers.forEach(r=>r.remove());
            this.rowResizers.forEach(r=>r.remove());
            this.colResizers = [];
            this.rowResizers = [];
        },

        update() {
            if (!this.activeTarget || !this.editor.contains(this.activeTarget)) {
                this.overlay.style.display = 'none';
                this.tableTools.style.display = 'none';
                this.sizePanel.style.display = 'none';
                this.clearResizers();
                return;
            }
            const rect = this.activeTarget.getBoundingClientRect();
            const scrollerRect = this.scroller.getBoundingClientRect();

            this.overlay.style.display = 'block';
            this.overlay.style.top = (rect.top - scrollerRect.top + this.scroller.scrollTop) + 'px';
            this.overlay.style.left = (rect.left - scrollerRect.left + this.scroller.scrollLeft) + 'px';
            this.overlay.style.width = rect.width + 'px';
            this.overlay.style.height = rect.height + 'px';

            const tag = this.activeTarget.tagName;
            if (tag === 'TABLE') {
                this.tableTools.style.display = 'flex';
                this.sizePanel.style.display = 'none';
                this.buildColResizers();
                this.buildRowResizers();
            } else {
                this.tableTools.style.display = 'none';
                this.clearResizers();
                if (tag === 'IMG' || tag === 'VIDEO' || tag === 'AUDIO' || this.activeTarget.classList.contains('custom-shape')) {
                    this.sizePanel.style.display = 'flex';
                    this.buildSizePanel();
                } else {
                    this.sizePanel.style.display = 'none';
                }
            }
        },

        buildSizePanel() {
            const el = this.activeTarget;
            const sp = this.sizePanel;
            const w = el.offsetWidth, h = el.offsetHeight;
            sp.innerHTML = `
                <input type="number" id="sp-w" value="${w}" title="Width (px)">
                <input type="number" id="sp-h" value="${h}" title="Height (px)">
                <button data-sp="lock" title="Lock aspect">${el.dataset.lock==='1'?'🔒':'🔓'}</button>
                <button data-sp="25">25%</button>
                <button data-sp="50">50%</button>
                <button data-sp="75">75%</button>
                <button data-sp="100">100%</button>
                <button data-sp="auto">Auto</button>
                <button data-sp="left">⬅</button>
                <button data-sp="center">⬌</button>
                <button data-sp="right">➡</button>
                <button data-sp="style">🎨</button>
                <button data-sp="del">🗑</button>
            `;
            const ratio = w / Math.max(1,h);
            const apply = (newW, newH) => {
                if (typeof newW === 'number') el.style.width = newW + 'px';
                if (typeof newH === 'number') el.style.height = newH + 'px';
                this.scheduleUpdate(); App.autoSave();
            };
            UI.$('sp-w').oninput = e => {
                const v = parseFloat(e.target.value); if (!isFinite(v)) return;
                el.style.width = v + 'px';
                if (el.dataset.lock === '1') el.style.height = (v / ratio) + 'px';
                this.scheduleUpdate();
            };
            UI.$('sp-w').onchange = () => App.autoSave();
            UI.$('sp-h').oninput = e => {
                const v = parseFloat(e.target.value); if (!isFinite(v)) return;
                el.style.height = v + 'px';
                if (el.dataset.lock === '1') el.style.width = (v * ratio) + 'px';
                this.scheduleUpdate();
            };
            UI.$('sp-h').onchange = () => App.autoSave();
            sp.querySelectorAll('[data-sp]').forEach(b => {
                b.onclick = e => {
                    e.preventDefault(); e.stopPropagation();
                    const a = b.dataset.sp;
                    if (a === 'lock') { el.dataset.lock = el.dataset.lock === '1' ? '0' : '1'; b.innerText = el.dataset.lock==='1'?'🔒':'🔓'; }
                    else if (['25','50','75','100'].includes(a)) { el.style.width = a + '%'; el.style.height = 'auto'; this.scheduleUpdate(); App.autoSave(); }
                    else if (a === 'auto') { el.style.width = ''; el.style.height = ''; this.scheduleUpdate(); App.autoSave(); }
                    else if (a === 'left') { el.style.float = 'left'; el.style.display = 'block'; el.style.margin = '5px 10px 5px 0'; this.scheduleUpdate(); App.autoSave(); }
                    else if (a === 'right') { el.style.float = 'right'; el.style.display = 'block'; el.style.margin = '5px 0 5px 10px'; this.scheduleUpdate(); App.autoSave(); }
                    else if (a === 'center') { el.style.float = 'none'; el.style.display = 'block'; el.style.margin = '5px auto'; this.scheduleUpdate(); App.autoSave(); }
                    else if (a === 'style') { App.styleTarget(el); }
                    else if (a === 'del') { el.remove(); this.activeTarget = null; this.scheduleUpdate(); App.autoSave(); }
                };
            });
        },

        buildColResizers() {
            this.colResizers.forEach(r=>r.remove());
            this.colResizers = [];
            const table = this.activeTarget;
            const firstRow = table.querySelector('tr');
            if (!firstRow) return;
            const scrollerRect = this.scroller.getBoundingClientRect();
            const cells = Array.from(firstRow.children);
            for (let i = 0; i < cells.length - 1; i++) {
                const cell = cells[i];
                const rect = cell.getBoundingClientRect();
                const tRect = table.getBoundingClientRect();
                const handle = document.createElement('div');
                handle.className = 'col-resizer';
                handle.style.left = (rect.right - tRect.left - 7) + 'px';
                handle.style.top = '0';
                handle.style.height = table.offsetHeight + 'px';
                handle.dataset.idx = i;
                this.overlay.appendChild(handle);
                this.colResizers.push(handle);
                this.bindColResize(handle, i, cells);
            }
        },

        bindColResize(handle, idx, cells) {
            const table = this.activeTarget;
            handle.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                handle.classList.add('dragging');
                handle.setPointerCapture(e.pointerId);
                const startX = e.clientX;
                const leftCell = cells[idx], rightCell = cells[idx+1];
                const leftW = leftCell.offsetWidth, rightW = rightCell.offsetWidth;
                // Lock other column widths so only these two change
                Array.from(table.querySelectorAll('tr')).forEach(tr => {
                    Array.from(tr.children).forEach((c, i) => {
                        if (i !== idx && i !== idx+1 && !c.style.width) c.style.width = c.offsetWidth + 'px';
                    });
                });
                let pending = false;
                let lastDx = 0;
                const onMove = ev => {
                    lastDx = ev.clientX - startX;
                    if (pending) return;
                    pending = true;
                    requestAnimationFrame(() => {
                        pending = false;
                        // Apply to every row in this column pair
                        Array.from(table.querySelectorAll('tr')).forEach(tr => {
                            const l = tr.children[idx], r = tr.children[idx+1];
                            if (!l || !r) return;
                            const newL = Math.max(24, leftW + lastDx);
                            const newR = Math.max(24, rightW - lastDx);
                            l.style.width = newL + 'px';
                            r.style.width = newR + 'px';
                        });
                        handle.style.left = (parseFloat(handle.style.left) + (lastDx - (handle._lastDx||0))) + 'px';
                        handle._lastDx = lastDx;
                    });
                };
                const onUp = ev => {
                    handle.classList.remove('dragging');
                    try { handle.releasePointerCapture(e.pointerId); } catch(_){}
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    handle._lastDx = 0;
                    App.autoSave();
                    this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        },

        buildRowResizers() {
            const table = this.activeTarget;
            const rows = Array.from(table.querySelectorAll('tr'));
            const tRect = table.getBoundingClientRect();
            for (let i = 0; i < rows.length - 1; i++) {
                const row = rows[i];
                const rect = row.getBoundingClientRect();
                const handle = document.createElement('div');
                handle.className = 'row-resizer';
                handle.style.top = (rect.bottom - tRect.top - 7) + 'px';
                handle.style.left = '0';
                handle.style.width = table.offsetWidth + 'px';
                this.overlay.appendChild(handle);
                this.rowResizers.push(handle);
                this.bindRowResize(handle, i, rows);
            }
        },

        bindRowResize(handle, idx, rows) {
            handle.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                handle.classList.add('dragging');
                handle.setPointerCapture(e.pointerId);
                const startY = e.clientY;
                const row = rows[idx];
                const startH = row.offsetHeight;
                let lastDy = 0, pending = false;
                const onMove = ev => {
                    lastDy = ev.clientY - startY;
                    if (pending) return;
                    pending = true;
                    requestAnimationFrame(() => {
                        pending = false;
                        const h = Math.max(20, startH + lastDy);
                        row.style.height = h + 'px';
                        Array.from(row.children).forEach(c => c.style.height = h + 'px');
                        handle.style.top = (parseFloat(handle.style.top) + (lastDy - (handle._lastDy||0))) + 'px';
                        handle._lastDy = lastDy;
                    });
                };
                const onUp = () => {
                    handle.classList.remove('dragging');
                    try { handle.releasePointerCapture(e.pointerId); } catch(_){}
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    handle._lastDy = 0;
                    App.autoSave(); this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        },

        bindResize(handleEl, mode) {
            handleEl.addEventListener('pointerdown', e => {
                if (!this.activeTarget) return;
                e.preventDefault(); e.stopPropagation();
                handleEl.setPointerCapture(e.pointerId);
                const startX = e.clientX, startY = e.clientY;
                const startW = this.activeTarget.offsetWidth;
                const startH = this.activeTarget.offsetHeight;
                let pending = false, lastDx = 0, lastDy = 0;
                const onMove = ev => {
                    lastDx = ev.clientX - startX;
                    lastDy = ev.clientY - startY;
                    if (pending) return;
                    pending = true;
                    requestAnimationFrame(() => {
                        pending = false;
                        if (mode==='both' || mode==='w') this.activeTarget.style.width = Math.max(24, startW + lastDx) + 'px';
                        if (mode==='both' || mode==='h') this.activeTarget.style.height = Math.max(20, startH + lastDy) + 'px';
                        // Resize overlay live (cheap mutation, no recalc)
                        const rect = this.activeTarget.getBoundingClientRect();
                        const scrollerRect = this.scroller.getBoundingClientRect();
                        this.overlay.style.width = rect.width + 'px';
                        this.overlay.style.height = rect.height + 'px';
                        this.overlay.style.top = (rect.top - scrollerRect.top + this.scroller.scrollTop) + 'px';
                        this.overlay.style.left = (rect.left - scrollerRect.left + this.scroller.scrollLeft) + 'px';
                    });
                };
                const onUp = () => {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    try { handleEl.releasePointerCapture(e.pointerId); } catch(_){}
                    App.autoSave();
                    this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        },

        bindDrag() {
            this.dragHandle.addEventListener('pointerdown', e => {
                if (!this.activeTarget) return;
                e.preventDefault(); e.stopPropagation();
                this.dragHandle.setPointerCapture(e.pointerId);

                const ghost = this.activeTarget.cloneNode(true);
                ghost.style.position = 'fixed';
                ghost.style.opacity = '0.6';
                ghost.style.pointerEvents = 'none';
                ghost.style.zIndex = '9999';
                const rect = this.activeTarget.getBoundingClientRect();
                ghost.style.width = rect.width + 'px';
                ghost.style.height = rect.height + 'px';
                ghost.style.margin = '0';
                ghost.style.float = 'none';
                const offsetX = e.clientX - rect.left;
                const offsetY = e.clientY - rect.top;
                // Position the ghost immediately so it doesn't flash at 0,0
                ghost.style.left = (e.clientX - offsetX) + 'px';
                ghost.style.top = (e.clientY - offsetY) + 'px';
                document.body.appendChild(ghost);

                const onMove = ev => {
                    ghost.style.left = (ev.clientX - offsetX) + 'px';
                    ghost.style.top = (ev.clientY - offsetY) + 'px';
                };
                const onUp = ev => {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    try { this.dragHandle.releasePointerCapture(e.pointerId); } catch(_){}
                    ghost.remove();
                    let range;
                    if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(ev.clientX, ev.clientY);
                    else if (document.caretPositionFromPoint) {
                        const pos = document.caretPositionFromPoint(ev.clientX, ev.clientY);
                        if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
                    }
                    if (range && this.editor.contains(range.startContainer)) {
                        range.insertNode(this.activeTarget);
                        this.scheduleUpdate();
                        App.autoSave();
                    } else this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        }
    };

    // ============================================================
    //  TABLE MANAGER — row/col ops, merge, split, presets
    // ============================================================
    window.TableManager = {
        getActiveCell() {
            const IM = InteractiveManager;
            let cell = IM.activeCell;
            if (!cell && IM.activeTarget && IM.activeTarget.tagName === 'TABLE') {
                const tbody = IM.activeTarget.querySelector('tbody') || IM.activeTarget;
                if (tbody.children.length && tbody.children[0].children.length) {
                    cell = tbody.children[0].children[0];
                }
            }
            return cell;
        },
        addRow(offset) {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            const newTr = document.createElement('TR');
            for (let i = 0; i < tr.children.length; i++) {
                const td = document.createElement(tr.children[i].tagName);
                td.innerHTML = '&nbsp;';
                newTr.appendChild(td);
            }
            if (offset < 0) tbody.insertBefore(newTr, tr);
            else tbody.insertBefore(newTr, tr.nextSibling);
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        addCol(offset) {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            const cellIdx = Array.from(tr.children).indexOf(cell);
            Array.from(tbody.children).forEach(row => {
                const targetCell = row.children[cellIdx];
                const newCell = document.createElement(targetCell ? targetCell.tagName : 'TD');
                newCell.innerHTML = '&nbsp;';
                if (offset < 0) row.insertBefore(newCell, targetCell);
                else { if (targetCell) row.insertBefore(newCell, targetCell.nextSibling); else row.appendChild(newCell); }
            });
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        deleteRow() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            tr.remove();
            if (tbody.children.length === 0) {
                InteractiveManager.activeTarget.remove();
                InteractiveManager.activeTarget = null; InteractiveManager.activeCell = null;
            } else InteractiveManager.activeCell = tbody.children[0].children[0];
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        deleteCol() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            const cellIdx = Array.from(tr.children).indexOf(cell);
            Array.from(tbody.children).forEach(row => { if (row.children[cellIdx]) row.children[cellIdx].remove(); });
            if (tbody.children[0] && tbody.children[0].children.length === 0) {
                InteractiveManager.activeTarget.remove();
                InteractiveManager.activeTarget = null; InteractiveManager.activeCell = null;
            } else if (InteractiveManager.activeTarget) InteractiveManager.activeCell = tbody.children[0].children[0];
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        deleteTable() {
            if (InteractiveManager.activeTarget && InteractiveManager.activeTarget.tagName === 'TABLE') {
                InteractiveManager.activeTarget.remove();
                InteractiveManager.activeTarget = null; InteractiveManager.activeCell = null;
                App.autoSave(); InteractiveManager.scheduleUpdate();
            }
        },
        mergeRight() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR');
            const idx = Array.from(tr.children).indexOf(cell);
            const next = tr.children[idx + 1];
            if (!next) return;
            cell.innerHTML += ' ' + next.innerHTML;
            cell.colSpan = (cell.colSpan || 1) + (next.colSpan || 1);
            next.remove();
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        mergeDown() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR');
            const nextRow = tr.nextElementSibling;
            if (!nextRow) return;
            const idx = Array.from(tr.children).indexOf(cell);
            const below = nextRow.children[idx];
            if (!below) return;
            cell.innerHTML += ' ' + below.innerHTML;
            cell.rowSpan = (cell.rowSpan || 1) + (below.rowSpan || 1);
            below.remove();
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        splitCell() {
            const cell = this.getActiveCell(); if (!cell) return;
            const cs = cell.colSpan || 1;
            const rs = cell.rowSpan || 1;
            if (cs > 1) {
                cell.colSpan = 1;
                const tr = cell.closest('TR');
                for (let i = 1; i < cs; i++) {
                    const td = document.createElement(cell.tagName);
                    td.innerHTML = '&nbsp;';
                    tr.insertBefore(td, cell.nextSibling);
                }
            }
            if (rs > 1) {
                cell.rowSpan = 1;
                const tr = cell.closest('TR');
                const idx = Array.from(tr.children).indexOf(cell);
                let row = tr.nextElementSibling;
                for (let i = 1; i < rs; i++) {
                    if (!row) break;
                    const td = document.createElement(cell.tagName);
                    td.innerHTML = '&nbsp;';
                    if (row.children[idx]) row.insertBefore(td, row.children[idx]);
                    else row.appendChild(td);
                    row = row.nextElementSibling;
                }
            }
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        applyPreset(name) {
            const t = InteractiveManager.activeTarget;
            if (!t || t.tagName !== 'TABLE') return;
            t.dataset.styled = '1';
            t.style.borderCollapse = 'collapse';
            t.querySelectorAll('th, td').forEach(c => { c.style.border = ''; c.style.background = ''; c.style.color = ''; });
            if (name === 'plain') {
                t.querySelectorAll('th, td').forEach(c => c.style.border = '1px solid #94a3b8');
            } else if (name === 'striped') {
                t.querySelectorAll('th, td').forEach(c => c.style.border = '1px solid #94a3b8');
                t.querySelectorAll('tr').forEach((tr,i) => { if (i%2) tr.querySelectorAll('td,th').forEach(c=>c.style.background='#f1f5f9'); });
            } else if (name === 'minimal') {
                t.querySelectorAll('th, td').forEach(c => { c.style.border = 'none'; c.style.borderBottom = '1px solid #cbd5e1'; });
            } else if (name === 'colorful') {
                const first = t.querySelector('tr');
                if (first) first.querySelectorAll('td,th').forEach(c => { c.style.background='linear-gradient(135deg,#6366f1,#8b5cf6)'; c.style.color='#fff'; c.style.border='1px solid #4f46e5'; });
                t.querySelectorAll('tr:not(:first-child) td, tr:not(:first-child) th').forEach(c => c.style.border='1px solid #c7d2fe');
            } else if (name === 'bordered') {
                t.querySelectorAll('th, td').forEach(c => c.style.border = '2px solid #1e293b');
            }
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        applyBorder(spec) {
            const t = InteractiveManager.activeTarget;
            if (!t || t.tagName !== 'TABLE') return;
            t.dataset.styled = '1';
            const border = `${spec.width}px ${spec.style} ${spec.color}`;
            t.querySelectorAll('th, td').forEach(c => c.style.border = border);
            t.style.borderCollapse = spec.collapse ? 'collapse' : 'separate';
            if (!spec.collapse) t.style.borderSpacing = (spec.spacing||2)+'px';
            App.autoSave(); InteractiveManager.scheduleUpdate();
        }
    };

    // ============================================================
    //  FIND / REPLACE
    // ============================================================
    const FindReplace = {
        matches: [], idx: -1, term: '',
        open() {
            UI.$('find-bar').classList.add('active');
            setTimeout(() => UI.$('find-input').focus(), 50);
        },
        close() {
            UI.$('find-bar').classList.remove('active');
            this.clearHighlights();
        },
        clearHighlights() {
            const ed = UI.$('editor');
            ed.querySelectorAll('mark[data-find]').forEach(m => {
                const txt = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(txt, m);
            });
            ed.normalize();
            this.matches = []; this.idx = -1;
            UI.$('find-info').innerText = '0/0';
        },
        find(term) {
            this.clearHighlights();
            this.term = term;
            if (!term) return;
            const ed = UI.$('editor');
            const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null);
            const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            const nodes = [];
            let n;
            while ((n = walker.nextNode())) {
                if (re.test(n.nodeValue)) nodes.push(n);
                re.lastIndex = 0;
            }
            nodes.forEach(node => {
                const html = node.nodeValue.replace(re, m => `<mark data-find="1" style="background:#fef08a">${m}</mark>`);
                const span = document.createElement('span');
                span.innerHTML = html;
                node.parentNode.replaceChild(span, node);
                while (span.firstChild) span.parentNode.insertBefore(span.firstChild, span);
                span.remove();
            });
            this.matches = Array.from(ed.querySelectorAll('mark[data-find]'));
            this.idx = this.matches.length ? 0 : -1;
            UI.$('find-info').innerText = `${this.matches.length ? 1 : 0}/${this.matches.length}`;
            if (this.idx >= 0) this.scroll();
        },
        scroll() {
            if (this.idx < 0) return;
            this.matches.forEach(m => m.style.outline = '');
            const m = this.matches[this.idx];
            m.style.outline = '2px solid #f59e0b';
            m.scrollIntoView({ block: 'center', behavior: 'smooth' });
            UI.$('find-info').innerText = `${this.idx+1}/${this.matches.length}`;
        },
        next() { if (this.matches.length) { this.idx = (this.idx + 1) % this.matches.length; this.scroll(); } },
        prev() { if (this.matches.length) { this.idx = (this.idx - 1 + this.matches.length) % this.matches.length; this.scroll(); } },
        replace(repl) {
            if (this.idx < 0 || !this.matches.length) return;
            const m = this.matches[this.idx];
            const tn = document.createTextNode(repl);
            m.parentNode.replaceChild(tn, m);
            App.autoSave();
            this.find(this.term);
        },
        replaceAll(repl) {
            const ed = UI.$('editor');
            if (!this.term) return;
            const re = new RegExp(this.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            this.clearHighlights();
            const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null);
            const nodes = []; let n;
            while ((n = walker.nextNode())) nodes.push(n);
            nodes.forEach(node => { node.nodeValue = node.nodeValue.replace(re, repl); });
            App.autoSave();
            UI.toast('Replaced all matches');
        }
    };

    // ============================================================
    //  APP — IndexedDB, events, custom actions
    // ============================================================
    const App = {
        async init() {
            await this.initDB();
            this.bindEvents();
            InteractiveManager.init();
            SelectionManager.init();
            this.refreshFiles();
            UI.renderCategories();
            this.setNoFileState();
            const z = parseFloat(localStorage.getItem('zoom') || '1'); this.setZoom(z);
        },
        initDB() {
            return new Promise(r => {
                const req = indexedDB.open("UltHTMLWriter_V3", 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore("docs", { keyPath: "id", autoIncrement: true });
                req.onsuccess = e => { db = e.target.result; r(); };
            });
        },
        wrapSelection(customCSS) {
            // Try to use the live selection; if it has been lost (e.g. modal
            // stole focus), restore the last remembered editor selection.
            let sel = window.getSelection();
            const ed = UI.$('editor');
            const liveOk = sel && sel.rangeCount && !sel.isCollapsed &&
                           ed.contains(sel.getRangeAt(0).commonAncestorContainer);
            if (!liveOk) {
                if (!SelectionManager.restore()) {
                    UI.toast("Please select text first!");
                    return null;
                }
                sel = window.getSelection();
                if (!sel.rangeCount || sel.isCollapsed) {
                    UI.toast("Please select text first!");
                    return null;
                }
            }
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.cssText = customCSS;
            try {
                span.appendChild(range.extractContents());
                range.insertNode(span);
                // refresh saved range to point inside the new span
                const newRange = document.createRange();
                newRange.selectNodeContents(span);
                sel.removeAllRanges(); sel.addRange(newRange);
                SelectionManager.save();
                return span;
            } catch (e) { UI.toast("Error wrapping selection."); return null; }
        },

        // Wrapper for execCommand that restores the saved selection first
        execWithSelection(cmd, value) {
            const ed = UI.$('editor');
            const sel = window.getSelection();
            const liveOk = sel && sel.rangeCount && !sel.isCollapsed &&
                           ed.contains(sel.getRangeAt(0).commonAncestorContainer);
            if (!liveOk) {
                if (!SelectionManager.restore()) {
                    UI.toast("Please select text first!");
                    return false;
                }
            } else {
                ed.focus();
            }
            document.execCommand(cmd, false, value);
            SelectionManager.save();
            return true;
        },
        insertHTML(html) {
            UI.$('editor').focus();
            document.execCommand('insertHTML', false, html);
            App.autoSave();
        },

        // Universal style-target — opens ColorPanel for any element
        styleTarget(el, opts) {
            opts = opts || {};
            ColorPanel.open({
                title: opts.title || 'Style Element',
                showTextOption: opts.showTextOption !== false,
                isText: opts.isText || false,
                onApply: res => {
                    if (res.clear) {
                        if (res.applyTo === 'text') { el.style.background = ''; el.style.backgroundClip=''; el.style.webkitBackgroundClip=''; el.style.webkitTextFillColor=''; el.style.color = ''; }
                        else el.style.background = '';
                    } else {
                        if (res.applyTo === 'text') {
                            if (res.state.mode === 'solid') { el.style.color = res.css; el.style.background = ''; el.style.webkitBackgroundClip=''; el.style.webkitTextFillColor=''; }
                            else { el.style.background = res.css; el.style.webkitBackgroundClip = 'text'; el.style.backgroundClip = 'text'; el.style.webkitTextFillColor = 'transparent'; el.style.color = 'transparent'; }
                        } else {
                            el.style.background = res.css;
                        }
                    }
                    InteractiveManager.scheduleUpdate();
                    App.autoSave();
                }
            });
        },

        bindEvents() {
            const ed = UI.$('editor');
            ed.addEventListener('mouseup', UI.updateToolbarState);
            ed.addEventListener('keyup', () => { UI.updateToolbarState(); this.autoSave(); this.updateWordCount(); });
            ed.addEventListener('keydown', e => {
                if (!currentDocId) return;
                if (e.ctrlKey || e.metaKey) {
                    const key = e.key.toLowerCase();
                    let handled = false;
                    if (key === 'z') { if (e.shiftKey) document.execCommand('redo'); else document.execCommand('undo'); handled = true; }
                    else if (key === 'y') { document.execCommand('redo'); handled = true; }
                    else if (key === 'b') { document.execCommand('bold'); handled = true; }
                    else if (key === 'i') { document.execCommand('italic'); handled = true; }
                    else if (key === 'u') { document.execCommand('underline'); handled = true; }
                    else if (key === 's') { App.autoSave(); UI.toast("Saved"); handled = true; }
                    else if (key === 'f') { FindReplace.open(); handled = true; }
                    if (handled) { e.preventDefault(); UI.updateToolbarState(); App.autoSave(); }
                }
            });

            // Context Menu
            const cm = UI.$('context-menu');
            let contextTarget = null;
            ed.addEventListener('contextmenu', e => {
                if (!currentDocId) return;
                e.preventDefault();
                contextTarget = null;
                if (InteractiveManager.activeTarget) contextTarget = InteractiveManager.activeTarget;
                else if (window.getSelection().rangeCount > 0 && !window.getSelection().isCollapsed) contextTarget = "selection";
                else contextTarget = e.target;
                cm.style.display = 'block';
                let x = e.pageX, y = e.pageY;
                if (x + cm.offsetWidth > window.innerWidth) x = window.innerWidth - cm.offsetWidth - 10;
                if (y + cm.offsetHeight > window.innerHeight) y = window.innerHeight - cm.offsetHeight - 10;
                cm.style.left = x + 'px'; cm.style.top = y + 'px';
            });
            document.addEventListener('click', e => { if (!e.target.closest('#context-menu')) cm.style.display = 'none'; });

            document.querySelectorAll('.context-menu-item').forEach(item => {
                item.onclick = async () => {
                    const action = item.dataset.action;
                    ed.focus();
                    try {
                        if (action === 'cut') { document.execCommand('cut'); App.autoSave(); }
                        else if (action === 'copy') document.execCommand('copy');
                        else if (action === 'paste') {
                            try { const text = await navigator.clipboard.readText(); document.execCommand('insertText', false, text); App.autoSave(); }
                            catch (err) { UI.toast("Use Ctrl+V / long-press to paste."); }
                        }
                        else if (action === 'selectAll') document.execCommand('selectAll');
                        else if (action === 'clearFormat') { document.execCommand('removeFormat'); App.autoSave(); }
                        else if (action === 'styleTarget') {
                            let tgt = contextTarget;
                            if (tgt === "selection") tgt = App.wrapSelection("");
                            if (!tgt || !tgt.style) return;
                            App.styleTarget(tgt);
                        }
                        else if (action === 'setCss') {
                            let tgt = contextTarget;
                            if (tgt === "selection") tgt = App.wrapSelection("");
                            if (!tgt) return;
                            const m = UI.modal(`<h3>Set Custom CSS</h3><div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">Example: <code>border: 2px solid red; background: linear-gradient(red, blue);</code></div><textarea id="css-in">${tgt.style.cssText}</textarea><div class="modal-btns"><button class="btn btn-ghost" id="css-cancel">Cancel</button><button class="btn btn-primary" id="css-save">Apply</button></div>`);
                            UI.$('css-cancel').onclick = m.close;

        setZoom(z) {

        buildExportHTML(title, standalone) {
            const inner = UI.$('editor').innerHTML;
            const exportCss = `
                body { font-family: 'Times New Roman', serif; font-size: 16px; line-height: 1.6; max-width: 816px; margin: 30px auto; padding: 40px; color: #111; background: #fff; }
                table { border-collapse: collapse; margin: 10px 0; }
                table:not([data-styled]) { width: 100%; }
                table:not([data-styled]) td, table:not([data-styled]) th { border: 1px solid #94a3b8; padding: 8px; min-width: 24px; }
                td, th { padding: 8px; min-width: 24px; }
                img, video { max-width: 100%; }
                blockquote { border-left: 3px solid #6366f1; padding-left: 12px; margin: 10px 0; color: #475569; font-style: italic; }
                pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: monospace; }
                code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; font-family: monospace; }
                a { color: #6366f1; }
                .callout { padding: 12px 16px; border-left: 4px solid #6366f1; background: rgba(99,102,241,0.08); border-radius: 4px; margin: 10px 0; }
                .page-break { display: block; border-top: 2px dashed #cbd5e1; margin: 24px 0; page-break-after: always; }
                .columns-2 { column-count: 2; column-gap: 24px; }
                .columns-3 { column-count: 3; column-gap: 24px; }
                kbd { background:#eee; border:1px solid #aaa; border-bottom-width:2px; border-radius:4px; padding:1px 6px; font-family: monospace; font-size: 0.9em; }
                @media print { body { margin: 0; padding: 20mm; } }
            `;
            if (!standalone) return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title><style>${exportCss}</style></head><body>${inner}</body></html>`;
            return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>${exportCss}</style></head><body>${inner}</body></html>`;
        },

        htmlToMarkdown(html) {
            const tmp = document.createElement('div'); tmp.innerHTML = html;
            const conv = (el) => {
                if (el.nodeType === 3) return el.textContent;
                if (el.nodeType !== 1) return '';
                const tag = el.tagName.toLowerCase();
                const inner = Array.from(el.childNodes).map(conv).join('');
                switch (tag) {
                    case 'h1': return '\n# ' + inner + '\n';
                    case 'h2': return '\n## ' + inner + '\n';
                    case 'h3': return '\n### ' + inner + '\n';
                    case 'h4': return '\n#### ' + inner + '\n';
                    case 'h5': return '\n##### ' + inner + '\n';
                    case 'h6': return '\n###### ' + inner + '\n';
                    case 'b': case 'strong': return '**' + inner + '**';
                    case 'i': case 'em': return '*' + inner + '*';
                    case 'u': return '__' + inner + '__';
                    case 's': case 'strike': case 'del': return '~~' + inner + '~~';
                    case 'a': return '[' + inner + '](' + (el.href||'') + ')';
                    case 'img': return '![' + (el.alt||'') + '](' + el.src + ')';
                    case 'code': return '`' + inner + '`';
                    case 'pre': return '\n```\n' + inner + '\n```\n';
                    case 'blockquote': return '\n> ' + inner.replace(/\n/g, '\n> ') + '\n';
                    case 'br': return '\n';
                    case 'hr': return '\n---\n';
                    case 'li': return '- ' + inner + '\n';
                    case 'ul': case 'ol': return '\n' + inner + '\n';
                    case 'p': case 'div': return inner + '\n\n';
                    case 'table': {
                        const rows = Array.from(el.querySelectorAll('tr'));
                        if (!rows.length) return '';
                        let out = '\n';
                        rows.forEach((tr,i) => {
                            const cells = Array.from(tr.children).map(c => c.textContent.replace(/\n/g,' ').trim());
                            out += '| ' + cells.join(' | ') + ' |\n';
                            if (i===0) out += '|' + cells.map(()=>' --- ').join('|') + '|\n';
                        });
                        return out + '\n';
                    }
                    default: return inner;
                }
            };
            return Array.from(tmp.childNodes).map(conv).join('').replace(/\n{3,}/g,'\n\n').trim();
        },

        downloadBlob(blob, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); },

            }

            if (action === 'emoji') {
                const emojis = '😀😃😄😁😆😅🤣😂🙂🙃😉😊😇🥰😍🤩😘😗😚😙🥲😋😛😜🤪😝🤑🤗🤭🤫🤔🤐🤨😐😑😶😏😒🙄😬🤥😌😔😪🤤😴😷🤒🤕🤢🤮🤧🥵🥶🥴😵🤯🤠🥳🥸😎🤓🧐😕😟🙁☹️😮😯😲😳🥺😦😧😨😰😥😢😭😱😖😣😞😓😩😫🥱😤😡😠🤬😈👿💀☠️💩🤡👹👺👻👽👾🤖❤️🧡💛💞💚💙💜🤎🖤🤍💯💢💥💫💦💨🕳️💬🗨️👍👎👌✌️🤞🤟🤘🤙👈👉👆🖕👇☝️👏🙌👐🤝🙏✍️💅🤳💪🦾🦵🦶👂🦻👃🧠🫀🫁🦷🦴👀👁️👅👄🌹🌷🌸🌻🌼🌺🌿🍀🍁🍂🌾☘️🌳🌲🌴🌵🌶️🍅🍆🥑🥦🥬🥒🌽🥕🧄🧅🥔🍠🥐🥖🍞🥨🥯🧀🥚🍳🥞🧇🥓🥩🍗🍖🌭🍔🍟🍕🥪🌮🌯🥙🧆🍝🍜🍲🍛🍣🍱🥟🥠🥡🍦🍧🍨🍩🍪🎂🍰🧁🥧🍫🍬🍭🍮🍯🍼🥛☕🍵🧃🥤🧋🍶🍾🍷🍸🍹🍺🍻🥂🥃🧉⚽⚾🏀🏐🏈🏉🎾🥏🎳🏏🏑🏒🥍🏓🏸🥊🥋🎽🛹🛼🛷⛸️🥌🎿⛷️🏂🪂🏋️🤸⛹️🤺🤾🏌️🏇🧘🏄🏊🤽🚣🧗🚴🚵🏆🥇🥈🥉🏅🎖️🎗️🎟️🎫🚗🚕🚙🚌🚎🏎️🚓🚑🚒🚐🛻🚚🚛🚜🦯🦽🦼🛴🚲🛵🏍️🛺🚨🚔🚍🚘🚖🚡🚠🚟🚃🚋🚞🚝🚄🚅🚈🚂🚆🚇🚊🚉✈️🛫🛬🛩️💺🛰️🚀🛸🚁🛶⛵🚤🛥️🛳️⛴️🚢⌚📱📲💻⌨️🖥️🖨️🖱️🖲️🕹️🗜️💽💾💿📀📼📷📸📹🎥📽️🎞️📞☎️📟📠📺📻🎙️🎚️🎛️🧭⏱️⏲️⏰🕰️⌛⏳📡🔋🔌💡🔦🕯️🪔🧯🛢️💸💵💴💶💷🪙💰💳💎';
                const arr = Array.from(emojis);
                let html = '<h3>Insert Emoji</h3><div class="glyph-grid">';
                arr.forEach(e=>{ html += `<button data-e="${e}">${e}</button>`; });
                html += '</div><div class="modal-btns"><button class="btn btn-ghost" id="em-c">Cancel</button></div>';
                const m = UI.modal(html);
                m.root.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { App.insertHTML(b.dataset.e); m.close(); });
                UI.$('em-c').onclick = m.close;
            }
            if (action === 'symbol') {
                const syms = '© ® ™ § ¶ † ‡ • · … – — ‘ ’ “ ” « » ‹ › ° ± × ÷ ≈ ≠ ≤ ≥ ∞ √ ∑ ∏ ∫ ∆ µ π φ Ω α β γ δ ε ζ η θ λ ξ ρ σ τ ψ ω ½ ¼ ¾ ⅓ ⅔ ★ ☆ ♥ ♦ ♣ ♠ ♪ ♫ ☀ ☁ ☂ ☃ ❄ ✓ ✔ ✗ ✘ ➤ ➔ ⇒ ⇔ ← → ↑ ↓ ↔ € £ ¥ ¢ ₹ ₽ ₩'.split(' ');
                let html = '<h3>Insert Symbol</h3><div class="glyph-grid">';
                syms.forEach(s=>{ html += `<button data-s="${s}">${s}</button>`; });
                html += '</div><div class="modal-btns"><button class="btn btn-ghost" id="sy-c">Cancel</button></div>';
                const m = UI.modal(html);
                m.root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { App.insertHTML(b.dataset.s); m.close(); });
                UI.$('sy-c').onclick = m.close;
            }

            if (action === 'fullscreen') this.toggleFullscreen(true);
            if (action === 'source') {
                const src = UI.$('source-editor');
                if (src.style.display === 'block') {
                    UI.$('editor').innerHTML = src.value; src.style.display = 'none';
                    InteractiveManager.scheduleUpdate(); App.autoSave();
                } else {
                    src.value = UI.$('editor').innerHTML; src.style.display = 'block';
                    UI.toast("Editing Code. Toggle Source again to apply.");
                    InteractiveManager.overlay.style.display = 'none';
                }
            }

            // Layout
            if (action === 'cols1') App.wrapSelectionOrBlock(b => { b.classList.remove('columns-2','columns-3'); });
            if (action === 'cols2') App.wrapSelectionOrBlock(b => { b.classList.remove('columns-3'); b.classList.add('columns-2'); });
            if (action === 'cols3') App.wrapSelectionOrBlock(b => { b.classList.remove('columns-2'); b.classList.add('columns-3'); });
            if (action === 'pageBg') {
                ColorPanel.open({ title: 'Page Background', showTextOption: false, onApply: res => {
                    if (res.clear) UI.$('editor').style.background = '';
                    else UI.$('editor').style.background = res.css;
                    App.autoSave();
                }});
            }
            if (action === 'pageMargin') UI.prompt("Page padding (CSS, e.g. 60px or 40px 80px):", v => { if (v) { UI.$('editor').style.padding = v; App.autoSave(); } }, "60px");
            if (action === 'pageSize') {
                const m = UI.modal(`<h3>Page Size</h3>
                    <label>Preset</label>
                    <select id="ps-preset">
                      <option value="816">Letter (816px)</option>
                      <option value="794">A4 (794px)</option>
                      <option value="1000">Wide (1000px)</option>
                      <option value="100%">Full width</option>
                      <option value="custom">Custom</option>
                    </select>
                    <input id="ps-custom" placeholder="e.g. 900px or 80%">
                    <div class="modal-btns"><button class="btn btn-ghost" id="ps-c">Cancel</button><button class="btn btn-primary" id="ps-ok">Apply</button></div>`);
                UI.$('ps-c').onclick = m.close;
                UI.$('ps-ok').onclick = () => {
                    let v = UI.$('ps-preset').value;
                    if (v === 'custom') v = UI.$('ps-custom').value;
                    if (/^\d+$/.test(v)) v = v + 'px';
                    UI.$('editor').style.maxWidth = v; App.autoSave(); m.close();
                };
            }
            if (action === 'blockStyle') {
                const sel = window.getSelection();
                let block = null;
                if (sel && sel.rangeCount) {
                    let n = sel.getRangeAt(0).startContainer;
                    while (n && n !== UI.$('editor') && (n.nodeType !== 1 || !['P','H1','H2','H3','H4','H5','H6','LI','BLOCKQUOTE','DIV','PRE'].includes(n.tagName))) n = n.parentNode;
                    if (n && n !== UI.$('editor')) block = n;
                }
                if (!block) { UI.toast('Place cursor in a paragraph'); return; }
                App.styleTarget(block, { title: 'Style Block' });
            }

            // Table-specific style actions
            if (action === 'cellStyle') {
                const cell = TableManager.getActiveCell();
                if (!cell) { UI.toast('Select a cell first'); return; }
                App.styleTarget(cell, { title: 'Cell Style' });
            }
            if (action === 'tableStyle') {
                const t = InteractiveManager.activeTarget;
                if (!t || t.tagName !== 'TABLE') { UI.toast('Select a table first'); return; }
                App.styleTarget(t, { title: 'Table Style' });
            }
            if (action === 'tableBorder') {
                const t = InteractiveManager.activeTarget;
                if (!t || t.tagName !== 'TABLE') { UI.toast('Select a table first'); return; }
                const m = UI.modal(`<h3>Table Border</h3>
                    <label>Width (px)</label><input type="number" id="tb-w" value="1" min="0" max="10">
                    <label>Style</label>
                    <select id="tb-s"><option>solid</option><option>dashed</option><option>dotted</option><option>double</option><option>groove</option><option>ridge</option><option>none</option></select>
                    <label>Color</label><input type="color" id="tb-c" value="#94a3b8">
                    <label>Collapsed</label>
                    <select id="tb-col"><option value="1" selected>Yes</option><option value="0">No</option></select>
                    <label>Cell spacing (when not collapsed)</label><input type="number" id="tb-sp" value="2">
                    <div class="modal-btns"><button class="btn btn-ghost" id="tb-cancel">Cancel</button><button class="btn btn-primary" id="tb-ok">Apply</button></div>`);
                UI.$('tb-cancel').onclick = m.close;
                UI.$('tb-ok').onclick = () => {
                    TableManager.applyBorder({ width: +UI.$('tb-w').value||1, style: UI.$('tb-s').value, color: UI.$('tb-c').value, collapse: UI.$('tb-col').value==='1', spacing: +UI.$('tb-sp').value||2 });
                    m.close();
                };
            }
            if (action === 'tablePreset') {
                const t = InteractiveManager.activeTarget;
                if (!t || t.tagName !== 'TABLE') { UI.toast('Select a table first'); return; }
                const m = UI.modal(`<h3>Table Style Preset</h3>
                    <div class="export-btn-group">
                        <button class="btn btn-primary" data-pr="plain">Plain bordered</button>
                        <button class="btn btn-primary" data-pr="striped">Striped</button>
                        <button class="btn btn-primary" data-pr="minimal">Minimal (bottom rules only)</button>
                        <button class="btn btn-primary" data-pr="colorful">Colorful header</button>
                        <button class="btn btn-primary" data-pr="bordered">Heavy border</button>
                    </div>
                    <div class="modal-btns"><button class="btn btn-ghost" id="pr-c">Cancel</button></div>`);
                m.root.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { TableManager.applyPreset(b.dataset.pr); m.close(); });
                UI.$('pr-c').onclick = m.close;
            }

            // Toolbar Tools section
            if (action === 'find') FindReplace.open();
            if (action === 'spellcheck') {
                const cur = UI.$('editor').getAttribute('spellcheck') === 'false' ? 'true':'false';
                UI.$('editor').setAttribute('spellcheck', cur === 'true' ? 'false' : 'true');
                UI.toast('Spellcheck: ' + (cur==='true'?'OFF':'ON'));
            }
            if (action === 'clearAll') UI.confirm('Erase all content in this document?', () => { UI.$('editor').innerHTML = '<p><br></p>'; App.autoSave(); });
            if (action === 'wordTarget') UI.prompt('Word count target (0 to clear):', v => { wordTarget = parseInt(v||'0')||0; App.updateWordCount(); }, '500', String(wordTarget));
            if (action === 'zoomReset') App.setZoom(1);
        },

        wrapSelectionOrBlock(fn) {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            let n = sel.getRangeAt(0).startContainer;
            while (n && n !== UI.$('editor') && (n.nodeType !== 1 || !['P','H1','H2','H3','H4','H5','H6','DIV','BLOCKQUOTE'].includes(n.tagName))) n = n.parentNode;
            if (n && n !== UI.$('editor')) { fn(n); App.autoSave(); }
            else UI.toast('Place cursor in a block first');
        },

        toggleFullscreen(active) {
            if (active) { document.body.classList.add('fullscreen'); UI.toast("Press ESC or Long Hold to exit"); InteractiveManager.scheduleUpdate(); }
            else { document.body.classList.remove('fullscreen'); InteractiveManager.scheduleUpdate(); }
        },
        setNoFileState() {
            currentDocId = null;
            UI.$('editor').style.display = 'none'; UI.$('empty-state').style.display = 'flex';
            UI.$('doc-title').value = "Nothing"; UI.$('doc-title').classList.add('empty'); UI.$('doc-title').readOnly = true;
            UI.$('status-msg').innerText = "No File Selected"; UI.$('word-count').innerText = "0 Words";
            UI.closeTools(); InteractiveManager.activeTarget = null; InteractiveManager.scheduleUpdate();
        },
        async refreshFiles(query = '') {
            const tx = db.transaction("docs", "readonly");
            const store = tx.objectStore("docs");
            const req = store.getAll();
            req.onsuccess = () => {
                const list = UI.$('file-list'); list.innerHTML = '';
                const files = req.result.sort((a, b) => b.id - a.id);
                files.forEach(f => {
                    if (query && !f.title.toLowerCase().includes(query.toLowerCase())) return;
                    const el = document.createElement('div');
                    el.className = `file-item ${f.id === currentDocId ? 'active' : ''}`;
                    el.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg> <span>${f.title}</span>`;
                    el.onclick = () => this.loadDoc(f.id);
                    list.appendChild(el);
                });
            };
        },
        loadDoc(id) {
            const tx = db.transaction("docs", "readonly");
            tx.objectStore("docs").get(id).onsuccess = e => {
                const doc = e.target.result;
                if (doc) {
                    currentDocId = doc.id;
                    const ed = UI.$('editor'); ed.innerHTML = doc.content;
                    UI.$('empty-state').style.display = 'none'; ed.style.display = 'block';
                    ed.focus();
                    const titleInput = UI.$('doc-title');
                    titleInput.value = doc.title; titleInput.classList.remove('empty'); titleInput.readOnly = false;
                    UI.$('status-msg').innerText = "Ready";
                    this.updateWordCount();
                    if (isMobile) UI.toggleSidebar(false);
                    this.refreshFiles();
                    InteractiveManager.activeTarget = null; InteractiveManager.scheduleUpdate();
                    // Reset any lingering find/replace state from a previous doc
                    FindReplace.close();
                    SelectionManager.savedRange = null;
                    // Re-apply current zoom so marginBottom recalculates for the new content
                    App.setZoom(zoomLevel);
                }
            };
        },
        saveDoc(doc) {
            return new Promise(r => {
                const tx = db.transaction("docs", "readwrite");
                tx.objectStore("docs").put(doc).onsuccess = e => { currentDocId = e.target.result; r(currentDocId); };
            });
        },
        autoSave() {
            if (!currentDocId) return;
            clearTimeout(this.saveTimer);
            UI.$('status-msg').innerText = "Saving...";
            this.saveTimer = setTimeout(() => {
                this.saveDoc({ id: currentDocId, title: UI.$('doc-title').value, content: UI.$('editor').innerHTML }).then(() => {
                    UI.$('status-msg').innerText = "Saved"; this.refreshFiles();
                });
            }, 700);
        },
        updateWordCount() {
            const txt = UI.$('editor').innerText || "";
            const chars = txt.length;
            const count = txt.trim().length === 0 ? 0 : txt.trim().split(/\s+/).length;
            const readTime = Math.ceil(count / 200);
            let line = `${count} Words | ${chars} Chars | ${readTime} min read`;
            if (wordTarget > 0) {
                const pct = Math.min(100, Math.round(count / wordTarget * 100));
                line += ` | 🎯 ${count}/${wordTarget} (${pct}%)`;
            }
            UI.$('word-count').innerText = line;
        }
    };
    App.init();
    </script>
