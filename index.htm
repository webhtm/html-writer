    // ============================================================
    //  SELECTION MANAGER — saves/restores the editor selection so that
    //  opening a modal (which steals focus) does not destroy the range.
    // ============================================================
    const SelectionManager = {
        savedRange: null,      // last known caret/selection inside the editor
        richRange: null,       // last known NON-COLLAPSED selection inside the editor
        editor: null,
        init() {
            this.editor = document.getElementById('editor');
            const remember = () => {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                if (this.editor && this.editor.contains(range.commonAncestorContainer)) {
                    this.savedRange = range.cloneRange();
                    if (!range.collapsed) this.richRange = range.cloneRange();
                }
            };
            document.addEventListener('selectionchange', remember);
            ['mouseup','keyup','touchend','focus','input'].forEach(ev =>
                this.editor.addEventListener(ev, remember));
        },
        save() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (this.editor && this.editor.contains(range.commonAncestorContainer)) {
                    this.savedRange = range.cloneRange();
                    if (!range.collapsed) this.richRange = range.cloneRange();
                    return true;
                }
            }
            return !!this.savedRange;
        },
        valid(r) {
            return !!(r && r.startContainer && r.startContainer.isConnected &&
                      this.editor && this.editor.contains(r.startContainer) &&
                      this.editor.contains(r.endContainer));
        },
        apply(range) {
            try {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                this.savedRange = range.cloneRange();
                if (!range.collapsed) this.richRange = range.cloneRange();
                return true;
            } catch (e) { return false; }
        },
        restore() {
            // Prefer a live, still-valid non-collapsed selection.
            const sel = window.getSelection();
            if (sel && sel.rangeCount) {
                const live = sel.getRangeAt(0);
                if (this.editor.contains(live.commonAncestorContainer) && !live.collapsed) {
                    this.savedRange = live.cloneRange();
                    this.richRange = live.cloneRange();
                    return true;
                }
            }
            if (this.valid(this.richRange) && !this.richRange.collapsed) return this.apply(this.richRange.cloneRange());
            if (this.valid(this.savedRange)) return this.apply(this.savedRange.cloneRange());
            return false;
        },
        hasSelection() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount && !sel.isCollapsed &&
                this.editor && this.editor.contains(sel.getRangeAt(0).commonAncestorContainer)) return true;
            return this.valid(this.richRange) && !this.richRange.collapsed;
        },

        // ============================================================
        //  ensureRange() — THE fix for "formatting doesn't apply because
        //  the text unselects". Every formatting entry point calls this.
        //  Resolution order:
        //    1. live non-collapsed selection in the editor
        //    2. last remembered non-collapsed selection (still in DOM)
        //    3. the word under the caret
        //    4. the whole block the caret sits in
        //    5. the first block of the document (last resort)
        //  It always leaves a real, non-collapsed selection active, so
        //  execCommand / wrapSelection can never silently no-op.
        // ============================================================
        ensureRange(opts) {
            opts = opts || {};
            const ed = this.editor;
            if (!ed) return false;
            const sel = window.getSelection();

            // 1. live selection
            if (sel && sel.rangeCount && !sel.isCollapsed &&
                ed.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                this.save();
                return true;
            }
            // 2. remembered rich selection
            if (this.valid(this.richRange) && !this.richRange.collapsed) {
                if (this.apply(this.richRange.cloneRange())) return true;
            }
            if (opts.strict) return false;

            // 3/4. expand from the caret
            let caret = null;
            if (sel && sel.rangeCount && ed.contains(sel.getRangeAt(0).commonAncestorContainer)) caret = sel.getRangeAt(0);
            else if (this.valid(this.savedRange)) caret = this.savedRange;

            if (caret) {
                const word = this.wordRangeAt(caret);
                if (word && !word.collapsed) return this.apply(word);
                const block = this.blockRangeAt(caret);
                if (block && !block.collapsed) return this.apply(block);
            }
            // 5. first block with content
            const firstBlock = ed.querySelector('.page-body > *');
            if (firstBlock && firstBlock.textContent.length) {
                const r = document.createRange();
                r.selectNodeContents(firstBlock);
                return this.apply(r);
            }
            return false;
        },
        wordRangeAt(caret) {
            const node = caret.startContainer;
            if (!node || node.nodeType !== 3) return null;
            const text = node.nodeValue || '';
            let s = caret.startOffset, e = caret.startOffset;
            const isWord = c => c && /[^\s ]/.test(c);
            while (s > 0 && isWord(text[s - 1])) s--;
            while (e < text.length && isWord(text[e])) e++;
            if (s === e) return null;
            const r = document.createRange();
            r.setStart(node, s); r.setEnd(node, e);
            return r;
        },
        blockRangeAt(caret) {
            const BLOCKS = ['P','H1','H2','H3','H4','H5','H6','LI','BLOCKQUOTE','PRE','TD','TH','DIV','FIGCAPTION'];
            let n = caret.startContainer;
            if (n.nodeType === 3) n = n.parentNode;
            while (n && n !== this.editor && !(n.nodeType === 1 && BLOCKS.includes(n.tagName) && !n.classList.contains('page-body') && !n.classList.contains('doc-page'))) n = n.parentNode;
            if (!n || n === this.editor) return null;
            if (!n.textContent.length) return null;
            const r = document.createRange();
            r.selectNodeContents(n);
            return r;
        },
        // Attach to any control that must NOT steal the selection.
        // Blocking the default pointerdown behaviour keeps focus (and
        // therefore the selection) exactly where the user left it.
        protect(el) {
            if (!el || el.dataset.selProtected === '1') return el;
            el.dataset.selProtected = '1';
            const grab = (e) => { SelectionManager.save(); e.preventDefault(); };
            el.addEventListener('pointerdown', grab);
            el.addEventListener('mousedown', grab);
            return el;
        },
        // For controls that genuinely need focus (selects, text inputs):
        // remember the selection just before they take it.
        watch(el) {
            if (!el || el.dataset.selWatched === '1') return el;
            el.dataset.selWatched = '1';
            const grab = () => SelectionManager.save();
            el.addEventListener('pointerdown', grab, true);
            el.addEventListener('mousedown', grab, true);
            el.addEventListener('touchstart', grab, { capture: true, passive: true });
            el.addEventListener('focus', grab, true);
            return el;
        }
    };

    // ============================================================
    //  UI HELPERS
    // ============================================================
    const UI = {
        $: id => document.getElementById(id),
        toggleSidebar(force) {
            const sb = UI.$('sidebar');
            const ov = UI.$('mobile-overlay');
            const isMobileOpen = sb.classList.contains('mobile-open');
            if (window.innerWidth > 768) {
                if (force === false) sb.classList.add('collapsed');
                else if (force === true) sb.classList.remove('collapsed');
                else sb.classList.toggle('collapsed');
                ov.classList.remove('active');
            } else {
                const shouldOpen = force !== undefined ? force : !isMobileOpen;
                if (shouldOpen) { sb.classList.add('mobile-open'); ov.classList.add('active'); }
                else { sb.classList.remove('mobile-open'); ov.classList.remove('active'); }
            }
            UI.syncSidebarState();
        },
        // Mirrors the sidebar's open/closed state onto <body> so the
        // no-file screen knows whether it should show the inline file
        // picker (sidebar closed) or just a quiet message (sidebar open).
        syncSidebarState() {
            const sb = UI.$('sidebar');
            const closed = window.innerWidth > 768
                ? sb.classList.contains('collapsed')
                : !sb.classList.contains('mobile-open');
            document.body.classList.toggle('sb-closed', closed);
            if (closed && document.body.classList.contains('no-file')) {
                App.renderMobilePicker(UI.$('picker-search') ? UI.$('picker-search').value : '');
            }
            if (typeof Paginator !== 'undefined') Paginator.schedule();
        },
        toast(msg) {
            const t = UI.$('toast');
            t.innerText = msg;
            t.classList.add('visible');
            clearTimeout(UI._toastTimer);
            UI._toastTimer = setTimeout(() => t.classList.remove('visible'), 3000);
        },
        modal(html) {
            const w = UI.$('modal-wrap');
            UI.$('modal-content').innerHTML = html;
            w.style.display = 'flex';
            // Hide interactive overlay so its handles don't poke through the modal
            const io = UI.$('interactive-overlay');
            if (io) { io.dataset.prevDisplay = io.style.display || ''; io.style.display = 'none'; }
            // Allow Enter to fire the .btn-primary in the modal
            setTimeout(() => {
                const modal = UI.$('modal-content');
                const primary = modal.querySelector('.btn-primary');
                const inputs = modal.querySelectorAll('input:not([type="color"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea');
                inputs.forEach(inp => {
                    inp.addEventListener('keydown', e => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            if (primary) primary.click();
                        }
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            const cancel = modal.querySelector('.btn-ghost');
                            if (cancel) cancel.click();
                            else w.style.display = 'none';
                        }
                    });
                });
            }, 30);
            return {
                close: () => {
                    w.style.display = 'none';
                    // Wipe the contents so stale element IDs from a closed
                    // modal can never be picked up by the next one.
                    UI.$('modal-content').innerHTML = '';
                    const io = UI.$('interactive-overlay');
                    if (io) { InteractiveManager.scheduleUpdate(); }
                },
                root: UI.$('modal-content')
            };
        },
        prompt(title, cb, placeholder = "", initial = "") {
            const m = UI.modal(`<h3>${title}</h3><input id="prompt-in" placeholder="${placeholder}" value="${initial.replace(/"/g,'&quot;')}"><div class="modal-btns"><button class="btn btn-ghost" id="p-cancel">Cancel</button><button class="btn btn-primary" id="p-ok">OK</button></div>`);
            UI.$('p-cancel').onclick = m.close;
            UI.$('p-ok').onclick = () => { cb(UI.$('prompt-in').value); m.close(); };
            setTimeout(() => { const i = UI.$('prompt-in'); if (!i) return; i.focus(); i.select && i.select(); }, 50);
            return m;
        },
        confirm(title, cb, cancelCb) {
            const m = UI.modal(`<h3>${title}</h3><div class="modal-btns"><button class="btn btn-ghost" id="c-cancel">Cancel</button><button class="btn btn-primary" id="c-ok">OK</button></div>`);
            UI.$('c-cancel').onclick = () => { if (cancelCb) cancelCb(); m.close(); };
            UI.$('c-ok').onclick = () => { cb(true); m.close(); };
        },
        renderCategories() {
            const catContainer = UI.$('toolbar-cats');
            catContainer.innerHTML = '';
            Object.keys(CATEGORIES).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24">${CATEGORIES[cat]}</svg> <span>${cat}</span>`;
                btn.onclick = () => UI.openCategory(cat);
                catContainer.appendChild(btn);
            });
        },
        openCategory(cat) {
            if (!currentDocId) return;
            const toolArea = UI.$('toolbar-tools-area');
            toolArea.innerHTML = '';
            TOOLS_CONFIG[cat].forEach(t => {
                if (t.type === 'sep') {
                    const d = document.createElement('div'); d.className = 'divider'; toolArea.appendChild(d);
                } else if (t.type === 'btn') {
                    const b = document.createElement('button');
                    b.className = 'tool-btn'; b.title = t.title || '';
                    const iconHtml = `<svg class="icon" viewBox="0 0 24 24">${t.icon || ICONS.palette}</svg>`;
                    b.innerHTML = `${iconHtml}<span>${t.title}</span>`;
                    // Never let the toolbar steal the caret/selection.
                    SelectionManager.protect(b);
                    b.onclick = () => {
                        if (t.cmd) App.runCommand(t.cmd, null, t);
                        else if (t.custom) App.handleCustom(t.custom);
                        UI.updateToolbarState();
                        App.autoSave();
                    };
                    if (t.cmd) b.dataset.cmd = t.cmd;
                    toolArea.appendChild(b);
                } else if (t.type === 'select') {
                    const s = document.createElement('select'); s.className = 'tool-select';
                    if (t.id) s.id = t.id;
                    t.opts.forEach(o => {
                        const op = document.createElement('option');
                        op.value = o[0]; op.innerText = o[1]; s.appendChild(op);
                    });
                    // Selects must receive focus to open, so remember the
                    // selection right before that happens and restore it
                    // on change.
                    SelectionManager.watch(s);
                    s.onchange = () => {
                        App.runCommand(t.cmd, s.value, t);
                        UI.updateToolbarState(); App.autoSave();
                    };
                    s.dataset.cmd = t.cmd; toolArea.appendChild(s);
                }
            });
            UI.$('toolbar-container').classList.add('show-tools');
            UI.updateToolbarState();
        },
        closeTools() { UI.$('toolbar-container').classList.remove('show-tools'); },
        updateToolbarState() {
            document.querySelectorAll('.tool-btn[data-cmd]').forEach(b => {
                try {
                    if (document.queryCommandState(b.dataset.cmd)) b.classList.add('active');
                    else b.classList.remove('active');
                } catch(e){}
            });
            const fontSelect = UI.$('font-fam');
            if (fontSelect) {
                let font = '';
                try { font = (document.queryCommandValue('fontName') || '').replace(/['"]+/g, ''); } catch(e){}
                let match = false;
                for (let i = 0; i < fontSelect.options.length; i++) {
                    if (fontSelect.options[i].value.toLowerCase() === font.toLowerCase()) { fontSelect.selectedIndex = i; match = true; break; }
                }
                if (!match) fontSelect.selectedIndex = -1;
            }
        }
    };

    // ============================================================
    //  COLOR PICKER (solid + linear/radial gradient) — universal
    // ============================================================
    const ColorPanel = {
        open(opts) {
            opts = opts || {};
            const title = opts.title || 'Color';
            const initial = opts.initial || { mode:'solid', solid:'#6366f1', c1:'#ff6a00', c2:'#ee0979', angle:90, type:'linear' };
            const onApply = opts.onApply || function(){};
            const showText = opts.showTextOption !== false;
            const isText = opts.isText || false;

            const swatches = ['#000000','#ffffff','#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e','#94a3b8','#475569','#1e293b','#0f172a','#fef3c7'];

            const m = UI.modal(`
                <h3>${title}</h3>
                <div class="color-tabs">
                    <div class="color-tab ${initial.mode==='solid'?'active':''}" data-m="solid">Solid</div>
                    <div class="color-tab ${initial.mode==='linear'?'active':''}" data-m="linear">Linear</div>
                    <div class="color-tab ${initial.mode==='radial'?'active':''}" data-m="radial">Radial</div>
                </div>
                <div id="cp-solid" style="display:${initial.mode==='solid'?'block':'none'}">
                    <div class="color-row"><input type="color" id="cp-solid-c" value="${initial.solid}"><label>Pick or enter HEX</label></div>
                    <input id="cp-solid-hex" value="${initial.solid}" placeholder="#000000">
                    <label>Swatches</label>
                    <div class="swatch-grid" id="cp-swatches"></div>
                </div>
                <div id="cp-grad" style="display:${initial.mode!=='solid'?'block':'none'}">
                    <div class="gradient-preview" id="cp-grad-preview"></div>
                    <div class="color-row">
                        <input type="color" id="cp-c1" value="${initial.c1}">
                        <input type="color" id="cp-c2" value="${initial.c2}">
                        <label>Stops</label>
                    </div>
                    <label>Angle / Position</label>
                    <input type="range" id="cp-angle" min="0" max="360" value="${initial.angle}">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Angle: <span id="cp-angle-val">${initial.angle}°</span></div>
                </div>
                ${showText ? `<div class="seg-row"><button data-apply="bg" class="${!isText?'active':''}">Background</button><button data-apply="text" class="${isText?'active':''}">Text</button></div>`:''}
                <div class="modal-btns">
                    <button class="btn btn-danger" id="cp-clear">Clear</button>
                    <button class="btn btn-ghost" id="cp-cancel">Cancel</button>
                    <button class="btn btn-primary" id="cp-apply">Apply</button>
                </div>`);

            const state = Object.assign({}, initial, { applyTo: isText ? 'text' : 'bg' });
            // Build swatches
            const sg = UI.$('cp-swatches');
            swatches.forEach(c => {
                const sw = document.createElement('div'); sw.className='swatch'; sw.style.background=c; sw.title=c;
                sw.onclick = ()=>{ UI.$('cp-solid-c').value=c; UI.$('cp-solid-hex').value=c; state.solid=c; };
                sg.appendChild(sw);
            });
            // Tabs
            UI.$('modal-content').querySelectorAll('.color-tab').forEach(tab=>{
                tab.onclick = () => {
                    UI.$('modal-content').querySelectorAll('.color-tab').forEach(x=>x.classList.remove('active'));
                    tab.classList.add('active');
                    const mode = tab.dataset.m;
                    state.mode = mode;
                    UI.$('cp-solid').style.display = mode==='solid'?'block':'none';
                    UI.$('cp-grad').style.display = mode!=='solid'?'block':'none';
                    updatePreview();
                };
            });
            // Apply target seg
            if (showText) {
                UI.$('modal-content').querySelectorAll('[data-apply]').forEach(btn=>{
                    btn.onclick = ()=>{
                        UI.$('modal-content').querySelectorAll('[data-apply]').forEach(x=>x.classList.remove('active'));
                        btn.classList.add('active');
                        state.applyTo = btn.dataset.apply;
                    };
                });
            }
            const updatePreview = () => {
                const css = ColorPanel.toCss(state);
                if (state.mode !== 'solid') UI.$('cp-grad-preview').style.background = css;
            };
            UI.$('cp-solid-c').oninput = e => { state.solid = e.target.value; UI.$('cp-solid-hex').value = state.solid; };
            UI.$('cp-solid-hex').oninput = e => { if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) { state.solid = e.target.value; UI.$('cp-solid-c').value = state.solid; } };
            UI.$('cp-c1').oninput = e => { state.c1 = e.target.value; updatePreview(); };
            UI.$('cp-c2').oninput = e => { state.c2 = e.target.value; updatePreview(); };
            UI.$('cp-angle').oninput = e => { state.angle = +e.target.value; UI.$('cp-angle-val').innerText = state.angle+'°'; updatePreview(); };
            updatePreview();

            UI.$('cp-cancel').onclick = m.close;
            UI.$('cp-clear').onclick = () => { onApply({ clear: true, applyTo: state.applyTo }); m.close(); };
            UI.$('cp-apply').onclick = () => { onApply({ css: ColorPanel.toCss(state), state: state, applyTo: state.applyTo }); m.close(); };
        },
        toCss(state) {
            if (state.mode === 'solid') return state.solid;
            if (state.mode === 'linear') return `linear-gradient(${state.angle}deg, ${state.c1}, ${state.c2})`;
            return `radial-gradient(circle, ${state.c1}, ${state.c2})`;
        }
    };

    // ============================================================
    //  INTERACTIVE MANAGER — smooth, mobile-friendly resize/drag
    //  Live column / row resizers for tables. rAF-throttled.
    // ============================================================
    const InteractiveManager = {
        activeTarget: null,
        activeCell: null,
        rafId: null,
        colResizers: [],
        rowResizers: [],

        init() {
            this.overlay = UI.$('interactive-overlay');
            this.dragHandle = UI.$('io-drag');
            this.resizeHandle = UI.$('io-resize');
            this.resizeW = UI.$('io-resize-w');
            this.resizeH = UI.$('io-resize-h');
            this.tableTools = UI.$('io-table-tools');
            this.sizePanel = UI.$('io-size-panel');
            this.scroller = UI.$('editor-scroller');
            // The scroll container that actually scrolls is .scroll-inner;
            // the overlay lives inside it so handles scroll with content.
            this.scrollInner = UI.$('scroll-inner') || this.scroller;
            this.editor = UI.$('editor');

            this.buildTableTools();

            // Use a single pointerdown listener; supports touch + mouse uniformly
            this.editor.addEventListener('pointerdown', e => this.checkTarget(e), true);

            this.scrollInner.addEventListener('scroll', () => this.scheduleUpdate(), { passive: true });
            window.addEventListener('resize', () => this.scheduleUpdate());
            this.editor.addEventListener('keyup', () => this.scheduleUpdate());
            this.editor.addEventListener('input', () => this.scheduleUpdate());

            this.bindResize(this.resizeHandle, 'both');
            this.bindResize(this.resizeW, 'w');
            this.bindResize(this.resizeH, 'h');
            this.bindDrag();
        },

        iconSvg(name) {
            return `<svg viewBox="0 0 24 24">${ICONS[name]||ICONS.palette}</svg>`;
        },

        buildTableTools() {
            const tt = this.tableTools;
            tt.innerHTML = `
                <button title="Add Row Above" data-act="addRowUp">+R↑</button>
                <button title="Add Row Below" data-act="addRowDn">+R↓</button>
                <button title="Delete Row" data-act="delRow">−R</button>
                <div class="sep"></div>
                <button title="Add Col Left" data-act="addColL">+C←</button>
                <button title="Add Col Right" data-act="addColR">+C→</button>
                <button title="Delete Col" data-act="delCol">−C</button>
                <div class="sep"></div>
                <button title="Merge Right" data-act="mergeR">${this.iconSvg('merge')}</button>
                <button title="Merge Down" data-act="mergeD">${this.iconSvg('merge')}</button>
                <button title="Split Cell" data-act="split">${this.iconSvg('split')}</button>
                <div class="sep"></div>
                <button title="Cell Style" data-act="cellStyle">${this.iconSvg('palette')}</button>
                <button title="Table Style" data-act="tableStyle">${this.iconSvg('palette')}</button>
                <button title="Borders" data-act="border">${this.iconSvg('border')}</button>
                <button title="Delete Table" data-act="delTable">${this.iconSvg('trash')}</button>
            `;
            tt.querySelectorAll('button').forEach(b => {
                b.addEventListener('click', e => {
                    e.preventDefault(); e.stopPropagation();
                    const act = b.dataset.act;
                    const T = TableManager;
                    if (act==='addRowUp') T.addRow(-1);
                    else if (act==='addRowDn') T.addRow(1);
                    else if (act==='delRow') T.deleteRow();
                    else if (act==='addColL') T.addCol(-1);
                    else if (act==='addColR') T.addCol(1);
                    else if (act==='delCol') T.deleteCol();
                    else if (act==='mergeR') T.mergeRight();
                    else if (act==='mergeD') T.mergeDown();
                    else if (act==='split') T.splitCell();
                    else if (act==='cellStyle') App.handleCustom('cellStyle');
                    else if (act==='tableStyle') App.handleCustom('tableStyle');
                    else if (act==='border') App.handleCustom('tableBorder');
                    else if (act==='delTable') T.deleteTable();
                });
            });
        },

        checkTarget(e) {
            const validTags = ['IMG', 'VIDEO', 'AUDIO', 'TABLE', 'HR'];
            let t = e.target;
            // ignore clicks on overlay components
            if (t.closest('#interactive-overlay')) return;

            // Walk up: a click on an SVG/path/rect inside a .custom-shape
            // must select the shape wrapper, not the inner SVG element.
            const shapeWrap = t.closest && t.closest('.custom-shape');
            if (shapeWrap && this.editor.contains(shapeWrap)) {
                this.activeTarget = shapeWrap;
                this.activeCell = null;
                this.scheduleUpdate();
                FormatSidebar.setTarget(shapeWrap);
                return;
            }
            // If the click landed on a nested element (e.g. a <span> inside
            // a <td>), walk up to find the first interactive ancestor.
            const cell = t.closest && t.closest('td, th');
            if (cell && this.editor.contains(cell)) {
                this.activeCell = cell;
                this.activeTarget = cell.closest('TABLE');
                this.scheduleUpdate();
                return;
            }
            // Form fields behave like objects: selectable, sizable,
            // formattable — while staying fillable.
            const field = t.closest && t.closest('.doc-field, .doc-field-group');
            if (field && this.editor.contains(field)) {
                this.activeTarget = field;
                this.activeCell = null;
                this.scheduleUpdate();
                FormatSidebar.setTarget(field);
                return;
            }
            const interactive = t.closest && t.closest('img, video, audio, table, hr, .custom-shape');
            if (interactive && this.editor.contains(interactive)) {
                this.activeTarget = interactive;
                if (interactive.tagName !== 'TABLE') this.activeCell = null;
                this.scheduleUpdate();
                FormatSidebar.setTarget(interactive);
                return;
            }
            // legacy direct-hit checks (kept for safety)
            if (validTags.includes(t.tagName)) {
                this.activeTarget = t;
                if (t.tagName !== 'TABLE') this.activeCell = null;
                this.scheduleUpdate();
            } else {
                this.activeTarget = null;
                this.activeCell = null;
                this.scheduleUpdate();
            }
        },

        scheduleUpdate() {
            if (this.rafId) return;
            this.rafId = requestAnimationFrame(() => {
                this.rafId = null;
                this.update();
            });
        },

        clearResizers() {
            this.colResizers.forEach(r=>r.remove());
            this.rowResizers.forEach(r=>r.remove());
            this.colResizers = [];
            this.rowResizers = [];
        },

        update() {
            if (!this.activeTarget || !this.editor.contains(this.activeTarget)) {
                this._panelFor = null;
                this.overlay.style.display = 'none';
                this.tableTools.style.display = 'none';
                this.sizePanel.style.display = 'none';
                this.clearResizers();
                return;
            }
            const rect = this.activeTarget.getBoundingClientRect();
            const scrollerRect = this.scrollInner.getBoundingClientRect();

            // Position overlay in DOCUMENT space (scrollInner-local + scroll
            // offset). Overlay is NOT viewport-sticky — it scrolls naturally
            // with content and gets clipped by the scroller's overflow.
            this.overlay.style.display = 'block';
            this.overlay.style.top = (rect.top - scrollerRect.top + this.scrollInner.scrollTop) + 'px';
            this.overlay.style.left = (rect.left - scrollerRect.left + this.scrollInner.scrollLeft) + 'px';
            // 100% relative to the image/object: dimensions track the
            // target's actual bounding rect, not a clamped slice.
            this.overlay.style.width = rect.width + 'px';
            this.overlay.style.height = rect.height + 'px';

            const tag = this.activeTarget.tagName;
            if (tag === 'TABLE') {
                this.tableTools.style.display = 'flex';
                this.sizePanel.style.display = 'none';
                this.buildColResizers();
                this.buildRowResizers();
                this.positionFloatingBar(this.tableTools, 'top');
            } else {
                this.tableTools.style.display = 'none';
                this.clearResizers();
                const cls = this.activeTarget.classList;
                if (tag === 'IMG' || tag === 'VIDEO' || tag === 'AUDIO' ||
                    cls.contains('custom-shape') || cls.contains('doc-field') || cls.contains('doc-field-group')) {
                    this.sizePanel.style.display = 'flex';
                    // Only REBUILD when the selection actually changes.
                    // Rebuilding on every rAF destroyed the width/height
                    // inputs mid-keystroke, so they could never be typed in.
                    if (this._panelFor !== this.activeTarget) {
                        this._panelFor = this.activeTarget;
                        this.buildSizePanel();
                    } else {
                        this.refreshSizeInputs();
                    }
                    this.positionFloatingBar(this.sizePanel, 'top');
                } else {
                    this.sizePanel.style.display = 'none';
                }
            }
        },

        // ============================================================
        //  POSITION FLOATING BAR — places the bar in DOCUMENT space at the
        //  appropriate corner of the active object. In document space
        //  means: relative to the overlay (which itself is positioned in
        //  scrollInner coordinates), so the bar scrolls with the object.
        //  No viewport clamping — the overlay's parent scroller handles
        //  clipping naturally.
        // ============================================================
        positionFloatingBar(bar) {
            // Prefer just above the object; if that would land outside the
            // visible scroll area (object near the top of the viewport)
            // flip the bar underneath so its controls stay reachable.
            const objTop = this.activeTarget ? this.activeTarget.getBoundingClientRect().top : 0;
            const viewTop = this.scrollInner.getBoundingClientRect().top;
            const flip = (objTop - viewTop) < 62;
            bar.style.top = flip ? 'calc(100% + 10px)' : '-52px';
            bar.style.bottom = 'auto';
            bar.style.left = '0px';
            bar.style.right = 'auto';
        },
        // Keeps the numbers current without touching the DOM nodes the
        // user might be typing into.
        refreshSizeInputs() {
            const el = this.activeTarget;
            if (!el) return;
            const w = UI.$('sp-w'), h = UI.$('sp-h');
            const r = el.getBoundingClientRect();
            if (w && document.activeElement !== w) w.value = Math.round(r.width);
            if (h && document.activeElement !== h) h.value = Math.round(r.height);
        },

        // ============================================================
        //  SIZE PANEL — read displayed size correctly for shapes vs media.
        //  SHAPES are <span class="custom-shape"> wrapping an SVG; the
        //  SVG fills 100%/100% of the wrapper, so the wrapper's offsetWidth
        //  IS the visual size. For media (img/video/audio) same idea.
        //  We always read offsetWidth/Height (not style.width) so the
        //  displayed value matches what the user sees.
        // ============================================================
        getDisplaySize(el) {
            const r = el.getBoundingClientRect();
            // For shapes / media the bounding rect IS the visual box
            return { w: Math.round(r.width), h: Math.round(r.height) };
        },
        buildSizePanel() {
            const el = this.activeTarget;
            const sp = this.sizePanel;
            const isShape = el.classList.contains('custom-shape');
            const { w, h } = this.getDisplaySize(el);
            const isLocked = el.dataset.lock === '1';
            // For percent-width displays, show the % instead of px
            const inlineW = el.style.width || '';
            const isPercent = /%$/.test(inlineW.trim());
            sp.innerHTML = `
                <input type="number" id="sp-w" value="${w}" min="10" max="9999" title="Width (px)">
                <span style="font-size:11px;color:var(--text-muted);">×</span>
                <input type="number" id="sp-h" value="${h}" min="10" max="9999" title="Height (px)">
                <button data-sp="lock" title="Lock aspect ratio">${isLocked?'<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>':'<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>'}</button>
                <div class="sep" style="width:1px;height:24px;background:var(--border);margin:0 2px;"></div>
                <button data-sp="25" title="25% of page width">25%</button>
                <button data-sp="50" title="50% of page width">50%</button>
                <button data-sp="75" title="75% of page width">75%</button>
                <button data-sp="100" title="100% of page width">100%</button>
                <button data-sp="auto" title="Reset to default">Auto</button>
                <div class="sep" style="width:1px;height:24px;background:var(--border);margin:0 2px;"></div>
                <button data-sp="left" title="Float left"><svg viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg></button>
                <button data-sp="center" title="Center"><svg viewBox="0 0 24 24"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg></button>
                <button data-sp="right" title="Float right"><svg viewBox="0 0 24 24"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg></button>
                <div class="sep" style="width:1px;height:24px;background:var(--border);margin:0 2px;"></div>
                <button data-sp="fmt" title="Open formatting sidebar"><svg viewBox="0 0 24 24">${ICONS.effects}</svg></button>
                <button data-sp="style" title="Style (color/gradient/border)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="7.5" cy="10.5" r="1.5" fill="currentColor"/><circle cx="12" cy="7.5" r="1.5" fill="currentColor"/><circle cx="16.5" cy="10.5" r="1.5" fill="currentColor"/></svg></button>
                <button data-sp="del" title="Delete"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
            `;
            const ratio = (w || 1) / Math.max(1, h || 1);

            const setSize = (newW, newH, lock = el.dataset.lock === '1') => {
                if (typeof newW === 'number' && newW > 0) {
                    el.style.width = newW + 'px';
                    el.style.maxWidth = '100%';
                }
                if (typeof newH === 'number' && newH > 0) {
                    el.style.height = newH + 'px';
                }
                if (lock) {
                    if (typeof newW === 'number' && newH === undefined) {
                        el.style.height = (newW / ratio) + 'px';
                    } else if (typeof newH === 'number' && newW === undefined) {
                        el.style.width = (newH * ratio) + 'px';
                    }
                }
                // Refresh inputs so they show the new actual size
                const r2 = el.getBoundingClientRect();
                if (UI.$('sp-w')) UI.$('sp-w').value = Math.round(r2.width);
                if (UI.$('sp-h')) UI.$('sp-h').value = Math.round(r2.height);
                this.scheduleUpdate();
            };

            UI.$('sp-w').oninput = e => {
                const v = parseFloat(e.target.value);
                if (!isFinite(v) || v < 10) return;
                // Clear any percent width first
                el.style.width = '';
                setSize(v, undefined);
            };
            UI.$('sp-w').onchange = () => App.autoSave();
            UI.$('sp-h').oninput = e => {
                const v = parseFloat(e.target.value);
                if (!isFinite(v) || v < 10) return;
                setSize(undefined, v);
            };
            UI.$('sp-h').onchange = () => App.autoSave();

            sp.querySelectorAll('[data-sp]').forEach(b => {
                b.onclick = e => {
                    e.preventDefault(); e.stopPropagation();
                    const a = b.dataset.sp;
                    if (a === 'lock') {
                        el.dataset.lock = el.dataset.lock === '1' ? '0' : '1';
                        b.innerHTML = el.dataset.lock === '1'
                            ? '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
                            : '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
                    }
                    else if (['25','50','75','100'].includes(a)) {
                        // Use percentage width. Compute matching height from
                        // the page's content width so the shape doesn't get
                        // squished by 'height: auto' (which falls back to
                        // the SVG's intrinsic ratio only sometimes).
                        const page = el.closest('.doc-page') || UI.$('editor');
                        const pageW = page.clientWidth - parseFloat(getComputedStyle(page).paddingLeft) - parseFloat(getComputedStyle(page).paddingRight);
                        const pct = parseInt(a, 10);
                        const newW = Math.round(pageW * pct / 100);
                        const locked = el.dataset.lock === '1';
                        el.style.width = newW + 'px';
                        el.style.height = locked ? Math.round(newW / ratio) + 'px' : (h || 90) + 'px';
                        this.scheduleUpdate();
                        App.autoSave();
                    }
                    else if (a === 'auto') {
                        el.style.width = '';
                        el.style.height = '';
                        el.style.float = '';
                        el.style.margin = '5px';
                        // Reset to a sensible default for shapes; for media
                        // leave it to the browser (intrinsic size).
                        if (isShape) {
                            el.style.width = '120px';
                            el.style.height = '90px';
                        }
                        this.scheduleUpdate();
                        App.autoSave();
                    }
                    else if (a === 'left') {
                        el.style.float = 'left';
                        el.style.display = 'inline-block';
                        el.style.margin = '5px 10px 5px 0';
                        this.scheduleUpdate(); App.autoSave();
                    }
                    else if (a === 'right') {
                        el.style.float = 'right';
                        el.style.display = 'inline-block';
                        el.style.margin = '5px 0 5px 10px';
                        this.scheduleUpdate(); App.autoSave();
                    }
                    else if (a === 'center') {
                        el.style.float = 'none';
                        el.style.display = 'block';
                        el.style.margin = '10px auto';
                        this.scheduleUpdate(); App.autoSave();
                    }
                    else if (a === 'fmt') { FormatSidebar.setTarget(el); FormatSidebar.open(); }
                    else if (a === 'style') { App.styleTarget(el); }
                    else if (a === 'del') {
                        el.remove();
                        this.activeTarget = null;
                        this.scheduleUpdate();
                        App.autoSave();
                    }
                };
            });
        },

        buildColResizers() {
            this.colResizers.forEach(r=>r.remove());
            this.colResizers = [];
            const table = this.activeTarget;
            const firstRow = table.querySelector('tr');
            if (!firstRow) return;
            const cells = Array.from(firstRow.children);
            for (let i = 0; i < cells.length - 1; i++) {
                const cell = cells[i];
                const handle = document.createElement('div');
                handle.className = 'col-resizer';
                this.overlay.appendChild(handle);
                handle.dataset.idx = i;
                // Position it on the boundary between this cell and the
                // next, spanning the full table height. Without this the
                // handle was a 14x0 invisible box at the overlay origin.
                const cr = cell.getBoundingClientRect();
                const tr2 = table.getBoundingClientRect();
                handle.style.left = (cr.right - tr2.left - 7) + 'px';
                handle.style.top = '0px';
                handle.style.height = tr2.height + 'px';
                this.colResizers.push(handle);
                this.bindColResize(handle, i, cells);
            }
        },

        bindColResize(handle, idx, cells) {
            const table = this.activeTarget;
            handle.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                handle.classList.add('dragging');
                try { handle.setPointerCapture(e.pointerId); } catch(_){}
                const startX = e.clientX;
                const leftCell = cells[idx], rightCell = cells[idx+1];
                const leftW = leftCell.offsetWidth, rightW = rightCell.offsetWidth;
                // Lock other column widths so only these two change
                Array.from(table.querySelectorAll('tr')).forEach(tr => {
                    Array.from(tr.children).forEach((c, i) => {
                        if (i !== idx && i !== idx+1 && !c.style.width) c.style.width = c.offsetWidth + 'px';
                    });
                });
                let pending = false;
                let lastDx = 0;
                const onMove = ev => {
                    lastDx = ev.clientX - startX;
                    if (pending) return;
                    pending = true;
                    requestAnimationFrame(() => {
                        pending = false;
                        Array.from(table.querySelectorAll('tr')).forEach(tr => {
                            const l = tr.children[idx], r = tr.children[idx+1];
                            if (!l || !r) return;
                            const newL = Math.max(24, leftW + lastDx);
                            const newR = Math.max(24, rightW - lastDx);
                            l.style.width = newL + 'px';
                            r.style.width = newR + 'px';
                        });
                    });
                };
                const onUp = ev => {
                    handle.classList.remove('dragging');
                    try { handle.releasePointerCapture(e.pointerId); } catch(_){}
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    App.autoSave();
                    this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        },

        buildRowResizers() {
            // Must clear first - update() runs on every rAF, and without
            // this the overlay accumulated hundreds of orphan handles.
            this.rowResizers.forEach(r => r.remove());
            this.rowResizers = [];
            const table = this.activeTarget;
            const rows = Array.from(table.querySelectorAll('tr'));
            const tRect = table.getBoundingClientRect();
            for (let i = 0; i < rows.length - 1; i++) {
                const row = rows[i];
                const handle = document.createElement('div');
                handle.className = 'row-resizer';
                this.overlay.appendChild(handle);
                const rRect = row.getBoundingClientRect();
                handle.style.top = (rRect.bottom - tRect.top - 7) + 'px';
                handle.style.left = '0px';
                handle.style.width = tRect.width + 'px';
                this.rowResizers.push(handle);
                this.bindRowResize(handle, i, rows);
            }
        },

        bindRowResize(handle, idx, rows) {
            handle.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                handle.classList.add('dragging');
                try { handle.setPointerCapture(e.pointerId); } catch(_){}
                const startY = e.clientY;
                const row = rows[idx];
                const startH = row.offsetHeight;
                let pending = false, lastDy = 0;
                const onMove = ev => {
                    lastDy = ev.clientY - startY;
                    if (pending) return;
                    pending = true;
                    requestAnimationFrame(() => {
                        pending = false;
                        const h = Math.max(20, startH + lastDy);
                        row.style.height = h + 'px';
                        Array.from(row.children).forEach(c => c.style.height = h + 'px');
                    });
                };
                const onUp = () => {
                    handle.classList.remove('dragging');
                    try { handle.releasePointerCapture(e.pointerId); } catch(_){}
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    App.autoSave(); this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        },

        bindResize(handleEl, mode) {
            handleEl.addEventListener('pointerdown', e => {
                if (!this.activeTarget) return;
                e.preventDefault(); e.stopPropagation();
                try { handleEl.setPointerCapture(e.pointerId); } catch(_){}
                const startX = e.clientX, startY = e.clientY;
                const startW = this.activeTarget.offsetWidth;
                const startH = this.activeTarget.offsetHeight;
                const isShape = this.activeTarget.classList.contains('custom-shape');
                const isLocked = this.activeTarget.dataset.lock === '1';
                // Aspect ratio of the original visual box
                const aspect = startW / Math.max(1, startH);
                let pending = false, lastDx = 0, lastDy = 0;
                const onMove = ev => {
                    lastDx = ev.clientX - startX;
                    lastDy = ev.clientY - startY;
                    if (pending) return;
                    pending = true;
                    requestAnimationFrame(() => {
                        pending = false;
                        const target = this.activeTarget;
                        let newW = startW, newH = startH;
                        if (mode === 'both' || mode === 'w') newW = Math.max(20, startW + lastDx);
                        if (mode === 'both' || mode === 'h') newH = Math.max(20, startH + lastDy);
                        // Aspect lock: SE handle (mode=both) keeps the
                        // original aspect ratio so shapes don't squash.
                        if (mode === 'both' && isShape && isLocked) {
                            // Drive from the larger dimension change
                            const dW = newW - startW;
                            const dH = newH - startH;
                            if (Math.abs(dW) > Math.abs(dH)) {
                                newH = newW / aspect;
                            } else {
                                newW = newH * aspect;
                            }
                        }
                        target.style.width = Math.round(newW) + 'px';
                        target.style.height = Math.round(newH) + 'px';
                        // Resize overlay live (cheap mutation, no recalc)
                        const rect = target.getBoundingClientRect();
                        const scrollerRect = this.scrollInner.getBoundingClientRect();
                        this.overlay.style.width = rect.width + 'px';
                        this.overlay.style.height = rect.height + 'px';
                        this.overlay.style.top = (rect.top - scrollerRect.top + this.scrollInner.scrollTop) + 'px';
                        this.overlay.style.left = (rect.left - scrollerRect.left + this.scrollInner.scrollLeft) + 'px';
                        if (target.tagName === 'TABLE') {
                            this.clearResizers();
                            this.buildColResizers();
                            this.buildRowResizers();
                        }
                        // Update size panel inputs live so they reflect the
                        // current drag value (for shape / media).
                        const spW = UI.$('sp-w'), spH = UI.$('sp-h');
                        if (spW) spW.value = Math.round(rect.width);
                        if (spH) spH.value = Math.round(rect.height);
                    });
                };
                const onUp = () => {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    try { handleEl.releasePointerCapture(e.pointerId); } catch(_){}
                    App.autoSave();
                    this.scheduleUpdate();
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        },

        // ============================================================
        //  DRAG — REAL-TIME. The ACTUAL element follows the cursor (no
        //  ghost preview, no insert-on-drop). Position is calculated from
        //  the caret hit-test under the cursor each frame, so the object
        //  re-flows with the surrounding text live.
        // ============================================================
        bindDrag() {
            this.dragHandle.addEventListener('pointerdown', e => {
                if (!this.activeTarget) return;
                e.preventDefault(); e.stopPropagation();
                try { this.dragHandle.setPointerCapture(e.pointerId); } catch(_){}

                const target = this.activeTarget;
                const rect = target.getBoundingClientRect();
                const grabOffsetX = e.clientX - rect.left;
                const grabOffsetY = e.clientY - rect.top;

                // Take target out of layout flow so it can move freely.
                // We measure its dimensions BEFORE pulling it out.
                const w = target.offsetWidth, h = target.offsetHeight;
                const prevPosition = target.style.position;
                const prevTop = target.style.top;
                const prevLeft = target.style.left;
                const prevFloat = target.style.float;
                const prevDisplay = target.style.display;
                const prevMargin = target.style.margin;
                const prevZ = target.style.zIndex;
                const prevVisibility = target.style.visibility;
                const prevTransform = target.style.transform;

                target.style.position = 'fixed';
                target.style.left = rect.left + 'px';
                target.style.top = rect.top + 'px';
                target.style.float = 'none';
                target.style.display = 'inline-block';
                target.style.margin = '0';
                target.style.zIndex = '9999';
                target.style.visibility = 'visible';
                // Slight scale + shadow so it feels "lifted"
                target.style.transform = 'scale(1.02)';
                target.style.boxShadow = '0 10px 30px rgba(20, 24, 50, 0.25)';
                target.style.transition = 'transform 0.1s ease, box-shadow 0.15s ease';
                target.style.cursor = 'grabbing';

                let lastValidRange = null;
                let currentRange = null;
                let dragMoved = false;

                // Caret hit-test: where in the editor would we drop?
                const findCaret = (x, y) => {
                    let range = null;
                    if (document.caretRangeFromPoint) {
                        range = document.caretRangeFromPoint(x, y);
                    } else if (document.caretPositionFromPoint) {
                        const pos = document.caretPositionFromPoint(x, y);
                        if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
                    }
                    if (range && this.editor.contains(range.startContainer)) {
                        return range;
                    }
                    return null;
                };

                const onMove = ev => {
                    dragMoved = true;
                    // Move the actual element to follow the cursor (fixed
                    // positioning relative to the viewport, so it tracks
                    // the mouse 1:1 with no layout lag).
                    target.style.left = (ev.clientX - grabOffsetX) + 'px';
                    target.style.top = (ev.clientY - grabOffsetY) + 'px';

                    const range = findCaret(ev.clientX, ev.clientY);
                    if (range) {
                        currentRange = range;
                        lastValidRange = range;
                        target.style.cursor = 'grabbing';
                        target.style.boxShadow = '0 10px 30px rgba(91, 108, 219, 0.35)';
                    } else {
                        currentRange = null;
                        target.style.cursor = 'not-allowed';
                        target.style.boxShadow = '0 10px 30px rgba(217, 76, 94, 0.4)';
                    }
                };

                const cleanup = () => {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    try { this.dragHandle.releasePointerCapture(e.pointerId); } catch(_){}
                };

                const restoreStyle = () => {
                    target.style.position = prevPosition;
                    target.style.top = prevTop;
                    target.style.left = prevLeft;
                    target.style.float = prevFloat;
                    target.style.display = prevDisplay;
                    target.style.margin = prevMargin;
                    target.style.zIndex = prevZ;
                    target.style.visibility = prevVisibility;
                    target.style.transform = prevTransform;
                    target.style.boxShadow = '';
                    target.style.transition = '';
                    target.style.cursor = '';
                };

                const onUp = ev => {
                    const range = currentRange || lastValidRange;
                    cleanup();
                    if (range && this.editor.contains(range.startContainer) && dragMoved) {
                        // Re-insert the target at the caret. The element
                        // is currently `position:fixed` so insertNode will
                        // move it back into the document flow at the drop
                        // position. Then we clear the fixed styling.
                        try {
                            range.insertNode(target);
                            restoreStyle();
                            this.scheduleUpdate();
                            App.autoSave();
                            return;
                        } catch (err) {
                            restoreStyle();
                            this.scheduleUpdate();
                            UI.toast("Could not move element here");
                            return;
                        }
                    } else {
                        restoreStyle();
                        this.scheduleUpdate();
                        if (!dragMoved) return;
                        UI.toast("Returned to original position");
                    }
                };
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        }
    };

    // ============================================================
    //  TABLE MANAGER — row/col ops, merge, split, presets
    // ============================================================
    window.TableManager = {
        getActiveCell() {
            const IM = InteractiveManager;
            let cell = IM.activeCell;
            if (!cell && IM.activeTarget && IM.activeTarget.tagName === 'TABLE') {
                const tbody = IM.activeTarget.querySelector('tbody') || IM.activeTarget;
                if (tbody.children.length && tbody.children[0].children.length) {
                    cell = tbody.children[0].children[0];
                }
            }
            return cell;
        },
        addRow(offset) {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            const newTr = document.createElement('TR');
            for (let i = 0; i < tr.children.length; i++) {
                const td = document.createElement(tr.children[i].tagName);
                td.innerHTML = '&nbsp;';
                newTr.appendChild(td);
            }
            if (offset < 0) tbody.insertBefore(newTr, tr);
            else tbody.insertBefore(newTr, tr.nextSibling);
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        addCol(offset) {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            const cellIdx = Array.from(tr.children).indexOf(cell);
            Array.from(tbody.children).forEach(row => {
                const targetCell = row.children[cellIdx];
                const newCell = document.createElement(targetCell ? targetCell.tagName : 'TD');
                newCell.innerHTML = '&nbsp;';
                if (offset < 0) row.insertBefore(newCell, targetCell);
                else { if (targetCell) row.insertBefore(newCell, targetCell.nextSibling); else row.appendChild(newCell); }
            });
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        deleteRow() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            tr.remove();
            if (tbody.children.length === 0) {
                InteractiveManager.activeTarget.remove();
                InteractiveManager.activeTarget = null; InteractiveManager.activeCell = null;
            } else InteractiveManager.activeCell = tbody.children[0].children[0];
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        deleteCol() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR'); const tbody = tr.parentNode;
            const cellIdx = Array.from(tr.children).indexOf(cell);
            Array.from(tbody.children).forEach(row => { if (row.children[cellIdx]) row.children[cellIdx].remove(); });
            if (tbody.children[0] && tbody.children[0].children.length === 0) {
                InteractiveManager.activeTarget.remove();
                InteractiveManager.activeTarget = null; InteractiveManager.activeCell = null;
            } else if (InteractiveManager.activeTarget) InteractiveManager.activeCell = tbody.children[0].children[0];
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        deleteTable() {
            if (InteractiveManager.activeTarget && InteractiveManager.activeTarget.tagName === 'TABLE') {
                InteractiveManager.activeTarget.remove();
                InteractiveManager.activeTarget = null; InteractiveManager.activeCell = null;
                App.autoSave(); InteractiveManager.scheduleUpdate();
            }
        },
        mergeRight() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR');
            const idx = Array.from(tr.children).indexOf(cell);
            const next = tr.children[idx + 1];
            if (!next) return;
            cell.innerHTML += ' ' + next.innerHTML;
            cell.colSpan = (cell.colSpan || 1) + (next.colSpan || 1);
            next.remove();
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        mergeDown() {
            const cell = this.getActiveCell(); if (!cell) return;
            const tr = cell.closest('TR');
            const nextRow = tr.nextElementSibling;
            if (!nextRow) return;
            const idx = Array.from(tr.children).indexOf(cell);
            const below = nextRow.children[idx];
            if (!below) return;
            cell.innerHTML += ' ' + below.innerHTML;
            cell.rowSpan = (cell.rowSpan || 1) + (below.rowSpan || 1);
            below.remove();
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        splitCell() {
            const cell = this.getActiveCell(); if (!cell) return;
            const cs = cell.colSpan || 1;
            const rs = cell.rowSpan || 1;
            if (cs > 1) {
                cell.colSpan = 1;
                const tr = cell.closest('TR');
                for (let i = 1; i < cs; i++) {
                    const td = document.createElement(cell.tagName);
                    td.innerHTML = '&nbsp;';
                    tr.insertBefore(td, cell.nextSibling);
                }
            }
            if (rs > 1) {
                cell.rowSpan = 1;
                const tr = cell.closest('TR');
                const idx = Array.from(tr.children).indexOf(cell);
                let row = tr.nextElementSibling;
                for (let i = 1; i < rs; i++) {
                    if (!row) break;
                    const td = document.createElement(cell.tagName);
                    td.innerHTML = '&nbsp;';
                    if (row.children[idx]) row.insertBefore(td, row.children[idx]);
                    else row.appendChild(td);
                    row = row.nextElementSibling;
                }
            }
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        applyPreset(name) {
            const t = InteractiveManager.activeTarget;
            if (!t || t.tagName !== 'TABLE') return;
            t.dataset.styled = '1';
            t.style.borderCollapse = 'collapse';
            t.querySelectorAll('th, td').forEach(c => { c.style.border = ''; c.style.background = ''; c.style.color = ''; });
            if (name === 'plain') {
                t.querySelectorAll('th, td').forEach(c => c.style.border = '1px solid #94a3b8');
            } else if (name === 'striped') {
                t.querySelectorAll('th, td').forEach(c => c.style.border = '1px solid #94a3b8');
                t.querySelectorAll('tr').forEach((tr,i) => { if (i%2) tr.querySelectorAll('td,th').forEach(c=>c.style.background='#f1f5f9'); });
            } else if (name === 'minimal') {
                t.querySelectorAll('th, td').forEach(c => { c.style.border = 'none'; c.style.borderBottom = '1px solid #cbd5e1'; });
            } else if (name === 'colorful') {
                const first = t.querySelector('tr');
                if (first) first.querySelectorAll('td,th').forEach(c => { c.style.background='linear-gradient(135deg,#6366f1,#8b5cf6)'; c.style.color='#fff'; c.style.border='1px solid #4f46e5'; });
                t.querySelectorAll('tr:not(:first-child) td, tr:not(:first-child) th').forEach(c => c.style.border='1px solid #c7d2fe');
            } else if (name === 'bordered') {
                t.querySelectorAll('th, td').forEach(c => c.style.border = '2px solid #1e293b');
            }
            App.autoSave(); InteractiveManager.scheduleUpdate();
        },
        applyBorder(spec) {
            const t = InteractiveManager.activeTarget;
            if (!t || t.tagName !== 'TABLE') return;
            t.dataset.styled = '1';
            const border = `${spec.width}px ${spec.style} ${spec.color}`;
            t.querySelectorAll('th, td').forEach(c => c.style.border = border);
            t.style.borderCollapse = spec.collapse ? 'collapse' : 'separate';
            if (!spec.collapse) t.style.borderSpacing = (spec.spacing||2)+'px';
            App.autoSave(); InteractiveManager.scheduleUpdate();
        }
    };

    // ============================================================
    //  FIND / REPLACE — now uses TreeWalker over the editor with a
    //  proper text-node search so it handles HTML entities, nested
    //  tags, and selection across element boundaries correctly.
    // ============================================================
    const FindReplace = {
        matches: [], idx: -1, term: '',
        open() {
            if (!currentDocId) { UI.toast('Open a document first'); return; }
            UI.$('find-bar').classList.add('active');
            setTimeout(() => UI.$('find-input').focus(), 50);
        },
        close() {
            UI.$('find-bar').classList.remove('active');
            this.clearHighlights();
        },
        clearHighlights() {
            const ed = UI.$('editor');
            ed.querySelectorAll('mark[data-find]').forEach(m => {
                const txt = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(txt, m);
            });
            ed.normalize();
            this.matches = []; this.idx = -1;
            UI.$('find-info').innerText = '0/0';
        },
        escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },
        escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
        find(term) {
            this.clearHighlights();
            this.term = term;
            if (!term) return;
            const ed = UI.$('editor');
            const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, {
                acceptNode: n => {
                    // Skip text inside script/style and inside our own markers
                    if (!n.nodeValue) return NodeFilter.FILTER_REJECT;
                    let p = n.parentNode;
                    while (p && p !== ed) {
                        if (p.tagName === 'SCRIPT' || p.tagName === 'STYLE' || (p.tagName === 'MARK' && p.dataset && p.dataset.find)) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        p = p.parentNode;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });
            const re = new RegExp(this.escapeReg(term), 'gi');
            const nodes = [];
            let n;
            while ((n = walker.nextNode())) {
                re.lastIndex = 0;
                if (re.test(n.nodeValue)) nodes.push(n);
            }
            if (!nodes.length) {
                UI.$('find-info').innerText = '0/0';
                UI.toast('No matches');
                return;
            }
            // Highlight by SPLITTING the text node, never by re-parsing
            // escaped HTML: searching for "&" or "<" used to bake broken
            // entities (&amp;) permanently into the document.
            nodes.forEach(node => {
                const re2 = new RegExp(this.escapeReg(term), 'gi');
                const text = node.nodeValue;
                const spans = [];
                let m;
                while ((m = re2.exec(text)) !== null) {
                    spans.push([m.index, m.index + m[0].length]);
                    if (m[0].length === 0) re2.lastIndex++;
                }
                for (let i = spans.length - 1; i >= 0; i--) {
                    const [st, en] = spans[i];
                    node.splitText(en);
                    const hit = node.splitText(st);
                    const mark = document.createElement('mark');
                    mark.setAttribute('data-find', '1');
                    mark.style.cssText = 'background:#fef08a;color:inherit;padding:0;';
                    hit.parentNode.replaceChild(mark, hit);
                    mark.appendChild(hit);
                }
            });
            ed.normalize();
            this.matches = Array.from(ed.querySelectorAll('mark[data-find]'));
            this.idx = this.matches.length ? 0 : -1;
            UI.$('find-info').innerText = `${this.matches.length ? 1 : 0}/${this.matches.length}`;
            if (this.idx >= 0) this.scroll();
        },
        scroll() {
            if (this.idx < 0) return;
            this.matches.forEach(m => m.style.outline = '');
            const m = this.matches[this.idx];
            m.style.outline = '2px solid #f59e0b';
            m.scrollIntoView({ block: 'center', behavior: 'smooth' });
            UI.$('find-info').innerText = `${this.idx+1}/${this.matches.length}`;
        },
        next() { if (this.matches.length) { this.idx = (this.idx + 1) % this.matches.length; this.scroll(); } },
        prev() { if (this.matches.length) { this.idx = (this.idx - 1 + this.matches.length) % this.matches.length; this.scroll(); } },
        replace(repl) {
            if (this.idx < 0 || !this.matches.length) return;
            const m = this.matches[this.idx];
            const tn = document.createTextNode(repl);
            m.parentNode.replaceChild(tn, m);
            Paginator.schedule(true);
            App.autoSave();
            this.find(this.term);
        },
        replaceAll(repl) {
            const ed = UI.$('editor');
            if (!this.term) return;
            this.clearHighlights();
            const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null);
            const nodes = []; let n;
            while ((n = walker.nextNode())) nodes.push(n);
            const re = new RegExp(this.escapeReg(this.term), 'gi');
            let total = 0;
            nodes.forEach(node => {
                const before = node.nodeValue;
                const after = before.replace(re, () => { total++; return repl; });
                if (after !== before) node.nodeValue = after;
            });
            // A bulk replace can change the document's height a lot, so
            // the pages have to be re-flowed, not just re-saved.
            Paginator.schedule(true);
            App.autoSave();
            UI.toast(`Replaced ${total} match${total === 1 ? '' : 'es'}`);
        }
    };

    const FormatSidebar = {
        target: null,
        wrappedSpan: false,
        activeTab: 'Background',
        query: '',
        el: null,

        init() {
            this.el = UI.$('format-sidebar');
            const tabs = UI.$('fmt-tabs');
            tabs.innerHTML = '';
            FMT_TABS.forEach(t => {
                const b = document.createElement('button');
                b.className = 'fmt-tab' + (t.id === this.activeTab ? ' active' : '');
                b.dataset.tab = t.id;
                b.innerHTML = `<svg viewBox="0 0 24 24">${t.icon}</svg>${t.id}`;
                SelectionManager.protect(b);
                b.onclick = () => {
                    this.query = '';
                    UI.$('fmt-search').value = '';
                    this.activeTab = t.id;
                    tabs.querySelectorAll('.fmt-tab').forEach(x => x.classList.toggle('active', x === b));
                    b.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
                    this.render();
                };
                tabs.appendChild(b);
            });
            this.render();
        },

        isOpen() {
            return isMobile ? this.el.classList.contains('open') : !this.el.classList.contains('collapsed');
        },
        open() {
            if (isMobile) this.el.classList.add('open');
            else this.el.classList.remove('collapsed');
            this.render();
        },
        close() {
            if (!this.el) return;
            this.el.classList.remove('open');
            this.el.classList.add('collapsed');
        },
        toggle() { if (this.isOpen()) this.close(); else this.openForCurrent(); },

        // Resolve whatever the user means by "the thing I want to format":
        // an already-selected object, or the current text selection
        // (wrapped in a span on the fly so it can carry styles).
        openForCurrent(tab) {
            if (!currentDocId) { UI.toast('Open a document first'); return; }
            if (tab) {
                this.activeTab = tab;
                UI.$('fmt-tabs').querySelectorAll('.fmt-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
            }
            let t = InteractiveManager.activeTarget;
            if (!t || !UI.$('editor').contains(t)) {
                // No object selected → format the text selection instead.
                if (SelectionManager.ensureRange()) {
                    const span = App.wrapSelection('');
                    if (span) { t = span; this.wrappedSpan = true; }
                }
            }
            if (t) this.setTarget(t);
            this.open();
        },

        setTarget(el) {
            this.target = el || null;
            if (this.target) {
                document.querySelectorAll('.obj-selected').forEach(n => n.classList.remove('obj-selected'));
            }
            const name = UI.$('fmt-target-name');
            if (name) name.innerText = this.describe(this.target);
            if (this.isOpen()) this.render(); else this.renderPreview();
        },

        describe(el) {
            if (!el) return '—';
            if (el.classList.contains('doc-field') || el.classList.contains('doc-field-group')) return (el.dataset.field || 'field').replace('-', ' ');
            if (el.classList.contains('custom-shape')) return 'shape';
            const t = el.tagName.toLowerCase();
            if (t === 'span') return 'text';
