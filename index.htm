            UI.$('btn-new').onclick = () => UI.prompt("Document Name", name => { if (name) this.saveDoc({ title: name, content: '<p>Start typing...</p>' }).then((id) => this.loadDoc(id)); }, "Untitled");
            UI.$('btn-rename').onclick = () => { if (!currentDocId) return UI.toast("No file"); UI.prompt("Rename File", n => { if (n) { UI.$('doc-title').value = n; this.autoSave(); } }, '', UI.$('doc-title').value); };
            UI.$('btn-delete').onclick = () => {
                if (!currentDocId) return;
                UI.confirm("Delete this file permanently?", () => {
                    const tx = db.transaction("docs", "readwrite");
                    tx.objectStore("docs").delete(currentDocId);
                    tx.oncomplete = () => { this.setNoFileState(); this.refreshFiles(); };
                });
            };

            UI.$('btn-download').onclick = () => this.openExportModal();
            UI.$('btn-open').onclick = () => this.openDocumentPicker();
            UI.$('picker-open').onclick = () => this.openDocumentPicker();
            UI.$('file-search').oninput = e => this.refreshFiles(e.target.value);
            UI.$('doc-title').oninput = () => this.autoSave();

            // Mobile picker (visible when no file is loaded, on small screens)
            UI.$('picker-search').oninput = e => this.renderMobilePicker(e.target.value);
            UI.$('picker-new').onclick = () => UI.prompt("Document Name", name => {
                if (name) this.saveDoc({ title: name, content: '<p>Start typing...</p>' }).then((id) => this.loadDoc(id));
            }, "Untitled");

            // Fullscreen via ESC handled in keydown above; long-press also exits
            const startLP = () => { if (document.body.classList.contains('fullscreen')) longPressTimer = setTimeout(() => App.toggleFullscreen(false), 1000); };
            const endLP = () => clearTimeout(longPressTimer);
            document.addEventListener('mousedown', startLP); document.addEventListener('touchstart', startLP, {passive:true});
            document.addEventListener('mouseup', endLP); document.addEventListener('touchend', endLP);

            // Find bar
            UI.$('find-input').oninput = e => FindReplace.find(e.target.value);
            UI.$('find-input').onkeydown = e => { if (e.key==='Enter') { if (e.shiftKey) FindReplace.prev(); else FindReplace.next(); e.preventDefault(); } };
            UI.$('find-next').onclick = () => FindReplace.next();
            UI.$('find-prev').onclick = () => FindReplace.prev();
            UI.$('find-replace').onclick = () => FindReplace.replace(UI.$('replace-input').value);
            UI.$('find-replace-all').onclick = () => FindReplace.replaceAll(UI.$('replace-input').value);
            UI.$('find-close').onclick = () => FindReplace.close();

            // Zoom
            UI.$('zoom-in').onclick = () => this.setZoom(Math.min(2.5, zoomLevel + 0.1));
            UI.$('zoom-out').onclick = () => this.setZoom(Math.max(0.4, zoomLevel - 0.1));

            // Window resize: keep modal centered & reflow overlay
            window.addEventListener('resize', () => {
                isMobile = window.innerWidth <= 768;
                UI.syncSidebarState();
                InteractiveManager.scheduleUpdate();
                Paginator.schedule();
            });

            // ---- Format sidebar wiring ----
            UI.$('toggle-format').onclick = () => FormatSidebar.toggle();
            UI.$('fmt-close').onclick = () => FormatSidebar.close();
            UI.$('fmt-search').oninput = e => FormatSidebar.search(e.target.value);
        },

        setZoom(z) {
            zoomLevel = Math.round(z * 100) / 100;
            const ed = UI.$('editor');
            ed.style.transform = zoomLevel === 1 ? '' : `scale(${zoomLevel})`;
            if (zoomLevel !== 1) {
                ed.style.marginBottom = ((zoomLevel - 1) * ed.offsetHeight) + 'px';
            } else {
                ed.style.marginBottom = '';
            }
            // A transform doesn't grow the layout box, so zooming in used
            // to push the sides of the sheet out of reach. Reserve the
            // scaled width and let the scroller scroll horizontally.
            document.body.classList.toggle('zoomed', zoomLevel > 1);
            if (zoomLevel > 1) {
                // Pin the sheet's LAYOUT width to what it would be at
                // 100% so zooming magnifies the page instead of reflowing
                // it (which would re-paginate the document mid-zoom).
                const declared = parseFloat(getComputedStyle(ed).getPropertyValue('--page-w')) || 816;
                const sc = UI.$('scroll-inner');
                const avail = (sc ? sc.clientWidth : 900) - 40;
                const natural = Math.max(200, Math.min(declared, avail));
                ed.style.setProperty('--page-maxw', natural + 'px');
                ed.style.minWidth = Math.ceil(natural * zoomLevel) + 'px';
            } else {
                ed.style.removeProperty('--page-maxw');
                ed.style.minWidth = '';
            }
            UI.$('zoom-val').innerText = Math.round(zoomLevel*100) + '%';
            localStorage.setItem('zoom', String(zoomLevel));
            InteractiveManager.scheduleUpdate();
        },

        // Printing has to know the real paper size, otherwise every
        // A4/Legal sheet gets split across two Letter pages.
        printDocument() {
            const ed = UI.$('editor');
            const cs = getComputedStyle(ed);
            const w = (ed.style.getPropertyValue('--page-w') || cs.getPropertyValue('--page-w') || '816px').trim();
            const h = (ed.style.getPropertyValue('--page-h') || cs.getPropertyValue('--page-h') || '1056px').trim();
            const rule = document.getElementById('print-page-rule');
            if (rule) {
                rule.textContent = document.body.classList.contains('view-web')
                    ? '@page { margin: 12mm; }'
                    : `@page { size: ${w} ${h}; margin: 0; }`;
            }
            // Zoom must not leak into the printout
            const prevTransform = ed.style.transform;
            ed.style.transform = '';
            window.print();
            setTimeout(() => { ed.style.transform = prevTransform; }, 300);
        },

        // ============================================================
        //  OPEN A DOCUMENT FROM DISK — .html/.htm, .md, .txt.
        //  The file is parsed, every script/handler is removed, any
        //  <style> is scoped to the page body, and the result becomes a
        //  new, fully editable document.
        // ============================================================
        openDocumentPicker() {
            let input = UI.$('hidden-open-in');
            if (!input) {
                input = document.createElement('input');
                input.type = 'file';
                input.id = 'hidden-open-in';
                input.accept = '.html,.htm,.md,.markdown,.txt,.text,text/html,text/markdown,text/plain';
                input.multiple = true;
                input.style.display = 'none';
                document.body.appendChild(input);
                input.onchange = e => {
                    const files = Array.from(e.target.files || []);
                    input.value = '';
                    if (files.length) this.openFiles(files);
                };
            }
            input.click();
        },
        async openFiles(files) {
            let lastId = null, total = 0, stripped = 0;
            for (const file of files) {
                try {
                    const text = await file.text();
                    const parsed = this.parseImported(text, file.name);
                    stripped += parsed.stripped;
                    const id = await this.saveDoc({
                        title: parsed.title || file.name.replace(/\.[^.]+$/, ''),
                        content: parsed.html,
                        styleSheet: parsed.css,
                        pageStyle: {}
                    });
                    this.docStyleSheets[id] = parsed.css;
                    lastId = id; total++;
                } catch (err) {
                    console.warn('open failed', file.name, err);
                    UI.toast('Could not open ' + file.name);
                }
            }
            if (lastId != null) {
                currentDocId = null;          // force loadDoc to run
                this.refreshFiles();
                this.loadDoc(lastId);
                UI.toast(total > 1
                    ? `Opened ${total} documents${stripped ? ' — scripts removed' : ''}`
                    : `Opened${stripped ? ' — ' + stripped + ' script/handler' + (stripped === 1 ? '' : 's') + ' removed' : ''}`);
            }
        },
        parseImported(text, filename) {
            const isMd = /\.(md|markdown)$/i.test(filename || '');
            const isTxt = /\.(txt|text)$/i.test(filename || '');
            const looksHtml = /<\s*(html|body|div|p|h[1-6]|table|section|article)[\s>]/i.test(text);

            if (isTxt || (!isMd && !looksHtml)) {
                const html = text.split(/\n{2,}/).map(par =>
                    '<p>' + this.esc(par).replace(/\n/g, '<br>') + '</p>').join('');
                return { html: html || '<p><br></p>', css: '', title: '', stripped: 0 };
            }
            if (isMd) {
                return { html: this.markdownToHtml(text), css: '', title: '', stripped: 0 };
            }

            const doc = new DOMParser().parseFromString(text, 'text/html');
            const title = (doc.querySelector('title') || {}).textContent || '';
            // Collect stylesheets before they're stripped, then scope them.
            let css = '';
            doc.querySelectorAll('style').forEach(st => { css += '\n' + st.textContent; });
            css = this.scopeCss(css, '#editor .page-body');
            const bodyHtml = doc.body ? doc.body.innerHTML : text;
            const clean = this.sanitizeHtml(bodyHtml);
            const stripped = this._lastStripped || 0;
            // Carry the body's own background/colour onto the sheet
            const bodyStyle = doc.body ? (doc.body.getAttribute('style') || '') : '';
            const wrapped = bodyStyle
                ? `<div style="${this.esc(bodyStyle).replace(/&quot;/g, '"')}">${clean}</div>`
                : clean;
            return { html: wrapped || '<p><br></p>', css, title: title.trim(), stripped };
        },
        markdownToHtml(md) {
            const esc = s => this.esc(s);
            const inline = s => esc(s)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2">')
                .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                .replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
                .replace(/~~([^~]+)~~/g, '<s>$1</s>');
            const lines = String(md).replace(/\r\n?/g, '\n').split('\n');
            const out = [];
            let list = null, inCode = false, code = [], para = [];
            const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
            const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
            lines.forEach(line => {
                if (/^```/.test(line)) {
                    if (inCode) { out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); code = []; inCode = false; }
                    else { flushPara(); closeList(); inCode = true; }
                    return;
                }
                if (inCode) { code.push(line); return; }
                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) { flushPara(); closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); return; }
                if (/^\s*([-*_])\s*\1\s*\1[\s-*_]*$/.test(line)) { flushPara(); closeList(); out.push('<hr>'); return; }
                const q = line.match(/^>\s?(.*)$/);
                if (q) { flushPara(); closeList(); out.push('<blockquote>' + inline(q[1]) + '</blockquote>'); return; }
                const ul = line.match(/^\s*[-*+]\s+(.*)$/);
                const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
                if (ul || ol) {
                    flushPara();
                    const want = ul ? 'ul' : 'ol';
                    if (list && list !== want) closeList();
                    if (!list) { out.push('<' + want + '>'); list = want; }
                    out.push('<li>' + inline((ul || ol)[1]) + '</li>');
                    return;
                }
                if (!line.trim()) { flushPara(); closeList(); return; }
                para.push(line.trim());
            });
            if (inCode && code.length) out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
            flushPara(); closeList();
            return out.join('\n') || '<p><br></p>';
        },

        openExportModal() {
            if (!currentDocId) return;
            const title = UI.$('doc-title').value || 'document';
            const m = UI.modal(`
                <h3>Export Document</h3>
                <div class="export-btn-group">
                    <button class="btn btn-primary" id="exp-html"><svg class="icon" viewBox="0 0 24 24">${ICONS.download}</svg>Export as HTML (.html)</button>
                    <button class="btn btn-primary" id="exp-htmstand"><svg class="icon" viewBox="0 0 24 24">${ICONS.download}</svg>Standalone HTML (with styles)</button>
                    <button class="btn btn-ghost" id="exp-md"><svg class="icon" viewBox="0 0 24 24">${ICONS.download}</svg>Export as Markdown (.md)</button>
                    <button class="btn btn-ghost" id="exp-txt"><svg class="icon" viewBox="0 0 24 24">${ICONS.download}</svg>Export Plain Text (.txt)</button>
                </div>
                <div class="fmt-hint" style="margin-top:12px;">Exported files are static — all scripts and event handlers are stripped, so they open safely anywhere.</div>
                <div class="modal-btns" style="margin-top:10px">
                    <button class="btn btn-ghost" id="exp-cancel">Cancel</button>
                </div>`);
            UI.$('exp-html').onclick = () => { this.downloadBlob(new Blob([this.buildExportHTML(title, false)], { type:'text/html' }), title + '.html'); m.close(); };
            UI.$('exp-htmstand').onclick = () => { this.downloadBlob(new Blob([this.buildExportHTML(title, true)], { type:'text/html' }), title + '.html'); m.close(); };
            UI.$('exp-md').onclick = () => { this.downloadBlob(new Blob([this.htmlToMarkdown(Paginator.getContent())], { type:'text/markdown' }), title + '.md'); m.close(); };
            UI.$('exp-txt').onclick = () => { this.downloadBlob(new Blob([UI.$('editor').innerText], { type:'text/plain' }), title + '.txt'); m.close(); };
            UI.$('exp-cancel').onclick = m.close;
        },

        buildExportHTML(title, standalone, rawBody, docStyle) {
            // Everything that leaves the app goes through the sanitiser,
            // so an export can never carry JavaScript with it.
            const inner = this.sanitizeHtml(rawBody != null ? rawBody : Paginator.getContent());
            const extra = docStyle !== undefined
                ? docStyle
                : (currentDocId != null ? (this.docStyleSheets[currentDocId] || '') : '');
            const scopedExtra = extra ? '\n/* imported document styles */\n' + extra.replace(/#editor \.page-body/g, 'body') : '';
            const exportCss = `
                body { font-family: 'Times New Roman', serif; font-size: 16px; line-height: 1.6; max-width: 816px; margin: 30px auto; padding: 40px; color: #111; background: #fff; }
                table { border-collapse: collapse; margin: 10px 0; }
                table:not([data-styled]) { width: 100%; }
                table:not([data-styled]) td, table:not([data-styled]) th { border: 1px solid #94a3b8; padding: 8px; min-width: 24px; }
                td, th { padding: 8px; min-width: 24px; }
                img, video { max-width: 100%; }
                blockquote { border-left: 3px solid #6366f1; padding-left: 12px; margin: 10px 0; color: #475569; font-style: italic; }
                pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 5px; overflow-x: auto; font-family: monospace; }
                code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 5px; font-family: monospace; }
                a { color: #6366f1; }
                .callout { padding: 12px 16px; border-left: 4px solid #6366f1; background: rgba(99,102,241,0.08); border-radius: 5px; margin: 10px 0; }
                .page-break { display: block; border-top: 2px dashed #cbd5e1; margin: 24px 0; page-break-after: always; }
                .columns-2 { column-count: 2; column-gap: 24px; }
                .columns-3 { column-count: 3; column-gap: 24px; }
                kbd { background:#eee; border:1px solid #aaa; border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-family: monospace; font-size: 0.9em; }
                .custom-shape { display: inline-block; vertical-align: middle; margin: 5px; }
                .doc-field { display: inline-block; vertical-align: middle; margin: 3px 2px; max-width: 100%; }
                .doc-field.block { display: block; margin: 10px 0; }
                .doc-field .df-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
                .doc-field input[type="text"], .doc-field input[type="email"], .doc-field input[type="number"],
                .doc-field input[type="date"], .doc-field input[type="tel"], .doc-field input[type="url"],
                .doc-field textarea, .doc-field select {
                    font: inherit; font-size: 15px; width: 100%; box-sizing: border-box;
                    padding: 8px 11px; border: 1px solid #94a3b8; border-radius: 5px; background: #fff;
                }
                .doc-field.choice { display: inline-flex; align-items: center; gap: 8px; }
                .doc-field.choice.block { display: flex; }
                @media print { body { margin: 0; padding: 20mm; } }
                ${scopedExtra}
            `;
            const head = `<meta charset="UTF-8">${standalone ? '<meta name="viewport" content="width=device-width,initial-scale=1">' : ''}` +
                         `<title>${this.esc(title)}</title><style>${exportCss}</style>`;
            return `<!DOCTYPE html>\n<html lang="en">\n<head>${head}</head>\n<body>\n${inner}\n</body>\n</html>`;
        },

        htmlToMarkdown(html) {
            const tmp = document.createElement('div'); tmp.innerHTML = html;
            const conv = (el) => {
                if (el.nodeType === 3) return el.textContent;
                if (el.nodeType !== 1) return '';
                const tag = el.tagName.toLowerCase();
                const inner = Array.from(el.childNodes).map(conv).join('');
                switch (tag) {
                    case 'h1': return '\n# ' + inner + '\n';
                    case 'h2': return '\n## ' + inner + '\n';
                    case 'h3': return '\n### ' + inner + '\n';
                    case 'h4': return '\n#### ' + inner + '\n';
                    case 'h5': return '\n##### ' + inner + '\n';
                    case 'h6': return '\n###### ' + inner + '\n';
                    case 'b': case 'strong': return '**' + inner + '**';
                    case 'i': case 'em': return '*' + inner + '*';
                    case 'u': return '__' + inner + '__';
                    case 's': case 'strike': case 'del': return '~~' + inner + '~~';
                    case 'a': return '[' + inner + '](' + (el.href||'') + ')';
                    case 'img': return '![' + (el.alt||'') + '](' + el.src + ')';
                    case 'code': return '`' + inner + '`';
                    case 'pre': return '\n```\n' + inner + '\n```\n';
                    case 'blockquote': return '\n> ' + inner.replace(/\n/g, '\n> ') + '\n';
                    case 'br': return '\n';
                    case 'hr': return '\n---\n';
                    case 'li': return '- ' + inner + '\n';
                    case 'ul': case 'ol': return '\n' + inner + '\n';
                    case 'p': case 'div': return inner + '\n\n';
                    case 'table': {
                        const rows = Array.from(el.querySelectorAll('tr'));
                        if (!rows.length) return '';
                        let out = '\n';
                        rows.forEach((tr,i) => {
                            const cells = Array.from(tr.children).map(c => c.textContent.replace(/\n/g,' ').trim());
                            out += '| ' + cells.join(' | ') + ' |\n';
                            if (i===0) out += '|' + cells.map(()=>' --- ').join('|') + '|\n';
                        });
                        return out + '\n';
                    }
                    default: return inner;
                }
            };
            return Array.from(tmp.childNodes).map(conv).join('').replace(/\n{3,}/g,'\n\n').trim();
        },

        downloadBlob(blob, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); },

            if (action === 'link') {

                    App.insertHTML(
                        `<figure style="margin:10px 0;display:block;">` +
                        `<img src="${src}" alt="${alt}"${ws}>` +
                        `<div class="image-caption" contenteditable="true" data-placeholder="Add a caption..."></div>` +
                        `</figure>`
                    );
                };
                UI.$('upload-img-btn').onclick = () => UI.$('hidden-img-in').click();
                UI.$('hidden-img-in').onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = re => { ins(re.target.result); m.close(); }; r.readAsDataURL(f); } };
                UI.$('img-cancel').onclick = m.close;

                const ins = src => { const w = UI.$('vid-w').value||'400'; App.insertHTML(`<video src="${src}" controls style="width:${/^\d+$/.test(w)?w+'px':w}; height:auto;"></video>`); };
                UI.$('vid-up').onclick = () => UI.$('vid-file').click();
                UI.$('vid-file').onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = re => { ins(re.target.result); m.close(); }; r.readAsDataURL(f); } };
                UI.$('vid-cancel').onclick = m.close;
                UI.$('vid-ok').onclick = () => { const u = UI.$('vid-url').value; if (u) ins(u); m.close(); };
            }

            if (action === 'audio') {
                const m = UI.modal(`<h3>Insert Audio</h3>
                    <button class="btn btn-ghost" style="width:100%; border:1px dashed var(--text-muted); padding:15px; margin-bottom:10px;" id="au-up">Upload from Device</button>

                const m = UI.modal(html);
                m.root.querySelectorAll('[data-key]').forEach(b => {
                    b.onclick = () => {
                        const k = b.dataset.key;
                        const s = SHAPES[k];
                        // Inline styles use !important so the wrapper's

                        App.insertHTML(

                    <div class="modal-btns"><button class="btn btn-ghost" id="tp-cancel">Cancel</button><button class="btn btn-primary" id="tp-ok">Insert</button></div>`);
                const tp = UI.$('tp');
                for (let r=1; r<=8; r++) for (let c=1; c<=10; c++) {
                    const d = document.createElement('div'); d.dataset.r = r; d.dataset.c = c;
                    d.onpointerover = () => { rows = r; cols = c; UI.$('tp-label').innerText = `${r} × ${c}`; UI.$('tp-rows').value=r; UI.$('tp-cols').value=c; tp.querySelectorAll('div').forEach(x=>{ x.classList.toggle('on', +x.dataset.r<=r && +x.dataset.c<=c); }); };
                    d.onclick = () => UI.$('tp-ok').click();
                    tp.appendChild(d);
                }
                UI.$('tp-rows').oninput = e => { rows = Math.max(1, +e.target.value||1); };
                UI.$('tp-cols').oninput = e => { cols = Math.max(1, +e.target.value||1); };
                UI.$('tp-cancel').onclick = m.close;
                UI.$('tp-ok').onclick = () => {
                    const hasHead = UI.$('tp-head').value === '1';
                    const preset = UI.$('tp-preset').value;
                    let html = '<table data-styled="1" style="border-collapse:collapse;margin:10px 0;"><tbody>';
                    for (let r=0; r<rows; r++) {
                        html += '<tr>';
                        for (let c=0; c<cols; c++) {
                            const tag = (hasHead && r===0) ? 'th' : 'td';
                            html += `<${tag} style="border:1px solid #94a3b8;padding:8px;min-width:24px;">&nbsp;</${tag}>`;
                        }
                        html += '</tr>';
                    }
                    html += '</tbody></table><p><br></p>';
                    // Tag it: with content spread across several .page-body
                    // parents, `table:last-of-type` matches the last table
                    // of the FIRST page, not the one just inserted.
                    html = html.replace('<table ', '<table data-just-inserted="1" ');
                    App.insertHTML(html);
                    const newTable = ed.querySelector('table[data-just-inserted="1"]');
                    if (newTable) newTable.removeAttribute('data-just-inserted');
                    if (newTable) {
                        InteractiveManager.activeTarget = newTable;
                        TableManager.applyPreset(preset);
                    }
                    m.close();
                };
            }

            // ============================================================
            //  FORM FIELDS — real inputs you can drop into the document.
            //  Every field is a self-contained, contenteditable="false"
            //  object so it can be selected, resized and formatted like
            //  an image, while still being fillable.
            // ============================================================
            if (action === 'fieldText' || action === 'fieldDate') {
                const isDate = action === 'fieldDate';
                const m = UI.modal(`<h3>${isDate ? 'Date Field' : 'Text Input'}</h3>
                    <label>Label (optional)</label>
                    <input id="fd-label" placeholder="e.g. Full name">
                    ${isDate ? '' : `<label>Placeholder</label>
                    <input id="fd-ph" placeholder="e.g. Type your answer here…" value="Type here…">
                    <label>Input type</label>
                    <select id="fd-type">
                        <option value="text">Text</option>
                        <option value="email">Email</option>
                        <option value="number">Number</option>
                        <option value="tel">Phone</option>
                        <option value="url">URL</option>
                        <option value="password">Password</option>
                    </select>`}
                    <label>Width</label>
                    <input id="fd-w" placeholder="e.g. 260px, 50% or auto" value="${isDate ? '190px' : '260px'}">
                    <label>Layout</label>
                    <select id="fd-block"><option value="0">Inline (in the text)</option><option value="1">Own line</option></select>
                    <div class="modal-btns"><button class="btn btn-ghost" id="fd-c">Cancel</button><button class="btn btn-primary" id="fd-ok">Insert</button></div>`);
                UI.$('fd-c').onclick = m.close;
                UI.$('fd-ok').onclick = () => {
                    const label = App.esc(UI.$('fd-label').value);
                    const ph = isDate ? '' : App.esc(UI.$('fd-ph').value);
                    const type = isDate ? 'date' : (UI.$('fd-type') ? UI.$('fd-type').value : 'text');
                    const w = App.cssLen(UI.$('fd-w').value);
                    const block = UI.$('fd-block').value === '1';
                    App.insertField(
                        `<span class="doc-field${block ? ' block' : ''}" contenteditable="false" data-field="${type}"${w ? ` style="width:${w}"` : ''}>` +
                        (label ? `<span class="df-label" contenteditable="true">${label}</span>` : '') +
                        `<input type="${type}"${ph ? ` placeholder="${ph}"` : ''}>` +
                        `</span>`);
                    m.close();
                };
            }

            if (action === 'fieldTextarea') {
                const m = UI.modal(`<h3>Text Area</h3>
                    <label>Label (optional)</label>
                    <input id="fa-label" placeholder="e.g. Comments">
                    <label>Placeholder</label>
                    <input id="fa-ph" value="Write your answer…">
                    <label>Rows</label>
                    <input id="fa-rows" type="number" value="4" min="1" max="40">
                    <label>Width</label>
                    <input id="fa-w" value="100%">
                    <div class="modal-btns"><button class="btn btn-ghost" id="fa-c">Cancel</button><button class="btn btn-primary" id="fa-ok">Insert</button></div>`);
                UI.$('fa-c').onclick = m.close;
                UI.$('fa-ok').onclick = () => {
                    const label = App.esc(UI.$('fa-label').value);
                    const ph = App.esc(UI.$('fa-ph').value);
                    const rows = Math.max(1, parseInt(UI.$('fa-rows').value || '4', 10));
                    const w = App.cssLen(UI.$('fa-w').value);
                    App.insertField(
                        `<span class="doc-field block" contenteditable="false" data-field="textarea"${w ? ` style="width:${w}"` : ''}>` +
                        (label ? `<span class="df-label" contenteditable="true">${label}</span>` : '') +
                        `<textarea rows="${rows}" placeholder="${ph}"></textarea>` +
                        `</span>`);
                    m.close();
                };
            }

            if (action === 'fieldCheckbox' || action === 'fieldRadio') {
                const isRadio = action === 'fieldRadio';
                const m = UI.modal(`<h3>${isRadio ? 'Radio Group' : 'Checkbox'}</h3>
                    ${isRadio ? `<label>Group label (optional)</label><input id="fc-label" placeholder="e.g. Choose one">` : ''}
                    <label>${isRadio ? 'Options (one per line)' : 'Label text'}</label>
                    ${isRadio
                        ? `<textarea id="fc-opts" style="height:96px;font-family:inherit;">Option one\nOption two\nOption three</textarea>`
                        : `<input id="fc-opts" value="I agree">`}
                    <label>Layout</label>
                    <select id="fc-block"><option value="1">Stacked (own lines)</option><option value="0">Inline</option></select>
                    ${isRadio ? '' : `<label>Checked by default</label><select id="fc-chk"><option value="0">No</option><option value="1">Yes</option></select>`}
                    <div class="modal-btns"><button class="btn btn-ghost" id="fc-c">Cancel</button><button class="btn btn-primary" id="fc-ok">Insert</button></div>`);
                UI.$('fc-c').onclick = m.close;
                UI.$('fc-ok').onclick = () => {
                    const block = UI.$('fc-block').value === '1';
                    if (isRadio) {
                        const label = App.esc(UI.$('fc-label').value);
                        const name = 'grp' + Math.random().toString(36).slice(2, 8);
                        const opts = UI.$('fc-opts').value.split('\n').map(s => s.trim()).filter(Boolean);
                        let html = `<span class="doc-field-group" contenteditable="false" data-field="radio-group">`;
                        if (label) html += `<span class="df-label" contenteditable="true" style="display:block;">${App.esc(label)}</span>`;
                        (opts.length ? opts : ['Option one']).forEach(o => {
                            html += `<span class="doc-field choice${block ? ' block' : ''}" contenteditable="false" data-field="radio">` +
                                    `<input type="radio" name="${name}">` +
                                    `<span class="df-text" contenteditable="true" data-placeholder="Label">${App.esc(o)}</span></span>`;
                        });
                        html += `</span>`;
                        App.insertField(html);
                    } else {
                        const text = App.esc(UI.$('fc-opts').value || 'Checkbox');
                        const checked = UI.$('fc-chk').value === '1' ? ' checked' : '';
                        App.insertField(
                            `<span class="doc-field choice${block ? ' block' : ''}" contenteditable="false" data-field="checkbox">` +
                            `<input type="checkbox"${checked}>` +
                            `<span class="df-text" contenteditable="true" data-placeholder="Label">${text}</span></span>`);
                    }
                    m.close();
                };
            }

            if (action === 'fieldSelect') {
                const m = UI.modal(`<h3>Dropdown</h3>
                    <label>Label (optional)</label>
                    <input id="fs-label" placeholder="e.g. Country">
                    <label>Placeholder (shown first, unselectable)</label>
                    <input id="fs-ph" value="Choose an option…">
                    <label>Options (one per line)</label>
                    <textarea id="fs-opts" style="height:110px;font-family:inherit;">Option one\nOption two\nOption three</textarea>

                UI.$('fs-c').onclick = m.close;

                    const opts = UI.$('fs-opts').value.split('\n').map(s => s.trim()).filter(Boolean);
                    let html = `<span class="doc-field${block ? ' block' : ''}" contenteditable="false" data-field="select"${w ? ` style="width:${w}"` : ''}>`;
                    if (label) html += `<span class="df-label" contenteditable="true">${label}</span>`;
                    html += `<select>`;
                    if (ph) html += `<option value="" selected disabled>${ph}</option>`;
                    (opts.length ? opts : ['Option one']).forEach(o => { html += `<option>${App.esc(o)}</option>`; });

                    `<span style="display:block;border-bottom:1.5px solid var(--text-soft);height:34px;"></span>` +
                    `<span class="df-label" contenteditable="true" style="margin:4px 0 0;">Signature</span>` +
                    `</span>`);
            }

            if (action === 'objectFormat') FormatSidebar.openForCurrent();
            if (action === 'objectSize') FormatSidebar.openForCurrent('Size');

            if (action === 'date') App.insertHTML(new Date().toLocaleDateString());
            if (action === 'datetime') App.insertHTML(new Date().toLocaleString());
            if (action === 'print') App.printDocument();

            if (action === 'textSpacing') {
                if (!SelectionManager.ensureRange()) { UI.toast("Type some text first!"); return; }
                UI.prompt("Letter Spacing (e.g. 2px, 0.1em):", v => { if (v) { SelectionManager.restore(); App.wrapSelection(`letter-spacing: ${v};`); App.autoSave(); } }, "2px");
            }
            if (action === 'lineHeight') {
                if (!SelectionManager.ensureRange()) { UI.toast("Type some text first!"); return; }
                UI.prompt("Line Height (e.g. 1.5, 2, 24px):", v => { if (v) { SelectionManager.restore(); App.wrapSelection(`line-height: ${v}; display:inline-block;`); App.autoSave(); } }, "1.6");
            }
            if (action === 'fontWeight') {
                if (!SelectionManager.ensureRange()) { UI.toast("Type some text first!"); return; }
                UI.prompt("Font Weight (100-900 or bold):", v => { if (v) { SelectionManager.restore(); App.wrapSelection(`font-weight: ${v};`); App.autoSave(); } }, "800");
            }

            if (action === 'textGradient' || action === 'fillColor') {
                if (!SelectionManager.ensureRange()) { UI.toast("Type some text first!"); return; }
                ColorPanel.open({
                    title: action==='textGradient' ? 'Gradient Text' : 'Text Color',
                    isText: true,
                    initial: { mode: action==='textGradient' ? 'linear' : 'solid', solid:'#000000', c1:'#ff6a00', c2:'#ee0979', angle:90 },
                    onApply: res => {
                        if (res.clear) return;
                        SelectionManager.restore();
                        if (res.state.mode === 'solid' && res.applyTo === 'text') {
                            App.execWithSelection('foreColor', res.css);
                        } else if (res.applyTo === 'text') {
                            App.wrapSelection(`background:${res.css}; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; display:inline;`);
                        } else {
                            if (res.state.mode === 'solid') App.execWithSelection('hiliteColor', res.css);
                            else App.wrapSelection(`background:${res.css}; padding: 0 2px; border-radius: 5px;`);
                        }
                        App.autoSave();
                    }
                });
            }

            if (action === 'highlightColor') {
                if (!SelectionManager.ensureRange()) { UI.toast("Type some text first!"); return; }
                ColorPanel.open({
                    title: 'Highlight / Background',
                    initial: { mode:'solid', solid:'#fef08a', c1:'#fef08a', c2:'#fde047', angle:90 },
                    onApply: res => {
                        if (res.clear) return;
                        SelectionManager.restore();
                        if (res.applyTo === 'text') {
                            if (res.state.mode === 'solid') App.execWithSelection('foreColor', res.css);
                            else App.wrapSelection(`background:${res.css}; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; display:inline;`);

                            if (res.state.mode === 'solid') App.execWithSelection('hiliteColor', res.css);
                            else App.wrapSelection(`background:${res.css}; padding:0 2px; border-radius:5px;`);
                        }
                        App.autoSave();

            if (action === 'pageBreak') App.insertHTML('<div class="page-break"></div>');
            if (action === 'callout') App.insertHTML('<div class="callout">Your callout text...</div><p><br></p>');
            if (action === 'codeInline') App.insertHTML(`<code>code</code>`);
            // Insert a proper code BLOCK. The placeholder text inside is
            // what gets selected so the user can immediately type to
            // replace it; clicking outside (or pressing ESC) closes the
            // block by leaving an empty trailing paragraph to type into.
            if (action === 'codeBlock') {
                App.insertHTML(`<pre data-codeblock="1" data-just-inserted="1"><code>type code here</code></pre><p><br></p>`);

                    const ed = UI.$('editor');
                    const pre = ed.querySelector('pre[data-just-inserted="1"]');
                    if (pre) pre.removeAttribute('data-just-inserted');
                    if (pre) {
                        const sel = window.getSelection();
                        const range = document.createRange();
                        range.selectNodeContents(pre.querySelector('code'));
                        sel.removeAllRanges();

        wrapSelectionOrBlock(fn) {

            if (n && n !== UI.$('editor')) { fn(n); App.autoSave(); }

        setNoFileState() {

        async refreshFiles(query = '') {
            if (!db) return;
            const tx = db.transaction("docs", "readonly");
            const store = tx.objectStore("docs");
            const req = store.getAll();
            req.onsuccess = () => {
                const list = UI.$('file-list'); list.innerHTML = '';
                const files = req.result.sort((a, b) => b.id - a.id);
                if (!files.length) {
                    list.innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:13px;text-align:center;">No documents yet.<br>Click + to create one.</div>';
                    return;
                }
                files.forEach(f => {
                    if (query && !f.title.toLowerCase().includes(query.toLowerCase())) return;
                    const el = document.createElement('div');
                    el.className = `file-item ${f.id === currentDocId ? 'active' : ''}`;
                    el.dataset.id = f.id;
                    el.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> <span>${f.title}</span><button class="file-item-menu" title="More" aria-label="More actions"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>`;
                    el.onclick = (e) => {
                        // Clicks on the menu button open the context menu,
                        // everything else loads the doc.
                        if (e.target.closest('.file-item-menu')) {
                            e.stopPropagation();
                            App.openFileContextMenu(f, el, e);
                            return;
                        }
                        this.loadDoc(f.id);
                    };
                    el.oncontextmenu = (e) => {
                        e.preventDefault();
                        App.openFileContextMenu(f, el, e);
                    };
                    list.appendChild(el);
                });
            };
            req.onerror = () => console.warn('refreshFiles failed', req.error);
            // Keep the mobile picker (empty-state) in sync whenever the
            // sidebar file list changes.
            const pickerSearch = UI.$('picker-search');
            this.renderMobilePicker(pickerSearch ? pickerSearch.value : '');
        },

        // ============================================================
        //  MOBILE PICKER — populates the in-empty-state file selector
        //  (visible on small screens when no document is loaded). Same
        //  data source as the sidebar list, just rendered inline.
        // ============================================================
        renderMobilePicker(query = '') {
            const list = UI.$('picker-list');
            if (!list) return;
            if (!db) { list.innerHTML = ''; return; }
            const tx = db.transaction('docs', 'readonly');
            const req = tx.objectStore('docs').getAll();
            req.onsuccess = () => {
                const files = req.result.sort((a, b) => b.id - a.id);
                const filtered = query
                    ? files.filter(f => f.title.toLowerCase().includes(query.toLowerCase()))
                    : files;
                if (!filtered.length) {
                    list.innerHTML = `<div class="picker-empty">${files.length ? 'No matches' : 'No documents yet'}</div>`;
                    return;
                }
                list.innerHTML = '';
                filtered.forEach(f => {
                    const item = document.createElement('div');
                    item.className = 'picker-item';
                    item.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>${f.title}</span>`;
                    item.onclick = () => this.loadDoc(f.id);
                    list.appendChild(item);
                });
            };
            req.onerror = () => { list.innerHTML = ''; };
        },

        // ============================================================
        //  FILE CONTEXT MENU — right-click or "..." button on a file
        //  item. Provides Open / Rename / Duplicate / Export / Delete
        //  actions. The menu reuses the global .context-menu DOM by
        //  swapping in file-specific items.
        // ============================================================
        openFileContextMenu(doc, anchorEl, ev) {
            const cm = UI.$('context-menu');
            // Save & clear any existing items, build new set. The flag
            // lets the editor rebuild its own menu next time it opens.
            cm.dataset.mode = 'file';
            cm.innerHTML = '';
            const items = [
                { action:'file-open', label:'Open', icon:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' },
                { action:'file-rename', label:'Rename', icon:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>' },
                { action:'file-duplicate', label:'Duplicate', icon:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' },
                { action:'file-export', label:'Export…', icon:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' },
                { divider:true },
                { action:'file-delete', label:'Delete', danger:true, icon:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' },
            ];
            items.forEach(it => {
                if (it.divider) {
                    const d = document.createElement('div');
                    d.className = 'context-menu-divider';
                    cm.appendChild(d);
                    return;
                }
                const div = document.createElement('div');
                div.className = 'context-menu-item';
                if (it.danger) div.classList.add('danger');
                div.innerHTML = `${it.icon}<span>${it.label}</span>`;
                div.onclick = () => {
                    cm.style.display = 'none';
                    App.handleFileAction(it.action, doc);
                };
                cm.appendChild(div);
            });
            // Position: prefer the click coords; fall back to anchor rect.
            let x, y;
            if (ev && ev.clientX != null) {
                x = ev.clientX; y = ev.clientY;
            } else {
                const r = anchorEl.getBoundingClientRect();
                x = r.right - 8; y = r.bottom - 4;
            }
            cm.style.display = 'block';
            // Clamp inside viewport
            const cw = cm.offsetWidth, ch = cm.offsetHeight;
            if (x + cw > window.innerWidth) x = window.innerWidth - cw - 8;
            if (y + ch > window.innerHeight) y = window.innerHeight - ch - 8;
            cm.style.left = x + 'px';
            cm.style.top = y + 'px';
        },

        // File actions dispatched from the sidebar context menu
        async handleFileAction(action, doc) {
            if (!doc) return;
            if (action === 'file-open') {
                this.loadDoc(doc.id);
                return;
            }
            if (action === 'file-rename') {
                UI.prompt('Rename file', newTitle => {
                    if (!newTitle || newTitle === doc.title) return;
                    const tx = db.transaction('docs', 'readwrite');
                    const updated = Object.assign({}, doc, { title: newTitle });
                    tx.objectStore('docs').put(updated).onsuccess = () => {
                        this.refreshFiles();
                        if (currentDocId === doc.id) {
                            UI.$('doc-title').value = newTitle;
                            this.autoSave();
                        }
                        UI.toast('Renamed');
                    };
                }, '', doc.title);
                return;
            }
            if (action === 'file-duplicate') {
                const copy = Object.assign({}, doc);
                delete copy.id;
                copy.title = (doc.title || 'Untitled') + ' (copy)';
                const tx = db.transaction('docs', 'readwrite');
                tx.objectStore('docs').put(copy).onsuccess = () => {
                    this.refreshFiles();
                    UI.toast('Duplicated');
                };
                return;
            }
            if (action === 'file-export') {
                // Export THIS document's stored content, not whatever
                // happens to be open in the editor.
                const title = doc.title || 'document';
                const body = (doc.id === currentDocId) ? Paginator.getContent() : (doc.content || '');
                const html = this.buildExportHTML(title, true, body, doc.styleSheet || '');
                this.downloadBlob(new Blob([html], { type:'text/html' }), title + '.html');
                UI.toast('Exported (no scripts)');
                return;
            }
            if (action === 'file-delete') {
                UI.confirm(`Delete "${doc.title}" permanently?`, () => {
                    if (currentDocId === doc.id) clearTimeout(this.saveTimer);
                    const tx = db.transaction('docs', 'readwrite');
                    tx.objectStore('docs').delete(doc.id).onsuccess = () => {
                        if (currentDocId === doc.id) this.setNoFileState();
                        this.refreshFiles();
                        UI.toast('Deleted');
                    };
                });
                return;
            }
        },
        loadDoc(id) {
            if (id === currentDocId) return;
            // Commit whatever is on screen BEFORE swapping documents.
            this.flushSave();
            const tx = db.transaction("docs", "readonly");
            tx.objectStore("docs").get(id).onsuccess = e => {
                const doc = e.target.result;
                if (doc) {
                    currentDocId = doc.id;
                    document.body.classList.remove('no-file');
                    const ed = UI.$('editor');
                    UI.$('empty-state').style.display = 'none';
                    ed.classList.add('ready');
                    ed.style.display = '';
                    this.clearPageStyle();
                    this.applyDocStyleSheet(doc.styleSheet || '');
                    Paginator.setContent(doc.content);
                    if (doc.pageStyle) {
                        Object.keys(doc.pageStyle).forEach(k => ed.style.setProperty(k, doc.pageStyle[k]));
                    }
                    // Open at the TOP of the document, not the bottom.
                    ed.focus({ preventScroll: true });
                    Paginator.caretToStart();
                    const sc = UI.$('scroll-inner');
                    if (sc) sc.scrollTop = 0;
                    const titleInput = UI.$('doc-title');
                    titleInput.value = doc.title; titleInput.classList.remove('empty'); titleInput.readOnly = false;
                    UI.$('status-msg').innerText = "Ready";
                    this.updateWordCount();
                    if (isMobile) UI.toggleSidebar(false);
                    this.refreshFiles();
                    InteractiveManager.activeTarget = null; InteractiveManager.scheduleUpdate();
                    FindReplace.close();
                    SelectionManager.savedRange = null;
                    SelectionManager.richRange = null;
                    FormatSidebar.close();
                    App.setZoom(zoomLevel);
                    Paginator.schedule(true);
                    requestAnimationFrame(() => { const s2 = UI.$('scroll-inner'); if (s2) s2.scrollTop = 0; });
                }
            };
        },
        saveDoc(doc, keepCurrent) {
            return new Promise((resolve, reject) => {
                if (!db) return reject(new Error('db not ready'));
                if (doc.id == null) delete doc.id;
                if (doc.id == null && keepCurrent) return resolve(null);
                if (doc.id != null && this.docStyleSheets[doc.id] !== undefined) doc.styleSheet = this.docStyleSheets[doc.id];
                const tx = db.transaction("docs", "readwrite");
                // saveDoc never re-points currentDocId — callers open the
                // returned id explicitly. (It used to, which made
                // `saveDoc(...).then(loadDoc)` a no-op.)
                tx.objectStore("docs").put(doc).onsuccess = e => resolve(e.target.result);
                tx.onerror = () => reject(tx.error);
            });
        },
        // Per-document <style> imported from an opened file, kept out of
        // the editable content and scoped so it can't touch the app UI.
        docStyleSheets: {},
        applyDocStyleSheet(css) {
            let tag = document.getElementById('doc-style');
            if (!tag) {
                tag = document.createElement('style');
                tag.id = 'doc-style';
                document.head.appendChild(tag);
            }
            tag.textContent = css || '';
            if (currentDocId != null) this.docStyleSheets[currentDocId] = css || '';
        },
        PAGE_VARS: ['--page-w','--page-h','--page-pad','--page-bg','--page-gap'],
        getPageStyle() {
            const ed = UI.$('editor'); const o = {};
            this.PAGE_VARS.forEach(v => { const val = ed.style.getPropertyValue(v); if (val) o[v] = val; });
            return o;
        },
        clearPageStyle() {
            const ed = UI.$('editor');
            this.PAGE_VARS.forEach(v => ed.style.removeProperty(v));
        },
        // Snapshot of what is currently on screen. Taken at SCHEDULE time
        // (not fire time) so a queued save can never write the document
        // you just switched to over the one you were editing.
        snapshot() {
            if (!currentDocId) return null;
            return {
                id: currentDocId,
                title: UI.$('doc-title').value,
                content: Paginator.getContent(),
                pageStyle: this.getPageStyle()
            };
        },
        autoSave() {
            if (!currentDocId) return;
            clearTimeout(this.saveTimer);
            UI.$('status-msg').innerText = "Saving...";
            this.saveTimer = setTimeout(() => this.flushSave(), 700);
        },
        // Writes the pending snapshot immediately. Called by the debounce,
        // and synchronously before switching/closing documents so that
        // typing right up to the moment you click another file can't be
        // thrown away.
        flushSave(snap) {
            clearTimeout(this.saveTimer);
            const doc = snap || this.snapshot();
            if (!doc || !doc.id) return Promise.resolve();
            // Never persist transient find-highlight markup
            doc.content = doc.content.replace(/<mark [^>]*data-find="1"[^>]*>([\s\S]*?)<\/mark>/g, '$1');
            return this.saveDoc(doc, true).then(() => {
                if (currentDocId === doc.id) UI.$('status-msg').innerText = "Saved";
                this.refreshFiles();
            }).catch(err => { UI.$('status-msg').innerText = "Save failed"; console.warn(err); });
        },
        updateWordCount() {
            const txt = UI.$('editor').innerText || "";
            const chars = txt.length;
            const count = txt.trim().length === 0 ? 0 : txt.trim().split(/\s+/).length;
            const readTime = Math.ceil(count / 200);
            let line = `${count} Words | ${chars} Chars | ${readTime} min read`;
            if (wordTarget > 0) {
                const pct = Math.min(100, Math.round(count / wordTarget * 100));
                line += ` | ${count}/${wordTarget} (${pct}%)`;
            }
            UI.$('word-count').innerText = line;
        }
    };
    App.init();
    </script>
