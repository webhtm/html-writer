<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML Writer</title>
    <style>
        :root {
            /* Variables */
            --primary: #6366f1;
            --primary-bg: #e0e7ff;
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --sidebar-width: 280px;
            --toolbar-height: 60px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-editor: 'Times New Roman', serif;
            --anim-speed: 0.3s;
        }
        body.dark-mode {
            --bg-body: #0f172a;
            --bg-panel: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --primary-bg: #312e81;
            --primary: #818cf8;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-ui);
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* --- ICONS --- */
        .icon { 
            width: 18px; height: 18px; 
            fill: none; stroke: currentColor; 
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; 
            pointer-events: none; flex-shrink: 0;
        }
        /* --- LAYOUT --- */
        .app-shell { display: flex; width: 100%; height: 100%; }
        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
            z-index: 50;
            transition: margin-left var(--anim-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.collapsed { margin-left: calc(var(--sidebar-width) * -1); }
        
        .mobile-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40;
            opacity: 0; pointer-events: none; transition: opacity var(--anim-speed);
            backdrop-filter: blur(2px);
        }
        .mobile-overlay.active { opacity: 1; pointer-events: auto; }
        @media (max-width: 768px) {
            #sidebar {
                position: fixed; height: 100%; left: 0; top: 0;
                transform: translateX(-100%); margin-left: 0;
                transition: transform var(--anim-speed) ease;
                box-shadow: 10px 0 30px rgba(0,0,0,0.3);
            }
            #sidebar.mobile-open { transform: translateX(0); }
        }
        /* Main Area */
        #main {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
            position: relative; background: var(--bg-body);
        }
        /* --- HEADER --- */
        .top-bar {
            height: 50px; background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 10px; gap: 10px;
            flex-shrink: 0;
        }
        #doc-title {
            background: transparent; border: none; font-weight: 600; font-size: 15px;
            color: var(--text-main); flex: 1; padding: 5px; border-radius: 4px;
            transition: opacity 0.2s;
        }
        #doc-title.empty { opacity: 0.5; font-style: italic; pointer-events: none; }
        
        /* --- SLIDING TOOLBAR --- */
        .toolbar-container {
            height: var(--toolbar-height);
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .toolbar-track {
            display: flex;
            width: 200%; /* Two slides */
            height: 100%;
            transition: transform var(--anim-speed) cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .toolbar-slide {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .toolbar-slide::-webkit-scrollbar { display: none; }
        .toolbar-container.show-tools .toolbar-track { transform: translateX(-50%); }
        /* Toolbar Components */
        .cat-btn {
            height: 40px; padding: 0 16px; 
            border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 500; color: var(--text-muted);
            background: transparent; border: 1px solid transparent;
            display: flex; align-items: center; gap: 8px;
            transition: 0.1s; white-space: nowrap; flex-shrink: 0;
        }
        .cat-btn:hover { background: var(--bg-body); color: var(--text-main); border-color: var(--border); }
        body.dark-mode .cat-btn { color: #94a3b8; }
        body.dark-mode .cat-btn:hover { color: #f8fafc; }
        
        .tool-btn {
            height: 38px; padding: 0 14px;
            border-radius: 6px; border: 1px solid transparent;
            background: transparent; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.1s; flex-shrink: 0;
            font-size: 13px; font-weight: 500;
        }
        .tool-btn span { white-space: nowrap; }
        .tool-btn:hover { background: var(--bg-body); border-color: var(--border); }
        .tool-btn.active { background: var(--primary-bg); color: var(--primary); border-color: rgba(99, 102, 241, 0.2); }
        .back-btn {
            height: 38px; width: 38px; border-radius: 50%;
            background: var(--bg-body); border: 1px solid var(--border);
            color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            margin-right: 5px; flex-shrink: 0; position: sticky; left: 0; z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        .back-btn:hover { color: var(--primary); border-color: var(--primary); }
        .tool-select {
            height: 38px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-body); color: var(--text-main);
            font-size: 13px; padding: 0 8px; outline: none; flex-shrink: 0;
        }
        .tool-select option { background: var(--bg-panel); color: var(--text-main); }
        .divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
        /* --- EDITOR AREA --- */
        .editor-scroller {
            flex: 1; overflow-y: auto; padding: 40px 20px;
            display: flex; justify-content: center;
            background: var(--bg-body);
            position: relative;
        }
        .page {
            background: white; width: 100%; max-width: 816px; min-height: 1000px;
            padding: 60px; box-shadow: var(--shadow);
            color: #000; font-family: var(--font-editor); font-size: 16px; line-height: 1.6;
            outline: none; display: none;
        }
        body.dark-mode .page { background: #1e293b; color: #e2e8f0; }
        /* Empty State */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; width: 100%;
            user-select: none;
        }
        
        .empty-icon { 
            width: 100px; height: 100px; margin-bottom: 20px;
            fill: none; stroke: currentColor; stroke-width: 1.5;
            color: #000; opacity: 0.1;
        }
        
        .empty-text { font-size: 20px; font-weight: 600; color: var(--text-muted); opacity: 0.5; }
        body.dark-mode .empty-icon { color: #fff; opacity: 0.1; }
        
        /* Editor Content Styles */
        .page img, .page video, .page .custom-shape { max-width: 100%; display: inline-block; }
        .page table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        .page td, .page th { border: 1px solid #94a3b8; padding: 8px; }
        .page blockquote { border-left: 3px solid var(--primary); padding-left: 10px; margin: 10px 0; color: var(--text-muted); font-style: italic; }
        .page pre { background: #333; color: #fff; padding: 10px; border-radius: 4px; overflow-x: auto; font-family: monospace; }
        .page a { color: var(--primary); text-decoration: underline; }
        .source-view {
            position: absolute; inset: 0; z-index: 10; background: #1e293b; color: #a5b4fc;
            padding: 20px; font-family: monospace; border: none; resize: none; display: none;
            width: 100%; height: 100%; font-size: 14px;
        }
        /* --- SIDEBAR COMPONENTS --- */
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .file-list { flex: 1; overflow-y: auto; padding: 8px; }
        .file-item {
            padding: 12px; margin-bottom: 4px; border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            color: var(--text-muted); font-size: 14px; transition: 0.1s;
        }
        .file-item:hover { background: var(--bg-body); color: var(--text-main); }
        .file-item.active { background: var(--primary-bg); color: var(--primary); font-weight: 600; }
        
        .sb-actions { display: flex; gap: 8px; margin-bottom: 12px; }
        .sb-btn { flex: 1; height: 36px; border: 1px solid var(--border); background: var(--bg-body); border-radius: 6px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;}
        .sb-btn:hover { border-color: var(--primary); color: var(--primary); }
        .sb-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        
        .search-wrap { position: relative; }
        .search-input {
            width: 100%; padding: 8px 10px 8px 34px;
            border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-body); color: var(--text-main); font-size: 13px;
        }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted); }
        /* --- BOTTOM BAR --- */
        .status-bar {
            height: 30px; background: var(--bg-panel); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; font-size: 11px; color: var(--text-muted); flex-shrink: 0;
        }
        /* --- TOAST --- */
        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 30px;
            font-size: 13px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 200;
            backdrop-filter: blur(4px); text-align: center;
        }
        #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        /* --- MODAL --- */
        .modal-wrap {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }
        .modal {
            background: var(--bg-panel); width: 90%; max-width: 350px; padding: 20px;
            border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .modal h3 { margin: 0 0 15px 0; font-size: 16px; }
        .modal input, .modal textarea { width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; font-family: inherit;}
        .modal textarea { height: 100px; resize: none; font-family: monospace; font-size: 13px;}
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-muted); }
        /* --- FULLSCREEN OVERRIDES --- */
        body.fullscreen #sidebar, 
        body.fullscreen .top-bar, 
        body.fullscreen .toolbar-container, 
        body.fullscreen .status-bar { display: none !important; }
        
        body.fullscreen .editor-scroller { padding: 0; background: #000; }
        body.fullscreen .page { 
            max-width: 100%; min-height: 100vh; border-radius: 0; 
            padding: 40px; margin: 0; display: block;
        }
        body.fullscreen .source-view { z-index: 200; }

        /* --- NEW FEATURE STYLES --- */
        .context-menu {
            position: absolute; display: none; z-index: 1000;
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 5px 0; min-width: 180px; font-size: 13px;
        }
        body.dark-mode .context-menu { box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .context-menu-item {
            padding: 8px 15px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            color: var(--text-main); font-weight: 500; transition: background 0.1s;
        }
        .context-menu-item:hover { background: var(--bg-body); color: var(--primary); }
        .context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
        .export-btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .export-btn-group .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; }

        /* INTERACTIVE DRAG/RESIZE OVERLAY */
        .interactive-overlay {
            position: absolute; border: 2px dashed var(--primary); pointer-events: none;
            z-index: 150; display: none;
        }
        .io-drag-handle {
            position: absolute; top: -14px; left: -14px; width: 28px; height: 28px;
            background: var(--primary); color: white; border-radius: 50%;
            pointer-events: auto; cursor: move; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .io-resize-handle {
            position: absolute; bottom: -8px; right: -8px; width: 16px; height: 16px;
            background: var(--primary); border: 2px solid white; border-radius: 50%;
            pointer-events: auto; cursor: se-resize; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* TABLE TOOLS MENU */
        .io-table-tools {
            position: absolute; top: -46px; left: 0;
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 6px; display: flex; gap: 5px; padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); pointer-events: auto;
            white-space: nowrap; z-index: 160;
        }
        body.dark-mode .io-table-tools { box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .io-table-tools button {
            background: var(--bg-body); border: 1px solid var(--border);
            border-radius: 4px; cursor: pointer; padding: 4px 8px;
            font-size: 11px; color: var(--text-main); font-weight: 600;
            display: flex; align-items: center; justify-content: center; transition: 0.1s;
        }
        .io-table-tools button:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .color-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .color-group input[type="color"] { padding: 2px; height: 35px; cursor: pointer; }
    </style>
    <script>
        if (localStorage.getItem('appTheme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>
</head>
<body>
    <div class="mobile-overlay" id="mobile-overlay"></div>
    <div class="modal-wrap" id="modal-wrap"><div class="modal" id="modal-content"></div></div>
    <div id="toast">Press ESC or Long Hold to exit</div>
    
    <div id="context-menu" class="context-menu">
        <div class="context-menu-item" data-action="cut"><svg class="icon" viewBox="0 0 24 24"><path d="M14 4l-4 8M10 20l4-8"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/></svg> Cut</div>
        <div class="context-menu-item" data-action="copy"><svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</div>
        <div class="context-menu-item" data-action="paste"><svg class="icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Paste</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="selectAll"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/></svg> Select All</div>
        <div class="context-menu-item" data-action="clearFormat"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg> Clear Format</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="setCss"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Set Custom CSS</div>
    </div>

    <div class="app-shell">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="sb-actions">
                    <button class="sb-btn" id="btn-new" title="New Document"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
                    <button class="sb-btn" id="btn-rename" title="Rename"><svg class="icon" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></button>
                    <button class="sb-btn" id="btn-download" title="Export Document"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
                    <button class="sb-btn danger" id="btn-delete" title="Delete"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                </div>
                <div class="search-wrap">
                    <svg class="search-icon icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="file-search" class="search-input" placeholder="Search files...">
                </div>
            </div>
            <div class="file-list" id="file-list"></div>
        </div>
        <div id="main">
            <div class="top-bar">
                <button class="tool-btn" id="toggle-sidebar" style="padding:0 8px;"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg></button>
                <input type="text" id="doc-title" value="Nothing" readonly class="empty">
                <button class="tool-btn" id="toggle-theme" style="padding:0 8px;"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg></button>
            </div>
            <div class="toolbar-container" id="toolbar-container">
                <div class="toolbar-track">
                    <div class="toolbar-slide" id="toolbar-cats"></div>
                    <div class="toolbar-slide tools-view">
                        <button class="back-btn" id="toolbar-back"><svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
                        <div style="display:flex; gap: 5px; align-items:center;" id="toolbar-tools-area"></div>
                    </div>
                </div>
            </div>
            <div class="editor-scroller" id="editor-scroller">
                <div id="empty-state" class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <div class="empty-text">No File Selected</div>
                </div>
                
                <div id="editor" class="page" contenteditable="true"></div>
                <textarea id="source-editor" class="source-view"></textarea>
                
                <!-- NEW OVERLAY WITH TABLE TOOLS -->
                <div id="interactive-overlay" class="interactive-overlay">
                    <div id="io-table-tools" class="io-table-tools" style="display:none;">
                        <button title="Add Row Above" onclick="TableManager.addRow(-1)">+R↑</button>
                        <button title="Add Row Below" onclick="TableManager.addRow(1)">+R↓</button>
                        <button title="Delete Row" onclick="TableManager.deleteRow()">-R</button>
                        <div class="divider"></div>
                        <button title="Add Col Left" onclick="TableManager.addCol(-1)">+C←</button>
                        <button title="Add Col Right" onclick="TableManager.addCol(1)">+C→</button>
                        <button title="Delete Col" onclick="TableManager.deleteCol()">-C</button>
                        <div class="divider"></div>
                        <button title="Increase Width" onclick="TableManager.resize(20, 0)">W+</button>
                        <button title="Decrease Width" onclick="TableManager.resize(-20, 0)">W-</button>
                        <button title="Increase Height" onclick="TableManager.resize(0, 20)">H+</button>
                        <button title="Decrease Height" onclick="TableManager.resize(0, -20)">H-</button>
                    </div>

                    <div id="io-drag" class="io-drag-handle"><svg class="icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M19 9l3 3-3 3M9 19l3 3 3-3M2 12h20M12 2v20"/></svg></div>
                    <div id="io-resize" class="io-resize-handle"></div>
                </div>
            </div>
            <div class="status-bar">
                <span id="status-msg">Ready</span>
                <span id="word-count">0 Words</span>
            </div>
        </div>
    </div>
    <script>
        const ICONS = {
            home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>',
            format: '<polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line>',
            insert: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line>',

        const UI = {

            openCategory(cat) {
                if (!currentDocId) return;
                const toolArea = UI.$('toolbar-tools-area');
                toolArea.innerHTML = '';
                
                TOOLS_CONFIG[cat].forEach(t => {
                    if (t.type === 'sep') {
                        const d = document.createElement('div');

                    } else if (t.type === 'btn' || t.type === 'color') {

                        if (t.type === 'color') {
                            b.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l3.5 14.5L13 18l5-5L18 13l-1.5-7.5L2 2z"/></svg><span>${t.title}</span>`;
                            b.onclick = () => {
                                const i = document.createElement('input'); i.type = 'color';
                                i.onchange = e => { document.execCommand(t.cmd, false, e.target.value); App.autoSave(); };

                                App.autoSave(); // Save formatting automatically

                        toolArea.appendChild(b);

                        const s = document.createElement('select'); s.className = 'tool-select';

                        s.onchange = () => {

            closeTools() { UI.$('toolbar-container').classList.remove('show-tools'); },
            updateToolbarState() {
                document.querySelectorAll('.tool-btn[data-cmd]').forEach(b => {
                    if (document.queryCommandState(b.dataset.cmd)) b.classList.add('active');
                    else b.classList.remove('active');
                });
                const fontSelect = UI.$('font-fam');
                if (fontSelect) {
                    let font = document.queryCommandValue('fontName');
                    font = font.replace(/['"]+/g, '');
                    let match = false;
                    for(let i=0; i<fontSelect.options.length; i++){
                        if(fontSelect.options[i].value.toLowerCase() === font.toLowerCase()){ fontSelect.selectedIndex = i; match = true; break; }
                    }
                    if(!match) fontSelect.selectedIndex = -1; 
                }
            }

        // --- INTERACTIVE MANAGER (Resizing, Dragging, Table Context) ---
        const InteractiveManager = {
            activeTarget: null,
            activeCell: null,
            init() {
                this.overlay = UI.$('interactive-overlay');
                this.dragHandle = UI.$('io-drag');
                this.resizeHandle = UI.$('io-resize');
                this.tableTools = UI.$('io-table-tools');
                this.scroller = UI.$('editor-scroller');
                this.editor = UI.$('editor');
                
                this.editor.addEventListener('mousedown', e => this.checkTarget(e));
                this.editor.addEventListener('touchstart', e => this.checkTarget(e));
                
                this.scroller.addEventListener('scroll', () => this.update());
                window.addEventListener('resize', () => this.update());
                this.editor.addEventListener('keyup', () => this.update());
                
                this.bindResize();
                this.bindDrag();
            },
            checkTarget(e) {
                const validTags =['IMG', 'VIDEO', 'TABLE', 'HR'];
                const t = e.target;

                // Handle Table Inner Clicks specifically for tracking the active cell
                if (t.tagName === 'TD' || t.tagName === 'TH') {
                    this.activeCell = t;
                    this.activeTarget = t.closest('TABLE');
                    this.update();
                    return;
                }

                if (validTags.includes(t.tagName) || t.classList.contains('custom-shape')) {
                    this.activeTarget = t;
                    if (t.tagName !== 'TABLE') this.activeCell = null;
                    this.update();
                } else {
                    if(!e.target.closest('#interactive-overlay')) {
                        this.activeTarget = null;
                        this.activeCell = null;
                        this.update();
                    }
                }
            },
            update() {
                if(!this.activeTarget) { this.overlay.style.display = 'none'; return; }
                const rect = this.activeTarget.getBoundingClientRect();
                const scrollerRect = this.scroller.getBoundingClientRect();
                
                this.overlay.style.display = 'block';
                this.overlay.style.top = (rect.top - scrollerRect.top + this.scroller.scrollTop) + 'px';
                this.overlay.style.left = (rect.left - scrollerRect.left + this.scroller.scrollLeft) + 'px';
                this.overlay.style.width = rect.width + 'px';
                this.overlay.style.height = rect.height + 'px';

                // Display Table Tools appropriately
                if (this.activeTarget.tagName === 'TABLE') {
                    this.tableTools.style.display = 'flex';
                } else {
                    this.tableTools.style.display = 'none';
                }
            },
            bindResize() {
                this.resizeHandle.addEventListener('pointerdown', e => {
                    if(!this.activeTarget) return;
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const startX = e.clientX;
                    const startY = e.clientY;
                    const startW = this.activeTarget.offsetWidth;
                    const startH = this.activeTarget.offsetHeight;

                    const onMove = e => {
                        this.activeTarget.style.width = Math.max(20, startW + (e.clientX - startX)) + 'px';
                        this.activeTarget.style.height = Math.max(20, startH + (e.clientY - startY)) + 'px';
                        this.update();
                    };
                    const onUp = () => {
                        document.removeEventListener('pointermove', onMove);
                        document.removeEventListener('pointerup', onUp);
                        App.autoSave();
                    };
                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                });
            },
            bindDrag() {
                this.dragHandle.addEventListener('pointerdown', e => {
                    if(!this.activeTarget) return;
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const ghost = this.activeTarget.cloneNode(true);
                    ghost.style.position = 'fixed';
                    ghost.style.opacity = '0.6';
                    ghost.style.pointerEvents = 'none';
                    ghost.style.zIndex = '9999';
                    
                    const rect = this.activeTarget.getBoundingClientRect();
                    let offsetX = e.clientX - rect.left;
                    let offsetY = e.clientY - rect.top;
                    
                    document.body.appendChild(ghost);
                    
                    const onMove = e => {
                        ghost.style.left = (e.clientX - offsetX) + 'px';
                        ghost.style.top = (e.clientY - offsetY) + 'px';
                    };
                    
                    const onUp = e => {
                        document.removeEventListener('pointermove', onMove);
                        document.removeEventListener('pointerup', onUp);
                        ghost.remove();
                        
                        let range;
                        if(document.caretRangeFromPoint) {
                            range = document.caretRangeFromPoint(e.clientX, e.clientY);
                        } else if(document.caretPositionFromPoint) {
                            const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
                            if(pos) {
                                range = document.createRange();
                                range.setStart(pos.offsetNode, pos.offset);
                                range.collapse(true);
                            }
                        }
                        
                        if(range && this.editor.contains(range.startContainer)) {
                            range.insertNode(this.activeTarget);
                            this.update();
                            App.autoSave();
                        } else {
                            this.update(); 
                        }
                    };
                    
                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                });
            }
        };

        // --- NEW: TABLE MANAGER LOGIC ---
        window.TableManager = {
            getActiveCell() {
                const IM = InteractiveManager;
                let cell = IM.activeCell;
                if (!cell && IM.activeTarget && IM.activeTarget.tagName === 'TABLE') {
                    // Fallback to first cell if clicked borders
                    const tbody = IM.activeTarget.querySelector('tbody') || IM.activeTarget;
                    if (tbody.children.length > 0 && tbody.children[0].children.length > 0) {
                        cell = tbody.children[0].children[0];
                    }
                }
                return cell;
            },
            addRow(offset) {
                const cell = this.getActiveCell();
                if (!cell) return;
                const tr = cell.closest('TR');
                const tbody = tr.parentNode;
                const newTr = document.createElement('TR');
                
                for(let i=0; i<tr.children.length; i++) {
                    const td = document.createElement(tr.children[i].tagName);
                    td.innerHTML = '&nbsp;'; // default empty content
                    newTr.appendChild(td);
                }
                if (offset < 0) tbody.insertBefore(newTr, tr);
                else tbody.insertBefore(newTr, tr.nextSibling);
                
                App.autoSave(); InteractiveManager.update();
            },
            addCol(offset) {
                const cell = this.getActiveCell();
                if (!cell) return;
                const tr = cell.closest('TR');
                const tbody = tr.parentNode;
                const cellIdx = Array.from(tr.children).indexOf(cell);
                
                Array.from(tbody.children).forEach(row => {
                    const targetCell = row.children[cellIdx];
                    const newCell = document.createElement(targetCell ? targetCell.tagName : 'TD');
                    newCell.innerHTML = '&nbsp;';
                    if (offset < 0) row.insertBefore(newCell, targetCell);
                    else {
                        if (targetCell) row.insertBefore(newCell, targetCell.nextSibling);
                        else row.appendChild(newCell);
                    }
                });
                App.autoSave(); InteractiveManager.update();
            },
            deleteRow() {
                const cell = this.getActiveCell();
                if (!cell) return;
                const tr = cell.closest('TR');
                const tbody = tr.parentNode;
                tr.remove();
                
                if (tbody.children.length === 0) {
                    InteractiveManager.activeTarget.remove();
                    InteractiveManager.activeTarget = null;
                    InteractiveManager.activeCell = null;
                } else {
                    InteractiveManager.activeCell = tbody.children[0].children[0];
                }
                App.autoSave(); InteractiveManager.update();
            },
            deleteCol() {
                const cell = this.getActiveCell();
                if (!cell) return;
                const tr = cell.closest('TR');
                const tbody = tr.parentNode;
                const cellIdx = Array.from(tr.children).indexOf(cell);
                
                Array.from(tbody.children).forEach(row => {
                    if(row.children[cellIdx]) row.children[cellIdx].remove();
                });
                
                if (tbody.children[0] && tbody.children[0].children.length === 0) {
                    InteractiveManager.activeTarget.remove();
                    InteractiveManager.activeTarget = null;
                    InteractiveManager.activeCell = null;
                } else if (InteractiveManager.activeTarget) {
                    InteractiveManager.activeCell = tbody.children[0].children[0];
                }
                App.autoSave(); InteractiveManager.update();
            },
            resize(dw, dh) {
                const t = InteractiveManager.activeTarget;
                if (!t || t.tagName !== 'TABLE') return;
                t.style.width = Math.max(50, t.offsetWidth + dw) + 'px';
                if (dh !== 0) {
                    t.style.height = Math.max(20, t.offsetHeight + dh) + 'px';
                }
                App.autoSave(); InteractiveManager.update();
            }
        };

        const App = {
            async init() {
                await this.initDB();
                this.bindEvents();
                InteractiveManager.init();
                this.refreshFiles();
                UI.renderCategories();
                this.setNoFileState();
            },
            initDB() {
                return new Promise(r => {
                    const req = indexedDB.open("UltHTMLWriter_V3", 1);
                    req.onupgradeneeded = e => e.target.result.createObjectStore("docs", { keyPath: "id", autoIncrement: true });
                    req.onsuccess = e => { db = e.target.result; r(); };
                });
            },
            wrapSelection(customCSS) {
                const sel = window.getSelection();
                if (!sel.rangeCount || sel.isCollapsed) { UI.toast("Please select text first!"); return null; }
                const range = sel.getRangeAt(0);
                const span = document.createElement('span');
                span.style.cssText = customCSS;
                try {
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                    return span;
                } catch(e) { UI.toast("Error wrapping selection."); return null;}
            },
            bindEvents() {
                const ed = UI.$('editor');
                
                ed.addEventListener('mouseup', UI.updateToolbarState);
                ed.addEventListener('keyup', () => { UI.updateToolbarState(); this.autoSave(); this.updateWordCount(); });
                
                ed.addEventListener('keydown', e => {
                    if (!currentDocId) return;
                    if (e.ctrlKey || e.metaKey) {
                        const key = e.key.toLowerCase();
                        let handled = false;
                        if (key === 'z') { if (e.shiftKey) document.execCommand('redo'); else document.execCommand('undo'); handled = true; } 
                        else if (key === 'y') { document.execCommand('redo'); handled = true; } 
                        else if (key === 'b') { document.execCommand('bold'); handled = true; } 
                        else if (key === 'i') { document.execCommand('italic'); handled = true; } 
                        else if (key === 'u') { document.execCommand('underline'); handled = true; } 
                        else if (key === 's') { App.autoSave(); UI.toast("Saved"); handled = true; }
                        
                        if (handled) { e.preventDefault(); UI.updateToolbarState(); App.autoSave(); }
                    }
                });

                // Context Menu
                const cm = UI.$('context-menu');
                let contextTarget = null;

                ed.addEventListener('contextmenu', e => {
                    if(!currentDocId) return;
                    e.preventDefault();
                    
                    contextTarget = null;
                    if(InteractiveManager.activeTarget) {
                        contextTarget = InteractiveManager.activeTarget;
                    } else if (window.getSelection().rangeCount > 0 && !window.getSelection().isCollapsed) {
                        contextTarget = "selection";
                    } else {
                        contextTarget = e.target;
                    }

                    cm.style.display = 'block';
                    let x = e.pageX, y = e.pageY;
                    if (x + cm.offsetWidth > window.innerWidth) x = window.innerWidth - cm.offsetWidth - 10;
                    if (y + cm.offsetHeight > window.innerHeight) y = window.innerHeight - cm.offsetHeight - 10;
                    cm.style.left = x + 'px'; cm.style.top = y + 'px';
                });
                
                document.addEventListener('click', e => { if(!e.target.closest('#context-menu')) cm.style.display = 'none'; });
                
                document.querySelectorAll('.context-menu-item').forEach(item => {
                    item.onclick = async () => {
                        const action = item.dataset.action;
                        ed.focus();
                        try {
                            if (action === 'cut') { document.execCommand('cut'); App.autoSave(); }
                            else if (action === 'copy') document.execCommand('copy');
                            else if (action === 'paste') {
                                try { 
                                    const text = await navigator.clipboard.readText(); 
                                    document.execCommand('insertText', false, text); 
                                    App.autoSave(); 
                                } catch(err) { UI.toast("Use Ctrl+V to paste."); }
                            }
                            else if (action === 'selectAll') document.execCommand('selectAll');
                            else if (action === 'clearFormat') { document.execCommand('removeFormat'); App.autoSave(); }
                            else if (action === 'setCss') {
                                let tgt = contextTarget;
                                if(tgt === "selection") tgt = App.wrapSelection("");
                                if(!tgt) return;
                                
                                const m = UI.modal(`
                                    <h3>Set Custom CSS</h3>
                                    <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">Apply custom styles (e.g. <code>border: 2px solid red; background: linear-gradient(red, blue);</code>)</div>
                                    <textarea id="css-in">${tgt.style.cssText}</textarea>
                                    <div class="modal-btns">
                                        <button class="btn btn-ghost" id="css-cancel">Cancel</button>
                                        <button class="btn btn-primary" id="css-save">Apply</button>
                                    </div>
                                `);
                                UI.$('css-cancel').onclick = m.close;
                                UI.$('css-save').onclick = () => {
                                    tgt.style.cssText = UI.$('css-in').value;
                                    InteractiveManager.update();
                                    App.autoSave();
                                    m.close();
                                }
                            }
                        } catch (err) {}
                        cm.style.display = 'none';
                        UI.updateToolbarState();
                    };
                });
                
                UI.$('toolbar-back').onclick = UI.closeTools;
                UI.$('toggle-sidebar').onclick = () => UI.toggleSidebar();
                UI.$('mobile-overlay').onclick = () => UI.toggleSidebar(false);
                
                document.querySelectorAll('.toolbar-slide').forEach(el => {
                    el.addEventListener('wheel', (e) => { if (e.deltaY !== 0) { e.preventDefault(); el.scrollLeft += e.deltaY; } });
                });
                
                UI.$('toggle-theme').onclick = () => {
                    document.body.classList.toggle('dark-mode'); document.documentElement.classList.toggle('dark-mode');
                    localStorage.setItem('appTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
                };
                
                UI.$('btn-new').onclick = () => UI.prompt("Document Name", name => { if (name) this.saveDoc({ title: name, content: '<p>Start typing...</p>' }).then((id) => this.loadDoc(id)); });
                UI.$('btn-rename').onclick = () => { if (!currentDocId) return UI.toast("No file"); UI.prompt("Rename File", newName => { if(newName) { UI.$('doc-title').value = newName; this.autoSave(); } }); };
                UI.$('btn-delete').onclick = () => {
                    if (currentDocId && confirm("Delete this file?")) {
                        const tx = db.transaction("docs", "readwrite");
                        tx.objectStore("docs").delete(currentDocId);
                        tx.oncomplete = () => { this.setNoFileState(); this.refreshFiles(); };
                    }
                };
                
                UI.$('btn-download').onclick = () => {
                    if(!currentDocId) return;
                    const title = UI.$('doc-title').value || 'document';
                    const m = UI.modal(`<h3>Export Document</h3><div class="export-btn-group"><button class="btn btn-primary" id="exp-html">Export HTML</button><button class="btn btn-ghost" id="exp-txt">Export Plain Text</button></div><div class="modal-btns" style="margin-top:15px"><button class="btn btn-ghost" id="exp-cancel">Cancel</button></div>`);
                    UI.$('exp-html').onclick = () => { this.downloadBlob(new Blob([UI.$('editor').innerHTML], {type:'text/html'}), title + '.html'); m.close(); };
                    UI.$('exp-txt').onclick = () => { this.downloadBlob(new Blob([UI.$('editor').innerText], {type:'text/plain'}), title + '.txt'); m.close(); };
                    UI.$('exp-cancel').onclick = m.close;
                };

                UI.$('file-search').oninput = e => this.refreshFiles(e.target.value);
                UI.$('doc-title').oninput = () => this.autoSave();
                
                document.addEventListener('keydown', e => { if(e.key === 'Escape' && document.body.classList.contains('fullscreen')) App.toggleFullscreen(false); });
                const startLP = () => { if(document.body.classList.contains('fullscreen')) longPressTimer = setTimeout(() => App.toggleFullscreen(false), 1000); };
                const endLP = () => clearTimeout(longPressTimer);
                document.addEventListener('mousedown', startLP); document.addEventListener('touchstart', startLP);
                document.addEventListener('mouseup', endLP); document.addEventListener('touchend', endLP);
            },
            downloadBlob(blob, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); },
            handleCustom(action) {
                const ed = UI.$('editor');
                if (action === 'link') UI.prompt("Enter URL", url => { document.execCommand('createLink', false, url); App.autoSave(); });
                
                if (action === 'image') {
                    const m = UI.modal(`<h3>Insert Image</h3><button class="btn btn-ghost" style="width:100%; border:1px dashed var(--text-muted); padding:15px; margin-bottom:10px;" id="upload-img-btn"><svg class="icon" style="margin-right:5px; vertical-align:middle" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> Upload from Device</button><div style="text-align:center; margin-bottom:10px; color:var(--text-muted); font-size:12px;">OR ENTER URL</div><input id="img-url-in" placeholder="https://..."><input type="file" id="hidden-img-in" accept="image/*" style="display:none;"><div class="modal-btns"><button class="btn btn-ghost" id="img-cancel">Cancel</button><button class="btn btn-primary" id="img-ok">Insert URL</button></div>`);
                    UI.$('upload-img-btn').onclick = () => UI.$('hidden-img-in').click();
                    UI.$('hidden-img-in').onchange = e => { const file = e.target.files[0]; if(file) { const reader = new FileReader(); reader.onload = re => { document.execCommand('insertImage', false, re.target.result); App.autoSave(); m.close(); }; reader.readAsDataURL(file); } };
                    UI.$('img-cancel').onclick = m.close;
                    UI.$('img-ok').onclick = () => { const url = UI.$('img-url-in').value; if(url) { document.execCommand('insertImage', false, url); App.autoSave(); } m.close(); };
                }

                if (action === 'video') UI.prompt("Enter Video URL (.mp4, etc):", url => { document.execCommand('insertHTML', false, `<video src="${url}" controls style="width:300px; height:auto;"></video>`); App.autoSave(); });
                if (action === 'table') { document.execCommand('insertHTML', false, '<table style="width:100%; border-collapse: collapse; margin: 10px 0;"><tr><td>Cell 1</td><td>Cell 2</td></tr><tr><td>Cell 3</td><td>Cell 4</td></tr></table>'); App.autoSave(); }
                if (action === 'date') { document.execCommand('insertHTML', false, new Date().toLocaleDateString()); App.autoSave(); }
                if (action === 'print') window.print();
                
                // Shape Insertion
                if (action === 'shape') {
                    const m = UI.modal(`<h3>Insert Shape</h3><div class="export-btn-group"><button class="btn btn-primary" id="sh-rect">Rectangle</button><button class="btn btn-primary" id="sh-circle">Circle</button></div><div class="modal-btns" style="margin-top:15px"><button class="btn btn-ghost" id="sh-cancel">Cancel</button></div>`);
                    UI.$('sh-rect').onclick = () => { document.execCommand('insertHTML', false, `<div class="custom-shape" style="width:100px; height:100px; background:var(--primary); border:2px solid transparent;"></div>`); App.autoSave(); m.close(); };
                    UI.$('sh-circle').onclick = () => { document.execCommand('insertHTML', false, `<div class="custom-shape" style="width:100px; height:100px; background:var(--primary); border-radius:50%; border:2px solid transparent;"></div>`); App.autoSave(); m.close(); };
                    UI.$('sh-cancel').onclick = m.close;
                }

                // Text Formatting tools
                if (action === 'textSpacing') UI.prompt("Letter Spacing (e.g., 2px or 0.1em):", val => { App.wrapSelection(`letter-spacing: ${val};`); App.autoSave(); }, "2px");
                if (action === 'fontWeight') UI.prompt("Font Weight (100-900 or bold):", val => { App.wrapSelection(`font-weight: ${val};`); App.autoSave(); }, "800");
                if (action === 'textGradient') {
                    const m = UI.modal(`<h3>Gradient Text Color</h3><div class="color-group"><input type="color" id="g-c1" value="#ff0000"><input type="color" id="g-c2" value="#0000ff"></div><div class="modal-btns"><button class="btn btn-ghost" id="g-cancel">Cancel</button><button class="btn btn-primary" id="g-ok">Apply</button></div>`);
                    UI.$('g-cancel').onclick = m.close;
                    UI.$('g-ok').onclick = () => {
                        const css = `background: linear-gradient(45deg, ${UI.$('g-c1').value}, ${UI.$('g-c2').value}); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display:inline;`;
                        App.wrapSelection(css);
                        App.autoSave();
                        m.close();
                    };
                }

                if (action === 'fullscreen') this.toggleFullscreen(true);
                if (action === 'source') {
                    const src = UI.$('source-editor');
                    if (src.style.display === 'block') { ed.innerHTML = src.value; src.style.display = 'none'; InteractiveManager.update(); App.autoSave(); } 
                    else { src.value = ed.innerHTML; src.style.display = 'block'; UI.toast("Editing Code. Press ESC to exit."); InteractiveManager.overlay.style.display = 'none'; }
                }
            },
            toggleFullscreen(active) {
                if(active) { document.body.classList.add('fullscreen'); UI.toast("Press ESC or Long Hold to exit"); InteractiveManager.update(); } 
                else { document.body.classList.remove('fullscreen'); InteractiveManager.update(); }
            },
            setNoFileState() {
                currentDocId = null;
                UI.$('editor').style.display = 'none'; UI.$('empty-state').style.display = 'flex';
                UI.$('doc-title').value = "Nothing"; UI.$('doc-title').classList.add('empty'); UI.$('doc-title').readOnly = true;
                UI.$('status-msg').innerText = "No File Selected"; UI.$('word-count').innerText = "0 Words";
                UI.closeTools(); InteractiveManager.activeTarget = null; InteractiveManager.update();
            },
            async refreshFiles(query = '') {
                const tx = db.transaction("docs", "readonly");
                const store = tx.objectStore("docs");
                const req = store.getAll();
                req.onsuccess = () => {
                    const list = UI.$('file-list'); list.innerHTML = '';
                    const files = req.result.sort((a,b) => b.id - a.id);
                    files.forEach(f => {
                        if (query && !f.title.toLowerCase().includes(query.toLowerCase())) return;
                        const el = document.createElement('div');
                        el.className = `file-item ${f.id === currentDocId ? 'active' : ''}`;
                        el.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg> <span>${f.title}</span>`;
                        el.onclick = () => this.loadDoc(f.id);
                        list.appendChild(el);
                    });
                };
            },
            loadDoc(id) {
                const tx = db.transaction("docs", "readonly");
                tx.objectStore("docs").get(id).onsuccess = e => {
                    const doc = e.target.result;
                    if (doc) {
                        currentDocId = doc.id;
                        const ed = UI.$('editor'); ed.innerHTML = doc.content;
                        UI.$('empty-state').style.display = 'none'; ed.style.display = 'block';
                        ed.focus();
                        const titleInput = UI.$('doc-title');
                        titleInput.value = doc.title; titleInput.classList.remove('empty'); titleInput.readOnly = false;
                        UI.$('status-msg').innerText = "Ready";
                        this.updateWordCount();
                        if (isMobile) UI.toggleSidebar(false);
                        this.refreshFiles();
                        InteractiveManager.activeTarget = null; InteractiveManager.update();
                    }
                };
            },
            saveDoc(doc) {
                return new Promise(r => {
                    const tx = db.transaction("docs", "readwrite");
                    tx.objectStore("docs").put(doc).onsuccess = e => { currentDocId = e.target.result; r(currentDocId); };
                });
            },
            autoSave() {
                if (!currentDocId) return;
                clearTimeout(this.saveTimer);
                UI.$('status-msg').innerText = "Saving...";
                this.saveTimer = setTimeout(() => {
                    this.saveDoc({ id: currentDocId, title: UI.$('doc-title').value, content: UI.$('editor').innerHTML }).then(() => {
                        UI.$('status-msg').innerText = "Saved"; this.refreshFiles();
                    });
                }, 1000);
            },
            updateWordCount() {
                const txt = UI.$('editor').innerText || "";
                const chars = txt.length;
                const count = txt.trim().length === 0 ? 0 : txt.trim().split(/\s+/).length;
                const readTime = Math.ceil(count / 200); 
                UI.$('word-count').innerText = `${count} Words | ${chars} Chars | ${readTime} min read`;
            }
        };
        App.init();
    </script>
</body>
