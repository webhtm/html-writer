            return t;
        },

        after() {
            this.renderPreview();
            InteractiveManager.scheduleUpdate();
            Paginator.schedule();
            App.autoSave();
        },

        renderPreview() {
            const box = UI.$('fmt-preview');
            if (!box) return;
            box.innerHTML = '';
            if (!this.target) { box.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">No object selected</span>'; return; }
            const clone = this.target.cloneNode(true);
            clone.removeAttribute('contenteditable');
            clone.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
            clone.classList.remove('obj-selected');
            clone.style.margin = '0';
            clone.style.float = 'none';
            clone.style.maxWidth = '100%';
            box.appendChild(clone);
            // Scale the preview down if the real object is much bigger
            requestAnimationFrame(() => {
                const bw = box.clientWidth - 8, bh = 130;
                const cw = clone.offsetWidth || 1, ch = clone.offsetHeight || 1;
                const s = Math.min(1, bw / cw, bh / ch);
                if (s < 1) {
                    clone.style.transform = (clone.style.transform || '') + ` scale(${s.toFixed(3)})`;
                    clone.style.transformOrigin = 'center';
                }
            });
        },

        search(q) {
            this.query = (q || '').trim().toLowerCase();
            this.render();
        },

        visibleControls() {
            if (this.query) {
                const q = this.query;
                return FORMAT_CONTROLS.filter(c =>
                    c.label.toLowerCase().includes(q) ||
                    (c.kw || '').includes(q) ||
                    c.tab.toLowerCase().includes(q) ||
                    (c.group || '').toLowerCase().includes(q));
            }
            return FORMAT_CONTROLS.filter(c => c.tab === this.activeTab);
        },

        syncTabs() {
            const tabs = UI.$('fmt-tabs');
            if (!tabs) return;
            let active = null;
            tabs.querySelectorAll('.fmt-tab').forEach(x => {
                const on = !this.query && x.dataset.tab === this.activeTab;
                x.classList.toggle('active', on);
                if (on) active = x;
            });
            if (active) active.scrollIntoView({ block:'nearest', inline:'nearest' });
        },
        render() {
            const body = UI.$('fmt-body');
            if (!body) return;
            // A target that has been deleted from the document is no
            // longer a valid thing to format.
            if (this.target && !UI.$('editor').contains(this.target)) this.target = null;
            this.syncTabs();
            this.renderPreview();
            body.innerHTML = '';

            if (!this.target) {
                body.innerHTML = `<div class="fmt-empty">
                    Nothing selected yet.<br><br>
                    Tap an image, shape, table, field — or select some text —
                    then choose <b>Formatting…</b> from the right-click menu.
                    </div>
                    <button class="btn btn-primary" style="width:100%" id="fmt-use-sel">Format current selection</button>`;
                const b = UI.$('fmt-use-sel');
                if (b) { SelectionManager.protect(b); b.onclick = () => this.openForCurrent(); }
                return;
            }

            const list = this.visibleControls();
            if (!list.length) {
                body.innerHTML = `<div class="fmt-empty">No formatting option matches “${App.esc(this.query)}”.</div>`;
                return;
            }
            let lastGroup = null;
            list.forEach(c => {
                const groupName = this.query ? `${c.tab} · ${c.group}` : c.group;
                if (groupName !== lastGroup) {
                    const h = document.createElement('div');
                    h.className = 'fmt-group-title';
                    h.innerText = groupName;
                    body.appendChild(h);
                    lastGroup = groupName;
                }
                const node = this.buildControl(c);
                if (node) body.appendChild(node);
            });

            const actions = document.createElement('div');
            actions.className = 'fmt-actions';
            actions.innerHTML = `<button class="btn btn-ghost" id="fmt-reset">Reset all</button>
                                 <button class="btn btn-primary" id="fmt-css">Custom CSS…</button>`;
            body.appendChild(actions);
            SelectionManager.protect(UI.$('fmt-reset'));
            SelectionManager.protect(UI.$('fmt-css'));
            UI.$('fmt-reset').onclick = () => {
                UI.confirm('Clear every style on this object?', () => {
                    this.target.style.cssText = '';
                    delete this.target.dataset.fx;
                    delete this.target.dataset.tf;
                    this.after(); this.render();
                });
            };
            UI.$('fmt-css').onclick = () => {
                const m = UI.modal(`<h3>Custom CSS</h3><textarea id="fcss-in">${App.esc(this.target.style.cssText)}</textarea>
                    <div class="modal-btns"><button class="btn btn-ghost" id="fcss-c">Cancel</button><button class="btn btn-primary" id="fcss-ok">Apply</button></div>`);
                UI.$('fcss-c').onclick = m.close;
                UI.$('fcss-ok').onclick = () => { this.target.style.cssText = UI.$('fcss-in').value; this.after(); this.render(); m.close(); };
            };
        },

        // ---------- style plumbing ----------
        css(prop) {
            if (!this.target) return '';
            const inline = this.target.style[prop];
            if (inline) return inline;
            try { return getComputedStyle(this.target)[prop] || ''; } catch (e) { return ''; }
        },
        set(prop, val) {
            if (!this.target) return;
            if (val === '' || val == null) this.target.style.removeProperty(prop.replace(/[A-Z]/g, m => '-' + m.toLowerCase()));
            else this.target.style[prop] = val;
            this.after();
        },
        num(prop, def) {
            const v = parseFloat(this.css(prop));
            return isFinite(v) ? v : def;
        },

        // filter() and transform() are composites — sub-values live in a
        // dataset blob and get recombined into one CSS declaration.
        fxState() {
            try { return JSON.parse(this.target.dataset.fx || '{}'); } catch (e) { return {}; }
        },
        setFx(name, value, unit, def) {
            const st = this.fxState();
            if (value === def) delete st[name]; else st[name] = value + unit;
            this.target.dataset.fx = JSON.stringify(st);
            const parts = Object.keys(st).map(k => k === 'drop-shadow' ? `drop-shadow(0 ${st[k]} ${st[k]} rgba(0,0,0,0.45))` : `${k}(${st[k]})`);
            this.target.style.filter = parts.join(' ');
            this.after();
        },
        tfState() {
            try { return JSON.parse(this.target.dataset.tf || '{}'); } catch (e) { return {}; }
        },
        setTf(name, value, unit, def) {
            const st = this.tfState();
            if (value === def) delete st[name]; else st[name] = { v: value, u: unit };
            this.target.dataset.tf = JSON.stringify(st);
            const order = ['perspective','translateX','translateY','rotate','rotateX','rotateY','skewX','skewY','scale'];
            const parts = order.filter(k => st[k]).map(k => {
                if (k === 'scale') return `scale(${(st[k].v / 100).toFixed(3)})`;
                return `${k}(${st[k].v}${st[k].u})`;
            });
            this.target.style.transform = parts.join(' ');
            if (st.rotateX || st.rotateY) this.target.style.transformStyle = 'preserve-3d';
            if (parts.length && getComputedStyle(this.target).display === 'inline') this.target.style.display = 'inline-block';
            this.after();
        },

        hexToRgba(hex, a) {
            const h = (hex || '#000000').replace('#','');
            const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
            return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;
        },
        toHex(color) {
            if (!color) return '#000000';
            if (color.startsWith('#')) return color.length === 4 ? '#' + color.slice(1).split('').map(c=>c+c).join('') : color.slice(0,7);
            const m = color.match(/rgba?\(([^)]+)\)/);
            if (!m) return '#000000';
            const p = m[1].split(',').map(s => parseFloat(s));
            return '#' + p.slice(0,3).map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
        },

        // ---------- control factory ----------
        buildControl(c) {
            const wrap = document.createElement('div');
            wrap.className = 'fmt-ctl';
            const self = this;

            const head = (extra) => `<label><span>${c.label}</span><span class="fmt-val" id="v-${c.id}">${extra || ''}</span></label>`;

            if (c.type === 'range') {
                let cur;
                if (c.fx) { const st = this.fxState(); cur = st[c.fx] !== undefined ? parseFloat(st[c.fx]) : c.def; }
                else if (c.tf) { const st = this.tfState(); cur = st[c.tf] ? st[c.tf].v : c.def; }
                else if (c.custom) cur = this.customGet(c);
                else cur = this.num(c.prop, c.def);
                if (!isFinite(cur)) cur = c.def;
                wrap.innerHTML = head(cur + c.unit) +
                    `<input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${cur}">`;
                const input = wrap.querySelector('input');
                const val = wrap.querySelector('.fmt-val');
                const apply = v => {
                    val.innerText = v + c.unit;
                    if (c.fx) self.setFx(c.fx, v, c.unit, c.def);
                    else if (c.tf) self.setTf(c.tf, v, c.unit, c.def);
                    else if (c.custom) self.customSet(c, v);
                    else self.set(c.prop, v + c.unit);
                };
                input.oninput = e => apply(parseFloat(e.target.value));
                return wrap;
            }

            if (c.type === 'text') {
                const cur = c.custom ? this.customGet(c) : (this.target.style[c.prop] || '');
                wrap.innerHTML = head() + `<input type="text" value="${App.esc(cur)}" placeholder="${App.esc(c.placeholder || '')}">`;
                const input = wrap.querySelector('input');
                SelectionManager.watch(input);
                input.onchange = () => { if (c.custom) self.customSet(c, input.value); else self.set(c.prop, input.value); };
                return wrap;
            }

            if (c.type === 'select') {
                const cur = (this.target.style[c.prop] || '');
                wrap.innerHTML = head() + `<select>${c.opts.map(o => `<option value="${App.esc(o[0])}"${o[0] === cur ? ' selected' : ''}>${o[1]}</option>`).join('')}</select>`;
                const sel = wrap.querySelector('select');
                SelectionManager.watch(sel);
                sel.onchange = () => self.set(c.prop, sel.value);
                return wrap;
            }

            if (c.type === 'chips') {
                const cur = c.custom ? String(this.customGet(c)) : (this.target.style[c.prop] || '');
                wrap.innerHTML = head() + `<div class="fmt-chiprow">${c.opts.map(o =>
                    `<button class="fmt-chip${String(o[0]) === cur ? ' active' : ''}" data-v="${App.esc(o[0])}">${o[1]}</button>`).join('')}</div>`;
                wrap.querySelectorAll('.fmt-chip').forEach(b => {
                    SelectionManager.protect(b);
                    b.onclick = () => {
                        wrap.querySelectorAll('.fmt-chip').forEach(x => x.classList.toggle('active', x === b));
                        if (c.custom) self.customSet(c, b.dataset.v);
                        else self.set(c.prop, b.dataset.v);
                    };
                });
                return wrap;
            }

            if (c.type === 'color') {
                const cur = this.toHex(this.css(c.prop));
                wrap.innerHTML = head() +
                    `<div class="fmt-row">
                        <input type="color" value="${cur}" style="width:46px;height:34px;padding:2px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elevated);cursor:pointer;">
                        <input type="text" value="${cur}" placeholder="#000000">
                     </div>
                     <input type="range" min="0" max="100" step="1" value="100" title="Opacity">`;
                const [picker, hex] = wrap.querySelectorAll('input[type="color"], input[type="text"]');
                const alpha = wrap.querySelector('input[type="range"]');
                SelectionManager.watch(picker); SelectionManager.watch(hex); SelectionManager.watch(alpha);
                const apply = () => {
                    const a = parseFloat(alpha.value) / 100;
                    self.set(c.prop, a >= 1 ? picker.value : self.hexToRgba(picker.value, a));
                };
                picker.oninput = () => { hex.value = picker.value; apply(); };
                hex.onchange = () => { if (/^#[0-9a-fA-F]{3,8}$/.test(hex.value)) { picker.value = self.toHex(hex.value); apply(); } };
                alpha.oninput = apply;
                return wrap;
            }

            if (c.type === 'paint') {
                const curCss = c.custom === 'textGradient' ? (this.target.style.backgroundImage || '') : this.css(c.prop || 'background');
                wrap.innerHTML = head() +
                    `<button class="fmt-color-btn"><span class="sw"><i style="background:${App.esc(curCss || 'transparent')}"></i></span><span>Pick colour or gradient…</span></button>`;
                const btn = wrap.querySelector('button');
                SelectionManager.protect(btn);
                btn.onclick = () => {
                    ColorPanel.open({
                        title: c.label,
                        showTextOption: false,
                        onApply: res => {
                            if (c.custom === 'textGradient') {
                                if (res.clear) {
                                    self.target.style.background = '';
                                    self.target.style.webkitBackgroundClip = '';
                                    self.target.style.backgroundClip = '';
                                    self.target.style.webkitTextFillColor = '';
                                    self.target.style.color = '';
                                } else {
                                    self.target.style.background = res.css;
                                    self.target.style.webkitBackgroundClip = 'text';
                                    self.target.style.backgroundClip = 'text';
                                    self.target.style.webkitTextFillColor = 'transparent';
                                    self.target.style.display = self.target.style.display || 'inline-block';
                                }
                            } else {
                                self.set(c.prop, res.clear ? '' : res.css);
                                if (self.target.classList.contains('custom-shape') && !res.clear) {
                                    const svg = self.target.querySelector('svg');
                                    if (svg) svg.querySelectorAll('[fill]').forEach(n => { if (n.getAttribute('fill') !== 'none') n.setAttribute('fill', res.css); });
                                }
                            }
                            self.after();
                            self.render();
                        }
                    });
                };
                return wrap;
            }

            if (c.type === 'shadow') {
                const key = c.which === 'text' ? 'textShadow' : 'boxShadow';
                const st = this.shadowState(key);
                wrap.innerHTML = `<div class="fmt-group-title" style="margin-top:0">${c.label}</div>
                    <div class="fmt-row">
                        <div style="flex:1"><label><span>X</span><span class="fmt-val">${st.x}px</span></label><input data-k="x" type="range" min="-40" max="40" value="${st.x}"></div>
                        <div style="flex:1"><label><span>Y</span><span class="fmt-val">${st.y}px</span></label><input data-k="y" type="range" min="-40" max="40" value="${st.y}"></div>
                    </div>
                    <label><span>Blur</span><span class="fmt-val">${st.blur}px</span></label><input data-k="blur" type="range" min="0" max="80" value="${st.blur}">
                    ${c.which === 'box' ? `<label><span>Spread</span><span class="fmt-val">${st.spread}px</span></label><input data-k="spread" type="range" min="-30" max="60" value="${st.spread}">` : ''}
                    <label><span>Opacity</span><span class="fmt-val">${Math.round(st.a*100)}%</span></label><input data-k="a" type="range" min="0" max="100" value="${Math.round(st.a*100)}">
                    <div class="fmt-row" style="margin-top:6px;">
                        <input data-k="color" type="color" value="${st.color}" style="width:46px;height:32px;padding:2px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elevated);">
                        ${c.which === 'box' ? `<button class="fmt-chip${st.inset ? ' active' : ''}" data-k="inset" style="flex:1">Inset</button>` : ''}
                        <button class="fmt-chip" data-k="clear" style="flex:1">Clear</button>
                    </div>`;
                wrap.querySelectorAll('input[type="range"]').forEach(r => {
                    r.oninput = () => {
                        const s = self.shadowState(key);
                        s[r.dataset.k] = r.dataset.k === 'a' ? parseFloat(r.value) / 100 : parseFloat(r.value);
                        const lbl = r.previousElementSibling && r.previousElementSibling.querySelector('.fmt-val');
                        if (lbl) lbl.innerText = r.dataset.k === 'a' ? Math.round(s.a * 100) + '%' : s[r.dataset.k] + 'px';
                        self.writeShadow(key, s);
                    };
                });
                const colorIn = wrap.querySelector('input[type="color"]');
                SelectionManager.watch(colorIn);
                colorIn.oninput = () => { const s = self.shadowState(key); s.color = colorIn.value; self.writeShadow(key, s); };
                wrap.querySelectorAll('.fmt-chip').forEach(b => {
                    SelectionManager.protect(b);
                    b.onclick = () => {
                        const s = self.shadowState(key);
                        if (b.dataset.k === 'inset') { s.inset = !s.inset; b.classList.toggle('active', s.inset); }
                        else { self.target.style[key] = ''; delete self.target.dataset[key + 'St']; self.after(); self.render(); return; }
                        self.writeShadow(key, s);
                    };
                });
                return wrap;
            }

            if (c.type === 'presets') {
                const presets = [
                    { n:'Card',    css:{ background:'#ffffff', borderRadius:'5px', boxShadow:'0 2px 6px rgba(0,0,0,.08), 0 12px 28px rgba(0,0,0,.10)', padding:'18px' } },
                    { n:'Glass',   css:{ background:'rgba(255,255,255,0.18)', backdropFilter:'blur(12px)', border:'1px solid rgba(255,255,255,0.35)', borderRadius:'5px', padding:'18px' } },
                    { n:'Neon',    css:{ background:'#0b0f24', color:'#7df9ff', borderRadius:'5px', padding:'16px', boxShadow:'0 0 12px #7df9ff, 0 0 32px rgba(125,249,255,.5)', border:'1px solid #7df9ff' } },
                    { n:'Paper',   css:{ background:'#fdfaf3', border:'1px solid #e6dfcd', borderRadius:'5px', padding:'20px', boxShadow:'0 1px 2px rgba(0,0,0,.06)' } },
                    { n:'Emboss',  css:{ background:'#e8eaf2', borderRadius:'5px', padding:'16px', boxShadow:'inset 0 2px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.10)' } },
                    { n:'Outline', css:{ background:'transparent', border:'2px dashed var(--primary)', borderRadius:'5px', padding:'14px' } },
                    { n:'Sunset',  css:{ background:'linear-gradient(135deg,#ff8a3d,#ff3d77)', color:'#fff', borderRadius:'5px', padding:'18px' } },
                    { n:'Ocean',   css:{ background:'linear-gradient(135deg,#0ea5e9,#6366f1)', color:'#fff', borderRadius:'5px', padding:'18px' } },
                    { n:'Flat',    css:{ background:'', border:'', borderRadius:'', boxShadow:'', padding:'', backdropFilter:'' } }
                ];
                wrap.innerHTML = `<div class="fmt-preset-grid">${presets.map((p,i) =>
                    `<button class="fmt-preset" data-i="${i}"><span class="pv" style="${p.css.background ? `background:${p.css.background};` : 'background:var(--border);'}${p.css.borderRadius ? `border-radius:${p.css.borderRadius};` : ''}"></span>${p.n}</button>`).join('')}</div>`;
                wrap.querySelectorAll('.fmt-preset').forEach(b => {
                    SelectionManager.protect(b);
                    b.onclick = () => {
                        const p = presets[+b.dataset.i];
                        Object.keys(p.css).forEach(k => { self.target.style[k] = p.css[k]; });
                        self.after(); self.render();
                    };
                });
                return wrap;
            }
            return null;
        },

        // The outer (non-inset) box shadow, so inner effects can be
        // recomposed around it instead of replacing it.
        outerShadow() {
            const el = this.target;
            if (!el) return '';
            if (el.dataset.outerShadow) return el.dataset.outerShadow;
            const cur = el.style.boxShadow || '';
            const parts = cur.split(/,(?![^(]*\))/).map(p => p.trim()).filter(p => p && !/^inset/.test(p));
            return parts.join(', ');
        },
        shadowState(key) {
            const raw = this.target.dataset[key + 'St'];
            if (raw) { try { return JSON.parse(raw); } catch (e) {} }
            return { x:0, y:4, blur:12, spread:0, a:0.25, color:'#000000', inset:false };
        },
        writeShadow(key, s) {
            this.target.dataset[key + 'St'] = JSON.stringify(s);
            const col = this.hexToRgba(s.color, s.a);
            if (key === 'textShadow') {
                this.target.style.textShadow = `${s.x}px ${s.y}px ${s.blur}px ${col}`;
            } else {
                const shadow = `${s.inset ? 'inset ' : ''}${s.x}px ${s.y}px ${s.blur}px ${s.spread}px ${col}`;
                this.target.dataset.outerShadow = s.inset ? '' : shadow;
                this.composeInner(s.inset ? shadow : null);
            }
            this.after();
        },

        // ---------- custom (composite) controls ----------
        customGet(c) {
            const el = this.target, S = el.style;
            switch (c.custom) {
                case 'opacity': return Math.round((S.opacity === '' ? 1 : parseFloat(S.opacity)) * 100);
                case 'bgAlpha': return Math.round((parseFloat(el.dataset.bgAlpha || '1')) * 100);
                case 'bgImage': { const m = (S.backgroundImage || '').match(/url\(["']?(.*?)["']?\)/); return m ? m[1] : ''; }
                case 'backdropBlur': { const m = (S.backdropFilter || '').match(/blur\(([\d.]+)px\)/); return m ? parseFloat(m[1]) : 0; }
                case 'borderWidth': return parseFloat(S.borderWidth) || 0;
                case 'radius': return parseFloat(S.borderRadius) || 0;
                case 'radiusPreset': return (S.borderRadius || '').replace('px','');
                case 'outlineW': return parseFloat(S.outlineWidth) || 0;
                case 'bevel': return parseFloat(el.dataset.bevel || '0');
                case 'gloss': return parseFloat(el.dataset.gloss || '0');
                case 'innerGlow': return parseFloat(el.dataset.innerGlow || '0');
                case 'innerShadow': return parseFloat(el.dataset.innerShadow || '0');
                case 'shadowPreset': return el.dataset.shadowPreset || 'none';
                case 'tShadowPreset': return el.dataset.tShadowPreset || 'none';
                case 'padAll': return parseFloat(S.padding) || 0;
                case 'marAll': return parseFloat(S.margin) || 0;
                case 'widthPct': { const m = (S.width || '').match(/([\d.]+)%/); return m ? parseFloat(m[1]) : 100; }
                case 'sizePreset': return '';
                case 'floatSide': {
                    if (S.float === 'left' || S.float === 'right') return S.float;
                    return /auto/.test(S.margin || '') ? 'center' : 'none';
                }
                default: return '';
            }
        },
        customSet(c, v) {
            const el = this.target, S = el.style;
            switch (c.custom) {
                case 'opacity': S.opacity = (v / 100); break;
                case 'bgAlpha': {
                    el.dataset.bgAlpha = (v / 100);
                    const base = S.backgroundColor || S.background;
                    if (base && base.startsWith('#')) S.backgroundColor = this.hexToRgba(base, v / 100);
                    else S.opacity = ''; // gradients: fall back to element opacity
                    if (base && base.startsWith('rgb')) {
                        S.backgroundColor = base.replace(/rgba?\(([^)]+)\)/, (m, p) => {
                            const parts = p.split(',').map(s => s.trim()).slice(0, 3);
                            return `rgba(${parts.join(', ')}, ${v / 100})`;
                        });
                    }
                    break;
                }
                case 'bgImage': S.backgroundImage = v ? `url("${v}")` : ''; if (v && !S.backgroundSize) S.backgroundSize = 'cover'; break;
                case 'backdropBlur': S.backdropFilter = v ? `blur(${v}px)` : ''; S.webkitBackdropFilter = S.backdropFilter; break;
                case 'borderWidth': S.borderWidth = v + 'px'; if (v && !S.borderStyle) S.borderStyle = 'solid'; if (v && !S.borderColor) S.borderColor = 'currentColor'; break;
                case 'radius': S.borderRadius = v + 'px'; break;
                case 'radiusPreset': S.borderRadius = v === '50%' ? '50%' : v + 'px'; break;
                case 'outlineW': S.outlineWidth = v + 'px'; if (v && !S.outlineStyle) S.outlineStyle = 'solid'; break;
                case 'bevel': {
                    el.dataset.bevel = v;
                    const k = v / 100;
                    el.style.setProperty('--bevel', '');
                    this.composeInner();
                    break;
                }
                case 'gloss': {
                    el.dataset.gloss = v;
                    const k = v / 100;
                    if (!v) { if ((S.backgroundImage || '').includes('linear-gradient(180deg, rgba(255,255,255')) S.backgroundImage = ''; }
                    else S.backgroundImage = `linear-gradient(180deg, rgba(255,255,255,${(0.55 * k).toFixed(2)}), rgba(255,255,255,0) 58%)`;
                    break;
                }
                case 'innerGlow': el.dataset.innerGlow = v; this.composeInner(); break;
                case 'innerShadow': el.dataset.innerShadow = v; this.composeInner(); break;
                case 'shadowPreset': {
                    el.dataset.shadowPreset = v;
                    const map = {
                        none:'', soft:'0 2px 8px rgba(0,0,0,0.10)', medium:'0 4px 14px rgba(0,0,0,0.18)',
                        hard:'0 6px 0 rgba(0,0,0,0.35)', glow:'0 0 18px rgba(99,102,241,0.75)',
                        long:'6px 6px 0 rgba(0,0,0,0.15), 12px 12px 0 rgba(0,0,0,0.10), 18px 18px 0 rgba(0,0,0,0.05)'
                    };
                    el.dataset.outerShadow = map[v] || '';
                    this.composeInner();
                    break;
                }
                case 'tShadowPreset': {
                    el.dataset.tShadowPreset = v;
                    const map = {
                        none:'', emboss:'0 1px 0 rgba(255,255,255,0.8), 0 -1px 0 rgba(0,0,0,0.35)',
                        engrave:'0 -1px 0 rgba(255,255,255,0.7), 0 1px 0 rgba(0,0,0,0.4)',
                        neon:'0 0 6px currentColor, 0 0 18px currentColor',
                        outline:'-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000'
                    };
                    S.textShadow = map[v] || '';
                    break;
                }
                case 'padAll': S.padding = v + 'px'; break;
                case 'marAll': S.margin = v + 'px'; break;
                case 'widthPct': S.width = v + '%'; S.maxWidth = '100%'; break;
                case 'sizePreset': {
                    if (v === 'auto') { S.width = ''; S.height = ''; }
                    else { S.width = v + '%'; S.maxWidth = '100%'; S.height = ''; }
                    break;
                }
                case 'floatSide': {
                    if (v === 'center') { S.float = 'none'; S.display = 'block'; S.margin = '12px auto'; }
                    else if (v === 'none') { S.float = ''; S.margin = ''; }
                    else { S.float = v; S.display = 'inline-block'; S.margin = v === 'left' ? '6px 14px 6px 0' : '6px 0 6px 14px'; }
                    break;
                }
            }
            this.after();
        },
        // Bevel + inner glow + inner shadow all live on box-shadow, so
        // they are composed together rather than overwriting each other.
        composeInner(extraInset) {
            const el = this.target, S = el.style;
            const bevel = parseFloat(el.dataset.bevel || '0') / 100;
            const glow = parseFloat(el.dataset.innerGlow || '0') / 100;
            const inner = parseFloat(el.dataset.innerShadow || '0');
            const parts = [];
            if (bevel) parts.push(`inset 0 ${(2 + bevel * 3).toFixed(1)}px 0 rgba(255,255,255,${(0.65 * bevel).toFixed(2)})`,
                                  `inset 0 -${(2 + bevel * 3).toFixed(1)}px 0 rgba(0,0,0,${(0.35 * bevel).toFixed(2)})`);
            if (glow) parts.push(`inset 0 0 ${(10 + glow * 30).toFixed(0)}px rgba(255,255,255,${(0.8 * glow).toFixed(2)})`);
            if (inner) parts.push(`inset 0 ${Math.round(inner / 3)}px ${inner}px rgba(0,0,0,0.35)`);
            // Keep whatever outer shadow the Shadows tab set — bevel/glow
            // used to silently delete it.
            if (extraInset) parts.push(extraInset);
            const outer = this.outerShadow();
            if (outer) parts.push(outer);
            S.boxShadow = parts.join(', ');
        }
    };

    // ============================================================
    //  PAGINATOR — turns the editor into REAL pages.
    //
    //  #editor (contenteditable root)
    //    └── .doc-page  (a fixed-size sheet of paper)
    //          └── .page-body  (the flowing content area)
    //
    //  After every change the paginator pushes overflowing blocks onto
    //  the next sheet and pulls blocks back up when room frees, so the
    //  document behaves like a paged word processor rather than one
    //  endless scroll. Nodes are MOVED (never re-created), so the live
    //  caret and any saved selection survive a reflow untouched.
    // ============================================================
    const Paginator = {
        timer: null,
        busy: false,
        enabled: true,

        editor() { return UI.$('editor'); },
        pages() { return Array.from(this.editor().querySelectorAll(':scope > .doc-page')); },
        body(page) { return page ? page.querySelector(':scope > .page-body') : null; },
        lastBody() { const p = this.pages(); return this.body(p[p.length - 1]); },

        newPage() {
            const page = document.createElement('div');
            page.className = 'doc-page page';
            const body = document.createElement('div');
            body.className = 'page-body';
            page.appendChild(body);
            return page;
        },

        // ---- content in / out ------------------------------------
        setContent(html) {
            const ed = this.editor();
            ed.innerHTML = '';
            const page = this.newPage();
            ed.appendChild(page);
            const body = this.body(page);
            body.innerHTML = (html && html.trim()) ? html : '<p><br></p>';
            // Nothing in a stored/imported document may be un-editable
            // except our own field shells, which are re-marked here.
            body.querySelectorAll('[contenteditable="false"]').forEach(n => {
                if (!n.classList.contains('doc-field') && !n.classList.contains('doc-field-group')) n.removeAttribute('contenteditable');
            });
            App.markFieldsUneditable(body);
            this.normalize();
            this.reflow(true);
        },
        getContent() {
            return this.pages().map(p => { const b = this.body(p); return b ? b.innerHTML : ''; }).join('');
        },

        // Make sure the structure is always root > .doc-page > .page-body.
        normalize() {
            const ed = this.editor();
            if (!ed) return;
            let pages = this.pages();
            if (!pages.length) {
                const page = this.newPage();
                const body = this.body(page);
                while (ed.firstChild) body.appendChild(ed.firstChild);
                ed.appendChild(page);
                pages = [page];
            }
            // Any stray node that landed directly on the root (paste,
            // odd execCommand output) gets folded into a page body.
            Array.from(ed.childNodes).forEach(n => {
                if (n.nodeType === 1 && n.classList.contains('doc-page')) return;
                const first = this.body(this.pages()[0]);
                if (first) first.appendChild(n); else n.remove();
            });
            // Each page must have exactly one .page-body
            this.pages().forEach(p => {
                let body = this.body(p);
                if (!body) {
                    body = document.createElement('div');
                    body.className = 'page-body';
                    while (p.firstChild) body.appendChild(p.firstChild);
                    p.appendChild(body);
                }
                // Text directly inside a body gets wrapped in a paragraph
                Array.from(body.childNodes).forEach(n => {
                    if (n.nodeType === 3 && n.nodeValue.trim()) {
                        const p2 = document.createElement('p');
                        n.parentNode.insertBefore(p2, n);
                        p2.appendChild(n);
                    }
                });
            });
            const firstBody = this.body(this.pages()[0]);
            if (firstBody && !firstBody.firstChild) firstBody.innerHTML = '<p><br></p>';
        },

        contentLimit(page) {
            const cs = getComputedStyle(page);
            return page.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
        },

        schedule(immediate) {
            clearTimeout(this.timer);
            if (immediate) { this.reflow(); return; }
            this.timer = setTimeout(() => this.reflow(), 140);
        },

        // Moving a node inside a contenteditable makes the browser drop
        // the live selection to the top of the root — which would yank
        // the caret to page 1 mid-sentence. So the caret is captured
        // before a reflow and re-applied afterwards. Nodes are only ever
        // MOVED (never rebuilt), so the original boundary points stay
        // valid.
        captureCaret() {
            const ed = this.editor();
            if (!ed || (document.activeElement !== ed && !ed.contains(document.activeElement))) return null;
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return null;
            const r = sel.getRangeAt(0);
            if (!ed.contains(r.startContainer) || !ed.contains(r.endContainer)) return null;
            return { sc: r.startContainer, so: r.startOffset, ec: r.endContainer, eo: r.endOffset };
        },
        restoreCaret(c) {
            if (!c) return;
            const ed = this.editor();
            if (!c.sc.isConnected || !c.ec.isConnected) return;
            if (!ed.contains(c.sc) || !ed.contains(c.ec)) return;
            try {
                const r = document.createRange();
                r.setStart(c.sc, Math.min(c.so, c.sc.length !== undefined ? c.sc.length : c.sc.childNodes.length));
                r.setEnd(c.ec, Math.min(c.eo, c.ec.length !== undefined ? c.ec.length : c.ec.childNodes.length));
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(r);
                this.keepCaretVisible(r);
            } catch (e) {}
        },
        // When a reflow pushes the line you're typing onto the next
        // sheet, follow it instead of leaving the user staring at the
        // bottom of the previous page.
        keepCaretVisible(range) {
            const sc = UI.$('scroll-inner');
            if (!sc) return;
            let rect = range.getBoundingClientRect();
            if (!rect || (!rect.height && !rect.top)) {
                let n = range.startContainer;
                if (n.nodeType === 3) n = n.parentNode;
                if (!n || !n.getBoundingClientRect) return;
                rect = n.getBoundingClientRect();
            }
            const box = sc.getBoundingClientRect();
            if (rect.bottom > box.bottom - 12) sc.scrollTop += (rect.bottom - box.bottom) + 90;
            else if (rect.top < box.top + 12) sc.scrollTop -= (box.top - rect.top) + 60;
        },

        // ---- the reflow ------------------------------------------
        reflow(force) {
            const ed = this.editor();
            if (!ed || this.busy || !currentDocId) return;
            this.busy = true;
            const caret = this.captureCaret();
            try {
                this.normalize();

                // Web view = one continuous sheet, no pagination.
                if (document.body.classList.contains('view-web') || !this.enabled) {
                    const pages = this.pages();
                    if (pages.length > 1) {
                        const firstBody = this.body(pages[0]);
                        for (let i = 1; i < pages.length; i++) {
                            const b = this.body(pages[i]);
                            while (b && b.firstChild) firstBody.appendChild(b.firstChild);
                            pages[i].remove();
                        }
                    }
                    this.updateStatus();
                    return;
                }

                let pages = this.pages();
                // Clear any grown-sheet overrides so the page height we
                // measure against is always the true paper size.
                pages.forEach(p => { p.style.height = ''; p.style.minHeight = ''; });
                const limit = this.contentLimit(pages[0]);
                if (!limit || limit < 40) return; // hidden / not laid out yet

                // --- pass 1: honour explicit page breaks --------------
                for (let i = 0; i < pages.length; i++) {
                    const body = this.body(pages[i]);
                    const kids = Array.from(body.children);
                    const brkIdx = kids.findIndex((c, idx) => c.classList && c.classList.contains('page-break') && idx < kids.length - 1);
                    if (brkIdx === -1) continue;
                    let next = pages[i + 1];
                    if (!next) { next = this.newPage(); ed.appendChild(next); pages = this.pages(); }
                    const nextBody = this.body(next);
                    const move = kids.slice(brkIdx + 1);
                    for (let k = move.length - 1; k >= 0; k--) nextBody.insertBefore(move[k], nextBody.firstChild);
                }

                // --- pass 2: push overflow down -----------------------
                pages = this.pages();
                for (let i = 0; i < pages.length; i++) {
                    const body = this.body(pages[i]);
                    let guard = 0;
                    while (body.offsetHeight > limit && body.children.length > 1 && guard++ < 500) {
                        let next = pages[i + 1];
                        if (!next) { next = this.newPage(); ed.appendChild(next); pages = this.pages(); }
                        const nextBody = this.body(next);
                        nextBody.insertBefore(body.lastElementChild, nextBody.firstChild);
                    }
                    pages = this.pages();
                }

                // --- pass 3: pull content back up ---------------------
                // Pages that get fully drained are dropped straight away
                // so the next page's content keeps flowing upward instead
                // of the compaction stalling on an empty sheet.
                let i = 0;
                while (i < this.pages().length - 1) {
                    const body = this.body(this.pages()[i]);
                    let guard = 0;
                    while (guard++ < 800) {
                        const cur = this.pages();
                        if (i + 1 >= cur.length) break;
                        const last = body.lastElementChild;
                        if (last && last.classList && last.classList.contains('page-break')) break;
                        const nextPage = cur[i + 1];
                        const nextBody = this.body(nextPage);
                        if (!nextBody) break;
                        if (!nextBody.firstElementChild) {
                            if (!nextBody.textContent.trim()) { nextPage.remove(); continue; }
                            break;
                        }
                        const cand = nextBody.firstElementChild;
                        body.appendChild(cand);
                        if (body.offsetHeight > limit) { nextBody.insertBefore(cand, nextBody.firstChild); break; }
                    }
                    i++;
                }

                // --- pass 4: drop empty trailing pages ----------------
                pages = this.pages();
                for (let i = pages.length - 1; i > 0; i--) {
                    const b = this.body(pages[i]);
                    if (b && b.children.length === 0 && !b.textContent.trim()) pages[i].remove();
                }

                // --- pass 5: a single block taller than the sheet -----
                // It can't be split, so let that one sheet grow to fit
                // rather than letting text spill off the paper.
                this.pages().forEach(p => {
                    const b = this.body(p);
                    const over = !!b && b.offsetHeight > limit + 2;
                    if (over && b.children.length <= 1) {
                        p.style.height = 'auto';
                        p.style.minHeight = 'var(--page-h, 1056px)';
                        p.classList.remove('overflowing');
                    } else {
                        p.classList.toggle('overflowing', over);
                    }
                });

                this.updateStatus();
            } finally {
                this.busy = false;
                this.restoreCaret(caret);
            }
        },

        updateStatus() {
            const n = this.pages().length;
            const el = UI.$('page-count');
            if (el) el.innerText = n + (n === 1 ? ' Page' : ' Pages');
        },

        currentPageIndex() {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return 0;
            let n = sel.getRangeAt(0).startContainer;
            if (n.nodeType === 3) n = n.parentNode;
            const page = n && n.closest ? n.closest('.doc-page') : null;
            return page ? this.pages().indexOf(page) : 0;
        },

        caretToStart() {
            const body = this.body(this.pages()[0]);
            if (!body) return;
            let first = body.firstElementChild;
            if (!first) { body.innerHTML = '<p><br></p>'; first = body.firstElementChild; }
            const r = document.createRange();
            r.selectNodeContents(first);
            r.collapse(true);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(r);
        },
        caretToEnd() {
            const body = this.lastBody();
            if (!body) return;
            let last = body.lastElementChild;
            if (!last) { body.innerHTML = '<p><br></p>'; last = body.lastElementChild; }
            const r = document.createRange();
            r.selectNodeContents(last);
            r.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(r);
            this.editor().focus();
        },

        placeCaretAtStart(el) {
            if (!el) return;
            const r = document.createRange();
            r.selectNodeContents(el);
            r.collapse(true);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(r);
        },

        // Range.toString() ignores replaced elements, so a page that
        // starts with an image looked "empty before the caret" and
        // Backspace merged the whole sheet instead of deleting the image.
        // Cloning the range and checking for element content too fixes it.
        rangeIsEmpty(r) {
            if (r.toString().length) return false;
            const frag = r.cloneContents();
            return !frag.querySelector('img, video, audio, table, hr, br, .custom-shape, .doc-field, .doc-field-group, input, select, textarea, svg');
        },
        atStartOfBody(body) {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
            const r = document.createRange();
            r.selectNodeContents(body);
            try { r.setEnd(sel.anchorNode, sel.anchorOffset); } catch (e) { return false; }
            return this.rangeIsEmpty(r);
        },
        atEndOfBody(body) {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
            const r = document.createRange();
            r.selectNodeContents(body);
            try { r.setStart(sel.anchorNode, sel.anchorOffset); } catch (e) { return false; }
            return this.rangeIsEmpty(r);
        },

        // Keeps Backspace/Delete working naturally across page seams.
        handleEdgeDelete(e) {
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
            if (document.body.classList.contains('view-web')) return false;
            let n = sel.anchorNode;
            if (n && n.nodeType === 3) n = n.parentNode;
            const body = n && n.closest ? n.closest('.page-body') : null;
            if (!body) return false;
            const page = body.closest('.doc-page');

            if (e.key === 'Backspace' && this.atStartOfBody(body)) {
                const prev = page.previousElementSibling;
                if (!prev) return true; // start of document: swallow
                e.preventDefault();
                const prevBody = this.body(prev);
                const first = body.firstElementChild;
                while (body.firstChild) prevBody.appendChild(body.firstChild);
                page.remove();
                this.placeCaretAtStart(first);
                document.execCommand('delete');
                this.schedule(true);
                App.autoSave();
                return true;
            }
            if (e.key === 'Delete' && this.atEndOfBody(body)) {
                const next = page.nextElementSibling;
                if (!next) return true;
                e.preventDefault();
                const nextBody = this.body(next);
                const marker = body.lastElementChild;
                while (nextBody.firstChild) body.appendChild(nextBody.firstChild);
                next.remove();
                if (marker) {
                    const r = document.createRange();
                    r.selectNodeContents(marker); r.collapse(false);
                    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
                }
                document.execCommand('forwardDelete');
                this.schedule(true);
                App.autoSave();
                return true;
            }
            return false;
        },

        // Clicking the blank part of a sheet drops the caret at the end
        // of that sheet's content instead of doing nothing.
        handlePageClick(e) {
            const page = e.target.closest && e.target.closest('.doc-page');
            if (!page) return;
            if (e.target !== page) return; // clicked real content
            const body = this.body(page);
            if (!body) return;
            let last = body.lastElementChild;
            if (!last) { body.innerHTML = '<p><br></p>'; last = body.lastElementChild; }
            const r = document.createRange();
            r.selectNodeContents(last); r.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges(); sel.addRange(r);
            this.editor().focus();
        },

        setPageSize(w, h) {
            const ed = this.editor();
            if (w) ed.style.setProperty('--page-w', w);
            if (h) ed.style.setProperty('--page-h', h);
            this.schedule(true);
        }
    };

    // ============================================================
    //  APP — IndexedDB, events, custom actions
    // ============================================================
    const App = {
        async init() {
            await this.initDB();
            this.bindEvents();
            InteractiveManager.init();
            SelectionManager.init();
            this.refreshFiles();
            UI.renderCategories();
            FormatSidebar.init();
            // Mobile starts with the sidebar closed, so the no-file screen
            // shows the inline file picker instead of a dead-end message.
            if (window.innerWidth <= 768) UI.$('sidebar').classList.remove('mobile-open');
            UI.syncSidebarState();
            this.setNoFileState();
            const z = parseFloat(localStorage.getItem('zoom') || '1'); this.setZoom(z);
            try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
            try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
        },
        initDB() {
            return new Promise(r => {
                const req = indexedDB.open("UltHTMLWriter_V3", 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore("docs", { keyPath: "id", autoIncrement: true });
                req.onsuccess = e => { db = e.target.result; r(); };
            });
        },
        // ============================================================
        //  runCommand — the single funnel every execCommand goes through.
        //  Guarantees a usable selection exists first, so no formatting
        //  option can silently do nothing because focus moved.
        // ============================================================
        INLINE_CMDS: ['bold','italic','underline','strikethrough','superscript','subscript',
                      'fontName','fontSize','foreColor','hiliteColor','backColor','removeFormat','createLink','unlink'],
        focusEditor() {
            const ed = UI.$('editor');
            if (document.activeElement !== ed && !ed.contains(document.activeElement)) {
                try { ed.focus({ preventScroll: true }); } catch (e) { ed.focus(); }
            }
            return ed;
        },
        runCommand(cmd, value, cfg) {
            if (!currentDocId) return false;
            this.focusEditor();
            if (this.INLINE_CMDS.includes(cmd)) {
                if (!SelectionManager.ensureRange()) {
                    // Nothing at all to format (empty document)
                    UI.toast('Nothing to format yet — type something first.');
                    return false;
                }
            } else if (cmd !== 'undo' && cmd !== 'redo') {
                SelectionManager.restore();
            }
            let ok = false;
            try { ok = document.execCommand(cmd, false, value === undefined ? null : value); } catch (e) { ok = false; }
            SelectionManager.save();
            Paginator.schedule();
            return ok;
        },
        wrapSelection(customCSS) {
            const ed = UI.$('editor');
            this.focusEditor();
            if (!SelectionManager.ensureRange()) {
                UI.toast("Nothing to format yet — type something first.");
                return null;
            }
            const sel = window.getSelection();
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.cssText = customCSS;
            try {
                span.appendChild(range.extractContents());
                range.insertNode(span);
                const newRange = document.createRange();
                newRange.selectNodeContents(span);
                sel.removeAllRanges(); sel.addRange(newRange);
                SelectionManager.save();
                return span;
            } catch (e) { UI.toast("Error wrapping selection."); return null; }
        },

        execWithSelection(cmd, value) {
            this.focusEditor();
            if (!SelectionManager.ensureRange()) {
                UI.toast("Nothing to format yet — type something first.");
                return false;
            }
            document.execCommand(cmd, false, value);
            SelectionManager.save();
            Paginator.schedule();
            return true;
        },
        insertHTML(html) {
            const ed = this.focusEditor();
            SelectionManager.restore();
            // Make sure the caret is actually inside a page body, never
            // directly on the page/root (which would break pagination).
            const sel = window.getSelection();
            if (!sel.rangeCount || !ed.contains(sel.getRangeAt(0).startContainer)) Paginator.caretToEnd();
            document.execCommand('insertHTML', false, html);
            App.autoSave();
            Paginator.schedule();
            InteractiveManager.scheduleUpdate();
        },

        esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },

        // ============================================================
        //  SANITISER — documents that come in from a file (or a paste)
        //  are stripped of every executable thing before they touch the
        //  editor, and the same pass runs again on the way out so an
        //  exported file can never ship JavaScript.
        // ============================================================
        DANGEROUS_TAGS: ['script','iframe','object','embed','applet','frame','frameset','noscript','base','meta','link','form','template'],
        sanitizeHtml(html, opts) {
            opts = opts || {};
            const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
            const root = doc.body;
            let removed = 0;

            // 1. executable / external-resource elements
            this.DANGEROUS_TAGS.forEach(tag => {
                root.querySelectorAll(tag).forEach(n => {
                    if (tag === 'form') { // keep the fields, drop the form
                        while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
                    }
                    n.remove(); removed++;
                });
            });
            // 2. inline handlers, javascript: URLs, srcdoc
            root.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const val = (attr.value || '').replace(/[\s\u0000-\u001f]/g, '').toLowerCase();
                    if (name.startsWith('on')) { el.removeAttribute(attr.name); removed++; return; }
                    if (name === 'srcdoc' || name === 'formaction' || name === 'ping') { el.removeAttribute(attr.name); removed++; return; }
                    if ((name === 'href' || name === 'src' || name === 'action' || name === 'xlink:href') &&
                        (val.startsWith('javascript:') || val.startsWith('vbscript:') || val.startsWith('data:text/html'))) {
                        el.removeAttribute(attr.name); removed++;
                    }
                    if (name === 'style' && /expression\s*\(|javascript:/i.test(attr.value || '')) {
                        el.removeAttribute(attr.name); removed++;
                    }
                });
                // 3. everything stays editable — no imported node may opt
                //    itself out of editing (our own fields are re-marked
                //    afterwards by markFieldsUneditable()).
                if (el.hasAttribute('contenteditable')) el.removeAttribute('contenteditable');
                if (el.hasAttribute('draggable')) el.removeAttribute('draggable');
                // strip ids that would collide with the app's own elements
                if (el.id && document.getElementById(el.id) && !el.closest('#editor')) el.removeAttribute('id');
            });
            this._lastStripped = removed;
            return root.innerHTML;
        },
        // Re-applies contenteditable="false" to our own field shells after
        // a sanitise pass (so imported/pasted fields keep working).
        markFieldsUneditable(scope) {
            (scope || UI.$('editor')).querySelectorAll('.doc-field, .doc-field-group').forEach(f => {
                f.setAttribute('contenteditable', 'false');
                f.querySelectorAll('.df-label, .df-text').forEach(t => t.setAttribute('contenteditable', 'true'));
            });
            (scope || UI.$('editor')).querySelectorAll('.image-caption, .shape-label').forEach(t =>
                t.setAttribute('contenteditable', 'true'));
        },
        // Rewrites a stylesheet so its rules can only ever apply inside
        // the document body — an imported file can't restyle the app.
        scopeCss(css, scope) {
            if (!css) return '';
            css = css.replace(/\/\*[\s\S]*?\*\//g, '');
            const out = [];
            let i = 0;
            const readBlock = (start) => { // returns index just past matching }
                let depth = 0;
                for (let j = start; j < css.length; j++) {
                    if (css[j] === '{') depth++;
                    else if (css[j] === '}') { depth--; if (!depth) return j + 1; }
                }
                return css.length;
            };
            while (i < css.length) {
                const brace = css.indexOf('{', i);
                if (brace === -1) break;
                const prelude = css.slice(i, brace).trim();
                const end = readBlock(brace);
                const body = css.slice(brace + 1, end - 1);
                if (/^@(media|supports|layer|container)/i.test(prelude)) {
                    out.push(prelude + '{' + this.scopeCss(body, scope) + '}');
                } else if (/^@(font-face|keyframes|-webkit-keyframes|page)/i.test(prelude)) {
                    out.push(prelude + '{' + body + '}');
                } else if (/^@(import|charset|namespace)/i.test(prelude)) {
                    /* dropped */
                } else if (prelude) {
                    const sel = prelude.split(',').map(s => {
                        s = s.trim();
                        if (!s) return '';
                        if (/^(html|body|:root)\b/i.test(s)) {
                            const rest = s.replace(/^(html|body|:root)\b/i, '').trim();
                            return rest ? scope + ' ' + rest : scope;
                        }
                        return scope + ' ' + s;
                    }).filter(Boolean).join(', ');
                    if (sel) out.push(sel + '{' + body + '}');
                }
                i = end;
            }
            return out.join('\n');
        },
        cssLen(v) {
            v = (v || '').trim();
            if (!v || v === 'auto') return '';
            return /^-?\d*\.?\d+$/.test(v) ? v + 'px' : v;
        },
        // Insert a node at the caret using real DOM APIs. execCommand
        // ('insertHTML') mangles/duplicates contenteditable="false"
        // objects like form fields, so fields never go through it.
        insertNode(html) {
            const ed = this.focusEditor();
            SelectionManager.restore();
            let sel = window.getSelection();
            if (!sel.rangeCount || !ed.contains(sel.getRangeAt(0).startContainer)) {
                Paginator.caretToEnd();
                sel = window.getSelection();
            }
            if (!sel.rangeCount) return null;
            const range = sel.getRangeAt(0);
            range.deleteContents();
            const tpl = document.createElement('template');
            tpl.innerHTML = html.trim();
            const node = tpl.content.firstElementChild;
            if (!node) return null;
            range.insertNode(node);
            // A trailing space keeps the caret usable right after the object
            const after = document.createTextNode(' ');
            node.parentNode.insertBefore(after, node.nextSibling);
            const r2 = document.createRange();
            r2.setStart(after, 1); r2.collapse(true);
            sel.removeAllRanges(); sel.addRange(r2);
            SelectionManager.save();
            return node;
        },
        // Inserts a field object, then selects it so the Formatting
        // sidebar / size handles apply to it straight away.
        insertField(html) {
            const el = this.insertNode(html);
            if (!el) { UI.toast('Place the cursor in the document first'); return; }
            InteractiveManager.activeTarget = el;
            InteractiveManager.activeCell = null;
            InteractiveManager.scheduleUpdate();
            FormatSidebar.setTarget(el);
            Paginator.schedule(true);
            this.autoSave();
            this.updateWordCount();
        },

        styleTarget(el, opts) {
            opts = opts || {};
            // Save the selection BEFORE the modal steals focus
            SelectionManager.save();
            // For shapes, the SVG inside has its own fill colors that
            // need to be overridden when the user "fills" the shape.
            const isShape = el.classList && el.classList.contains('custom-shape');
            const recolorShape = (css) => {
                // Apply the color to every fillable child of the SVG.
                // Works for solid colors (sets `fill`) and gradients
                // (sets `fill` to the gradient string — browsers honor
                // gradient URLs/fns in `fill`).
                const svg = el.querySelector('svg');
                if (!svg) return;
                svg.querySelectorAll('[fill]').forEach(node => {
                    // Skip strokes — user chose fill
                    if (node.getAttribute('fill') === 'none') return;
                    node.setAttribute('fill', css);
                });
                // For shapes that draw strokes (lightning, check, cross)
                // also apply the color to the stroke.
                svg.querySelectorAll('[stroke]').forEach(node => {
                    if (!node.getAttribute('stroke')) return;
                    node.setAttribute('stroke', css);
                });
            };
            ColorPanel.open({
                title: opts.title || 'Style Element',
                showTextOption: opts.showTextOption !== false,
                isText: opts.isText || false,
                onApply: res => {
                    if (res.clear) {
                        if (res.applyTo === 'text') { el.style.background = ''; el.style.backgroundClip=''; el.style.webkitBackgroundClip=''; el.style.webkitTextFillColor=''; el.style.color = ''; }
                        else {
                            el.style.background = '';
                            if (isShape) {
                                // Restore original shape colors by clearing
                                // our overrides so the inline SVG fills take
                                // over again.
                                const svg = el.querySelector('svg');
                                if (svg) {
                                    svg.querySelectorAll('[fill]').forEach(n => n.removeAttribute('fill'));
                                    svg.querySelectorAll('[stroke]').forEach(n => n.removeAttribute('stroke'));
                                }
                            }
                        }
                    } else {
                        if (res.applyTo === 'text') {
                            if (res.state.mode === 'solid') { el.style.color = res.css; el.style.background = ''; el.style.webkitBackgroundClip=''; el.style.webkitTextFillColor=''; }
                            else { el.style.background = res.css; el.style.webkitBackgroundClip = 'text'; el.style.backgroundClip = 'text'; el.style.webkitTextFillColor = 'transparent'; el.style.color = 'transparent'; }
                        } else {
                            el.style.background = res.css;
                            if (isShape) recolorShape(res.css);
                        }
                    }
                    InteractiveManager.scheduleUpdate();
                    App.autoSave();
                }
            });
        },

        bindEvents() {
            const ed = UI.$('editor');
            ed.addEventListener('mouseup', UI.updateToolbarState);
            ed.addEventListener('keyup', () => { UI.updateToolbarState(); this.autoSave(); this.updateWordCount(); });
            ed.addEventListener('input', () => { Paginator.schedule(); });
            // Pasted HTML goes through the same sanitiser as opened
            // files: no scripts, no handlers, nothing un-editable.
            ed.addEventListener('paste', e => {
                const cd = e.clipboardData;
                if (!cd) { setTimeout(() => Paginator.schedule(true), 30); return; }
                const html = cd.getData('text/html');
                if (html) {
                    e.preventDefault();
                    const clean = App.sanitizeHtml(html);
                    document.execCommand('insertHTML', false, clean);
                    App.markFieldsUneditable();
                    Paginator.schedule(true);
                    App.autoSave();
                } else {
                    setTimeout(() => { Paginator.schedule(true); App.autoSave(); }, 30);
                }
            });
            ed.addEventListener('keydown', e => {
                if (!currentDocId) return;
                // Page-seam aware Backspace / Delete
                if ((e.key === 'Backspace' || e.key === 'Delete') && Paginator.handleEdgeDelete(e)) return;
                // ESC inside a code block: exit the block by placing the
                // caret in the trailing paragraph after the <pre>.
                if (e.key === 'Escape') {
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount) {
                        const node = sel.getRangeAt(0).startContainer;
                        const pre = node.nodeType === 1 ? node.closest('pre') : node.parentNode && node.parentNode.closest('pre');
                        if (pre && ed.contains(pre)) {
                            e.preventDefault();
                            // Create a fresh paragraph after the pre if none
                            // exists, then move caret into it.
                            let after = pre.nextElementSibling;
                            if (!after || after.tagName !== 'P') {
                                after = document.createElement('p');
                                after.appendChild(document.createElement('br'));
                                pre.parentNode.insertBefore(after, pre.nextSibling);
                            }
                            const range = document.createRange();
                            range.setStart(after, 0);
                            range.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(range);
                            ed.focus();
                            return;
                        }
                    }
                    if (document.body.classList.contains('fullscreen')) App.toggleFullscreen(false);
                    else if (UI.$('find-bar').classList.contains('active')) FindReplace.close();
                    return;
                }
                if (e.ctrlKey || e.metaKey) {
                    const key = e.key.toLowerCase();
                    let handled = false;
                    if (key === 'z') { if (e.shiftKey) document.execCommand('redo'); else document.execCommand('undo'); handled = true; }
                    else if (key === 'y') { document.execCommand('redo'); handled = true; }
                    else if (key === 'b') { document.execCommand('bold'); handled = true; }
                    else if (key === 'i') { document.execCommand('italic'); handled = true; }
                    else if (key === 'u') { document.execCommand('underline'); handled = true; }
                    else if (key === 's') { App.autoSave(); UI.toast("Saved"); handled = true; }
                    else if (key === 'f') { FindReplace.open(); handled = true; }
                    if (handled) { e.preventDefault(); UI.updateToolbarState(); App.autoSave(); }
                }
            });

            // Click-outside clears the interactive target so the overlay
            // doesn't follow the user around after they've finished,
            // AND ensures every code block has a follow-up paragraph so
            // the user always has somewhere to type after exiting.
            ed.addEventListener('click', e => {
                const t = e.target;
                Paginator.handlePageClick(e);
                // Code block exit guarantee
                if (!t.closest('pre')) {
                    ed.querySelectorAll('pre').forEach(pre => {
                        const next = pre.nextElementSibling;
                        if (!next || next.tagName !== 'P') {
                            const p = document.createElement('p');
                            p.appendChild(document.createElement('br'));
                            pre.parentNode.insertBefore(p, pre.nextSibling);
                        }
                    });
                }
                // Clear interactive overlay when clicking editable text
                if (!t.closest('img, video, audio, table, .custom-shape, hr, pre, .image-caption, .shape-label')) {
                    InteractiveManager.activeTarget = null;
                    InteractiveManager.activeCell = null;
                    InteractiveManager.scheduleUpdate();
                }
            });

            // Context Menu
            const cm = UI.$('context-menu');
            // The file list re-uses this element, so keep a pristine copy
            // of the editor menu and restore it before every open.
            App._editorMenuHTML = cm.innerHTML;
            let contextTarget = null;
            ed.addEventListener('contextmenu', e => {
                if (!currentDocId) return;
                e.preventDefault();
                if (cm.dataset.mode === 'file') {
                    cm.innerHTML = App._editorMenuHTML;
                    App.bindContextItems();
                }
                cm.dataset.mode = 'editor';
                contextTarget = null;
                SelectionManager.save();
                if (InteractiveManager.activeTarget && ed.contains(InteractiveManager.activeTarget)) contextTarget = InteractiveManager.activeTarget;
                else if (window.getSelection().rangeCount > 0 && !window.getSelection().isCollapsed) contextTarget = "selection";
                else contextTarget = e.target;
                App._contextTarget = contextTarget;
                cm.style.display = 'block';
                let x = e.pageX, y = e.pageY;
                if (x + cm.offsetWidth > window.innerWidth) x = window.innerWidth - cm.offsetWidth - 10;
                if (y + cm.offsetHeight > window.innerHeight) y = window.innerHeight - cm.offsetHeight - 10;
                cm.style.left = x + 'px'; cm.style.top = y + 'px';
            });
            document.addEventListener('click', e => { if (!e.target.closest('#context-menu')) cm.style.display = 'none'; });
            this.bindContextItems();
            this.bindChrome();
        },

        // Bound separately so the menu can be rebuilt (the sidebar file
        // menu borrows the same element) without losing its handlers.
        bindContextItems() {
            const ed = UI.$('editor');
            const cm = UI.$('context-menu');
            cm.querySelectorAll('.context-menu-item').forEach(item => {
                SelectionManager.protect(item);
                item.onclick = async () => {
                    const action = item.dataset.action;
                    const contextTarget = App._contextTarget;
                    try {
                        App.focusEditor();
                        SelectionManager.restore();
                        if (action === 'cut') { document.execCommand('cut'); App.autoSave(); Paginator.schedule(); }
                        else if (action === 'copy') document.execCommand('copy');
                        else if (action === 'paste') {
                            try { const text = await navigator.clipboard.readText(); document.execCommand('insertText', false, text); App.autoSave(); Paginator.schedule(); }
                            catch (err) { UI.toast("Use Ctrl+V / long-press to paste."); }
                        }
                        else if (action === 'selectAll') document.execCommand('selectAll');
                        else if (action === 'clearFormat') { App.runCommand('removeFormat'); App.autoSave(); }
                        else if (action === 'formatting' || action === 'objectSize') {
                            let tgt = contextTarget;
                            if (tgt && tgt !== 'selection' && tgt.nodeType === 1 &&
                                !tgt.closest('img, video, audio, table, .custom-shape, .doc-field, .doc-field-group, hr')) {
                                tgt = 'selection';
                            }
                            if (tgt === 'selection' || !tgt) {
                                FormatSidebar.openForCurrent(action === 'objectSize' ? 'Size' : undefined);
                            } else {
                                FormatSidebar.setTarget(tgt);
                                if (action === 'objectSize') {
                                    FormatSidebar.activeTab = 'Size';
                                    UI.$('fmt-tabs').querySelectorAll('.fmt-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'Size'));
                                }
                                FormatSidebar.open();
                            }
                        }
                        else if (action === 'styleTarget') {
                            let tgt = contextTarget;
                            if (tgt === "selection") tgt = App.wrapSelection("");
                            if (!tgt || !tgt.style) return;
                            App.styleTarget(tgt);
                        }
                        else if (action === 'setCss') {
                            let tgt = contextTarget;
                            if (tgt === "selection") tgt = App.wrapSelection("");
                            if (!tgt) return;
                            const m = UI.modal(`<h3>Set Custom CSS</h3><div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">Example: <code>border: 2px solid red; background: linear-gradient(red, blue);</code></div><textarea id="css-in">${tgt.style.cssText}</textarea><div class="modal-btns"><button class="btn btn-ghost" id="css-cancel">Cancel</button><button class="btn btn-primary" id="css-save">Apply</button></div>`);
                            UI.$('css-cancel').onclick = m.close;
                            UI.$('css-save').onclick = () => { tgt.style.cssText = UI.$('css-in').value; InteractiveManager.scheduleUpdate(); App.autoSave(); m.close(); };
                        }
                    } catch (err) { console.error(err); }
                    cm.style.display = 'none';
                    UI.updateToolbarState();
                };
            });
        },

        // Everything below is bound EXACTLY ONCE. It used to live inside
        // bindContextItems(), which is re-run whenever the context menu
        // is rebuilt — so listeners piled up on every right-click.
        bindChrome() {
            const ed = UI.$('editor');
            UI.$('toolbar-back').onclick = UI.closeTools;
            UI.$('toggle-sidebar').onclick = () => UI.toggleSidebar();
            UI.$('mobile-overlay').onclick = () => UI.toggleSidebar(false);
            UI.$('toggle-find').onclick = () => FindReplace.open();

            document.querySelectorAll('.toolbar-slide').forEach(el => {
                el.addEventListener('wheel', (e) => { if (e.deltaY !== 0) { e.preventDefault(); el.scrollLeft += e.deltaY; } });
            });

            UI.$('toggle-theme').onclick = () => {
                document.body.classList.toggle('dark-mode'); document.documentElement.classList.toggle('dark-mode');
                localStorage.setItem('appTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            };

            // View toggle: Classic page vs Web view (full-width fluid)
            UI.$('view-toggle').addEventListener('click', e => {
                const btn = e.target.closest('button[data-view]');
                if (!btn) return;
                const mode = btn.dataset.view;
                UI.$('view-toggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
                document.body.classList.toggle('view-web', mode === 'web');
                localStorage.setItem('viewMode', mode);
                Paginator.schedule(true);
                InteractiveManager.scheduleUpdate();
            });
            // Restore saved view mode
            const savedView = localStorage.getItem('viewMode');
            if (savedView === 'web') {
                document.body.classList.add('view-web');
                UI.$('view-toggle').querySelectorAll('button').forEach(b =>
                    b.classList.toggle('active', b.dataset.view === 'web'));
            }
